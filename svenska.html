<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edgar – Svenska grammatik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF3F6; --paper:#FFFFFF; --ink:#1D2B3A; --soft:#4A5A6B; --line:#D3DEE6; --field:#F7FAFC;
  --ok:#2E8B57; --okt:#E3F4EA; --bad:#C0392B; --badt:#FBE3E0; --mid:#B7791F; --midt:#FDF1DC;
  --his:#3566B8;--del:#8653B8;--arv:#B8661A;--dna:#2F8A5E;--epi:#B8467C;--gte:#13807A;--rep:#4A5A6B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161E26; --paper:#1F2933; --ink:#E9EFF4; --soft:#AAB8C5; --line:#33414E; --field:#18212A;
    --ok:#5CC08F; --okt:#1D3A2C; --bad:#EE6E6E; --badt:#43262A; --mid:#E8B65A; --midt:#3D3220;
    --his:#7FA6E8;--del:#B48BE3;--arv:#F0A452;--dna:#5CC08F;--epi:#EB86B6;--gte:#4FC4B8;--rep:#AAB8C5;
  }
}
:root[data-theme="dark"]{
  --bg:#161E26; --paper:#1F2933; --ink:#E9EFF4; --soft:#AAB8C5; --line:#33414E; --field:#18212A;
  --ok:#5CC08F; --okt:#1D3A2C; --bad:#EE6E6E; --badt:#43262A; --mid:#E8B65A; --midt:#3D3220;
  --his:#7FA6E8;--del:#B48BE3;--arv:#F0A452;--dna:#5CC08F;--epi:#EB86B6;--gte:#4FC4B8;--rep:#AAB8C5;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",Verdana,"Segoe UI",sans-serif;font-size:1.1rem;line-height:1.7;letter-spacing:.01em}
.wrap{max-width:48rem;margin:0 auto;padding:1.2rem 1rem 4rem}
h1{font-size:2rem;line-height:1.2;margin:.4rem 0 .4rem}
h2{font-size:1.4rem;line-height:1.3;margin:0 0 .5rem}
h3{font-size:1.12rem;margin:1rem 0 .3rem}
p{margin:.4rem 0 .8rem}
a{color:inherit}
.soft{color:var(--soft)}
.small{font-size:.95rem}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{font-size:1rem;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.45rem .9rem;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
.btn.main{background:var(--c,#3566B8);border-color:var(--c,#3566B8);color:#fff;font-weight:500}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.count{color:var(--soft);font-size:.95rem;margin-left:auto}
.topnav{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 1rem}
.topnav a{font-size:.95rem;text-decoration:none;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.25rem .8rem}
.topnav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--paper);border-radius:14px;padding:1.1rem 1.2rem;margin:0 0 1.1rem;border:2px solid var(--line)}
.card.k{border-left:10px solid var(--c)}
.hero{border-left:10px solid var(--c);background:var(--paper);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.2rem}
.hero .big{font-size:2.6rem;font-weight:700;line-height:1;color:var(--c)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.stat{display:flex;gap:1rem;flex-wrap:wrap;font-size:.95rem}
.stat span b{font-size:1.1rem}
.passlist{list-style:none;padding:0;margin:0}
.passlist li{margin:.35rem 0}
.passlist a{display:flex;gap:.7rem;align-items:center;text-decoration:none;padding:.5rem .7rem;border-radius:10px;background:var(--ct);border:2px solid transparent}
.passlist a:hover{border-color:var(--c)}
.passlist .num{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;font-weight:700}
.passlist .done .num{background:var(--ok)}
.passlist .meta{font-size:.9rem;color:var(--soft);display:block}
.wk{margin:1.1rem 0 .2rem;font-weight:700}
.step{background:var(--paper);border-radius:14px;padding:1rem 1.2rem;margin:0 0 1rem;border:2px solid var(--line);position:relative}
.step>h2{display:flex;gap:.6rem;align-items:center;font-size:1.25rem}
.step>h2 .sn{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--c);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center}
.step.isdone>h2 .sn{background:var(--ok)}
.stepdone{margin-left:auto;font-size:.9rem;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.15rem .7rem;cursor:pointer;min-height:36px}
.stepdone[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tip{background:var(--ct);border-radius:10px;padding:.6rem .9rem;margin:.6rem 0}
textarea,input[type=text],input[type=number],select{font:inherit;font-size:1rem;width:100%;border:2px solid var(--line);border-radius:10px;padding:.5rem .7rem;background:var(--field);color:var(--ink)}
textarea{min-height:5.5rem;resize:vertical;line-height:1.5}
.qc{border-top:2px solid var(--line);padding:.8rem 0}
.qc:first-of-type{border-top:0}
.qc .qt{font-weight:500;margin:0 0 .4rem;display:flex;gap:.5rem;align-items:flex-start}
.qc .qt .from{font-size:.8rem;font-weight:400;color:var(--soft);white-space:nowrap}
.ans{background:var(--okt);border-radius:10px;padding:.6rem .9rem;margin:.5rem 0}
.ans p{margin:.2rem 0 .4rem}
.grade{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.grade button{font-size:.95rem;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.2rem .8rem;cursor:pointer;min-height:40px}
.grade button.on.g0{background:var(--ok);border-color:var(--ok);color:#fff}
.grade button.on.g1{background:var(--mid);border-color:var(--mid);color:#fff}
.grade button.on.g2{background:var(--bad);border-color:var(--bad);color:#fff}
.say{font-size:.9rem;border:2px solid var(--line);background:transparent;border-radius:999px;padding:.05rem .65rem;cursor:pointer;flex:none}
.pts{list-style:none;padding:0;margin:.4rem 0}
.pts li{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem .5rem;border-radius:8px;margin:.2rem 0}
.pts li.hit{background:var(--okt)}
.pts li .mk{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--soft);margin-top:.25rem;cursor:pointer;background:transparent;padding:0}
.pts li.hit .mk{background:var(--ok);border-color:var(--ok)}
.exl{display:flex;flex-wrap:wrap;gap:.5rem}
.exl a{text-decoration:none;border:2px solid var(--c);border-radius:10px;padding:.4rem .8rem;background:var(--ct);font-size:1rem}
.exl a.done{border-color:var(--ok)}
.exl a.done::before{content:"✓ ";color:var(--ok);font-weight:700}
/* exercises */
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .9rem}
.tabs button{font-size:.95rem;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .8rem;cursor:pointer;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--c,#3566B8);border-color:var(--c,#3566B8);color:#fff}
.grp{width:100%;font-size:.88rem;color:var(--soft);margin:.3rem 0 -.1rem}
.answer{display:flex;flex-wrap:wrap;gap:.4rem;min-height:3rem;padding:.5rem;border-radius:10px;border:2px dashed var(--line);margin:.6rem 0}
.answer span{background:var(--c);color:#fff;border-radius:8px;padding:.2rem .7rem;line-height:1.4}
.pool{display:flex;flex-wrap:wrap;gap:.5rem}
.pool button{font-size:1rem;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.45rem .8rem;cursor:pointer;min-height:44px;text-align:left;line-height:1.35}
.pool button.wrong,.chip.wrong{border-color:var(--bad);animation:shake .3s}
.pool button.right{background:var(--ok);border-color:var(--ok);color:#fff}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.msg{font-weight:500;min-height:1.6rem}
.figscroll{overflow-x:auto;border-radius:10px;background:#fff;border:2px solid var(--line)}
.fig{position:relative;width:100%;margin:0 auto}
.fig img{display:block;width:100%;height:auto}
.zone{position:absolute;border:2px dashed #E08A1E;border-radius:6px;background:rgba(255,248,235,.97);display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1.1;color:#1D2B3A;cursor:pointer;padding:0 3px;text-align:center;font-weight:600}
.zone.ok{border:2px solid #2E8B57;background:#E3F4EA;color:#1D5E3A}
.zone.shown{border:2px solid #7D8B99;background:#EEF1F4;color:#4A5A6B}
.zone.no{border-color:#C0392B;background:#FBE3E0;animation:shake .3s}
.picking .zone:not(.ok):not(.shown){background:rgba(232,240,252,.97);border-color:#3878B8}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0 .4rem}
.chip{font-size:1rem;border:2px solid var(--c,#E08A1E);background:var(--paper);color:var(--ink);border-radius:10px;padding:.4rem .75rem;cursor:grab;min-height:44px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;line-height:1.35}
.chip.sel{background:var(--c,#E08A1E);color:#fff}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin:1rem 0 .4rem}
.bucket{border:2px dashed var(--c);border-radius:12px;padding:.5rem;min-height:6rem;cursor:pointer;background:var(--ct)}
.bucket h3{margin:0 0 .4rem;font-size:1rem;text-align:center}
.bucket .in{font-size:.88rem;background:var(--ok);color:#fff;border-radius:8px;padding:.2rem .5rem;margin:.25rem 0;line-height:1.35}
.bucket.no{border-color:var(--bad);animation:shake .3s}
.picking2 .bucket{border-style:solid}
/* punnett */
.pun{display:grid;gap:4px;margin:.8rem 0;max-width:24rem}
.pun div{border:2px solid var(--line);border-radius:8px;min-height:3rem;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1.05rem;background:var(--paper)}
.pun .h{background:var(--ct);border-color:var(--c)}
.pun .e{border-color:transparent;background:transparent}
.pun .cell{cursor:pointer;border-style:dashed}
.pun .cell.sel{border-color:#3878B8;border-style:solid;background:rgba(56,120,184,.12)}
.pun .cell.ok{border-color:var(--ok);border-style:solid;background:var(--okt)}
.pun .cell.no{border-color:var(--bad);animation:shake .3s}
.par{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;font-size:1.05rem}
.par b{font-size:1.2rem}
/* codon */
.dna{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;letter-spacing:.05em;word-break:break-word;background:var(--field);border-radius:8px;padding:.4rem .6rem;border:2px solid var(--line)}
.dna mark{background:#F2D06B;color:#1D2B3A;border-radius:3px}
.cods{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.cods label{display:flex;flex-direction:column;gap:.2rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;align-items:flex-start}
.cods select{width:auto;min-width:8.5rem;font-family:inherit}
.cods select.ok{border-color:var(--ok);background:var(--okt)}
.cods select.no{border-color:var(--bad);background:var(--badt)}
.ctab{overflow-x:auto}
.ctab table{border-collapse:collapse;font-size:.85rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.ctab td,.ctab th{border:1px solid var(--line);padding:.15rem .35rem;vertical-align:top;white-space:nowrap}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;font-size:1rem}
.cmp .lbl{color:var(--soft)}
.aa{display:inline-block;border-radius:6px;padding:0 .3rem;margin:.1rem}
.aa.diff{background:var(--badt);outline:2px solid var(--bad)}
.letters{display:flex;flex-wrap:wrap;gap:.25rem;margin:.5rem 0}
.letters button{min-width:2.2rem;min-height:2.4rem;border:2px solid var(--line);border-radius:6px;background:var(--paper);font-weight:700;cursor:pointer}
.words{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;letter-spacing:.08em}
/* pedigree */
.ped{background:#fff;border:2px solid var(--line);border-radius:10px;overflow-x:auto}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.9rem;color:var(--soft);margin:.4rem 0}
/* canvas */
.canv{border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block;width:100%;height:380px}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.tools button{min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--ink)}
.kw{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.kw span{border-radius:999px;padding:.1rem .7rem;font-size:.92rem;border:2px solid var(--line)}
.kw span.hit{background:var(--okt);border-color:var(--ok)}
.kw span.miss{background:var(--midt);border-color:var(--mid)}
/* begrepp */
.term{border-left:6px solid var(--c);padding:.5rem .9rem;margin:.6rem 0;background:var(--ct);border-radius:0 10px 10px 0}
.term h3{margin:0;display:flex;gap:.6rem;align-items:center}
.term p{margin:.15rem 0}
.term .exm{color:var(--soft)}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:.6rem}
.match>div{display:flex;flex-direction:column;gap:.5rem}
.match button{font-size:1rem;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.5rem .7rem;cursor:pointer;line-height:1.4}
.match button.sel{border-color:#3878B8;background:rgba(56,120,184,.15)}
.match button.done{border-color:var(--ok);background:var(--okt);cursor:default}
.match button.wrong{border-color:var(--bad);animation:shake .3s}
.exq{font-size:1.2rem;font-weight:500;padding:1rem;border-radius:12px;background:var(--ct);margin:.4rem 0 .8rem}
.fcard{min-height:9rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:14px;padding:1.2rem;margin:.6rem 0;cursor:pointer;border:3px solid var(--c);background:var(--ct);font-size:1.25rem;font-weight:500;width:100%;color:var(--ink)}
.fcard small{display:block;font-size:.9rem;color:var(--soft);font-weight:400;margin-top:.5rem}
.note{border:2px dashed var(--line);border-radius:12px;padding:.6rem .9rem;font-size:.98rem;color:var(--soft)}
.sync{font-size:.85rem;color:var(--soft)}
footer{color:var(--soft);font-size:.92rem;margin-top:2rem}
@media (max-width:520px){h1{font-size:1.65rem}.match{grid-template-columns:1fr 1.3fr}.match button{font-size:.9rem}body{font-size:1.05rem}}
.k-his{--c:#3566B8;--ct:rgba(53,102,184,0.1)}.k-del{--c:#8653B8;--ct:rgba(134,83,184,0.1)}.k-arv{--c:#B8661A;--ct:rgba(184,102,26,0.1)}.k-dna{--c:#2F8A5E;--ct:rgba(47,138,94,0.1)}.k-epi{--c:#B8467C;--ct:rgba(184,70,124,0.1)}.k-gte{--c:#13807A;--ct:rgba(19,128,122,0.1)}.k-rep{--c:#4A5A6B;--ct:rgba(74,90,107,0.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-his{--c:#7FA6E8;--ct:rgba(127,166,232,0.14)}:root:not([data-theme="light"]) .k-del{--c:#B48BE3;--ct:rgba(180,139,227,0.14)}:root:not([data-theme="light"]) .k-arv{--c:#F0A452;--ct:rgba(240,164,82,0.14)}:root:not([data-theme="light"]) .k-dna{--c:#5CC08F;--ct:rgba(92,192,143,0.14)}:root:not([data-theme="light"]) .k-epi{--c:#EB86B6;--ct:rgba(235,134,182,0.14)}:root:not([data-theme="light"]) .k-gte{--c:#4FC4B8;--ct:rgba(79,196,184,0.14)}:root:not([data-theme="light"]) .k-rep{--c:#AAB8C5;--ct:rgba(170,184,197,0.14)}:root:not([data-theme="light"]) .btn.main,:root:not([data-theme="light"]) .passlist .num,:root:not([data-theme="light"]) .step>h2 .sn,:root:not([data-theme="light"]) .tabs button[aria-pressed="true"],:root:not([data-theme="light"]) .answer span,:root:not([data-theme="light"]) .chip.sel{color:#161E26}}
:root[data-theme="dark"] .k-his{--c:#7FA6E8;--ct:rgba(127,166,232,0.14)}:root[data-theme="dark"] .k-del{--c:#B48BE3;--ct:rgba(180,139,227,0.14)}:root[data-theme="dark"] .k-arv{--c:#F0A452;--ct:rgba(240,164,82,0.14)}:root[data-theme="dark"] .k-dna{--c:#5CC08F;--ct:rgba(92,192,143,0.14)}:root[data-theme="dark"] .k-epi{--c:#EB86B6;--ct:rgba(235,134,182,0.14)}:root[data-theme="dark"] .k-gte{--c:#4FC4B8;--ct:rgba(79,196,184,0.14)}:root[data-theme="dark"] .k-rep{--c:#AAB8C5;--ct:rgba(170,184,197,0.14)}:root[data-theme="dark"] .btn.main,:root[data-theme="dark"] .passlist .num,:root[data-theme="dark"] .step>h2 .sn,:root[data-theme="dark"] .tabs button[aria-pressed="true"],:root[data-theme="dark"] .answer span,:root[data-theme="dark"] .chip.sel{color:#161E26}

.taps{line-height:2.4;margin:.2rem 0 .6rem}
.tw{font:inherit;font-size:1.05rem;border:2px solid transparent;background:transparent;border-radius:6px;padding:0 .15rem;cursor:pointer;color:var(--ink)}
.tw.static{cursor:default}
.tw[aria-pressed="true"]{background:rgba(56,120,184,.18);border-color:#3878B8}
.tw.ok{background:var(--okt);border-color:var(--ok)}
.tw.no{background:var(--badt);border-color:var(--bad)}
.tw.miss{border-color:var(--mid);border-style:dashed}
.gap{font:inherit;font-size:.8rem;border:2px dashed var(--line);background:var(--paper);color:var(--soft);border-radius:999px;margin:0 .15rem;padding:0 .4rem;cursor:pointer;min-height:30px}
.gap.ok{border-style:solid;border-color:var(--ok);background:var(--okt);color:var(--ink);font-weight:700;font-size:1rem}
.gap.no{border-color:var(--bad);animation:shake .3s}
.flyttout{font-size:1.15rem;background:var(--field);border:2px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin:.6rem 0 .3rem}
.flyttout .fund{background:rgba(232,131,58,.22);border-radius:6px;padding:0 .2rem;font-weight:600}
.flyttout .fverb{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;font-weight:600}
.felbox{border-radius:10px;border:2px solid var(--line);padding:.4rem .8rem;margin:.5rem 0}
.felbox .du{color:var(--bad);margin:.2rem 0}
.felbox .ratt{margin:.2rem 0}
.lara{border-left:5px solid var(--c);padding:.1rem .9rem;margin:.6rem 0;background:var(--ct);border-radius:0 10px 10px 0}
.lara h3{margin:.4rem 0 .2rem;display:flex;gap:.5rem;align-items:center}
.brev{white-space:normal}.brev p{margin:.2rem 0}
</style>
</head>
<body>
<div class="wrap"><main id="app"></main>
<footer>Byggd utifrån Språklabb 1–4, övningarna, övningsprovet och Edgars egna anteckningar. Förklaringarna är skrivna med egna ord.</footer></div>
<script>
const D={"PASSES": [{"id": "s1", "n": 1, "c": "his", "t": "Finita verb och subjekt", "varfor": "Allt i grammatiken börjar med det finita verbet. Hittar du det, kan du hitta subjektet, räkna satser och hitta fundamentet.", "fel": [["Ett finit verb är något man gör i presens.", "Ett finit verb kan stå i presens (går), preteritum (gick) eller imperativ (gå!). Det viktiga är att verbet visar tid själv, utan hjälp."], ["Ett infinit verb är något man gör i dåtid.", "Infinita verb visar inte tid alls. ”Hade gått” är dåtid, men det är ”hade” som visar det. ”Gått” är infinit."], ["Ändra till preteritum: ”Jag undersöker huset” → nutid.", "Preteritum betyder dåtid, så du ska skriva om meningen: ”Jag undersökte huset.” Presens = nutid, preteritum = dåtid."], ["Imperativ: ”Du måste plugga!”", "Där står ”måste” i presens. Imperativ är en uppmaning där verbet står först och inget subjekt behövs: ”Plugga!”, ”Ta på dig skorna!”"]], "lara": [["Vad är ett finit verb?", "Ett finit verb visar <b>tid</b> på egen hand. Det kan stå i <b>presens</b> (nutid: <i>går, pluggar</i>), <b>preteritum</b> (dåtid: <i>gick, pluggade</i>) eller <b>imperativ</b> (uppmaning: <i>Gå! Plugga!</i>)."], ["Jag-testet", "Sätt ”jag” framför verbet. Låter det rätt är verbet finit: <i>jag pluggar</i> ✔, <i>jag pluggade</i> ✔, <i>jag plugga</i> ✘."], ["Tempustestet", "Byt mellan nutid och dåtid. Det verb som ändrar form är finit: <i>Hon <b>brukar</b> cykla</i> → <i>Hon <b>brukade</b> cykla</i>. ”Cykla” ändras inte, alltså infinit."], ["Verbkedjor: bara det första verbet är finit", "Står flera verb i rad är <b>bara det första</b> finit. Resten är infinita.<br><i>Hon <b>kan</b> förstå.</i> → kan = finit, förstå = infinit.<br><i>Jag <b>ska</b> göra läxan.</i> → ska = finit, göra = infinit.<br><i>Han <b>hade</b> glömt väskan.</i> → hade = finit, glömt = infinit."], ["Infinita verb", "Infinita verb visar inte tid och behöver ett finit hjälpverb framför sig:<br><b>infinitiv</b> (grundformen): <i>(att) läsa, ska läsa</i><br><b>supinum</b> (efter har/hade): <i>har läst, hade läst</i><br><b>particip</b> (nästan som adjektiv): <i>en läst bok, brevet är skrivet</i>"], ["Subjekt", "Subjektet är den eller det som gör det finita verbet. Fråga: <b>vem/vad + finit verb?</b><br><i>Det klåfingriga barnet slog på ugnen.</i> Vem slog? → <b>Det klåfingriga barnet</b>. Subjektet kan alltså vara flera ord."], ["Sats", "En sats = <b>subjekt + finit verb</b> (+ resten). En mening har <b>lika många satser som finita verb</b>."]], "tap": [["Tryck på alla finita verb", ["Hon *gick* in i köket och *satte* sig på stolen.", "Hon *vill* inte tänka på allt som *har* hänt.", "Farmoderns död *har* kommit så plötsligt att hon nästan inte *kan* förstå det.", "När hon *öppnar* boken *vet* hon vad hon *ska* göra.", "Strax ovanför huvudet *finns* det en hylla.", "Om du *vill* lyckas *måste* du träna regelbundet.", "Eleverna *har* studerat grammatik hela morgonen.", "*Ta* på dig jackan och *gå* ut!"]], ["Tryck på subjektet (alla ord som hör till det)", ["*Rektorn* suckade tungt.", "*Det* *klåfingriga* *barnet* slog på ugnen.", "I går träffade *jag* en trevlig granne.", "Plötsligt dök *den* *försvunna* *katten* upp på trappan.", "Efter den långa debatten fattade *politikerna* ett beslut.", "*Fem* *clowner* jonglerade på torget."]]], "sort": [["Finit eller infinit?", ["Finit", "Infinit"], [["går", 0], ["gick", 0], ["Gå! (uppmaning)", 0], ["har (i ”har läst”)", 0], ["kan (i ”kan förstå”)", 0], ["undersöker", 0], ["körde", 0], ["läst (i ”har läst”)", 1], ["förstå (i ”kan förstå”)", 1], ["plugga (i ”ska plugga”)", 1], ["att skriva", 1], ["glömt (i ”hade glömt”)", 1]]], ["Vilket tempus eller vilken form?", ["Presens (nutid)", "Preteritum (dåtid)", "Imperativ (uppmaning)"], [["Vi går till skolan.", 0], ["Jag undersöker huset.", 0], ["Alla älskar våren.", 0], ["Vi gick till skolan.", 1], ["Hon körde bilen.", 1], ["Jag undersökte huset.", 1], ["Gå till skolan!", 2], ["Öva på verb!", 2], ["Ta på dig skorna!", 2]]]], "mc": [["Vilket är det finita verbet i: ”Barnet hade glömt sin väska.”", ["Barnet", "hade", "glömt", "väska"], 1, "I verbkedjan ”hade glömt” är det första verbet finit."], ["Skriv om till preteritum: ”Jag undersöker huset.”", ["Jag undersöker huset.", "Jag undersökte huset.", "Jag har undersökt huset.", "Undersök huset!"], 1, "Preteritum = dåtid: undersökte."], ["Vilken mening står i imperativ?", ["Du måste plugga.", "Plugga nu!", "Jag pluggar.", "Han ska plugga."], 1, "Imperativ = uppmaning med verbet först, utan subjekt."], ["Hur många satser finns i: ”Om du vill lyckas måste du träna.”", ["1", "2", "3", "4"], 1, "Två finita verb (vill, måste) = två satser."], ["Vad är fel i: ”Jag vill bjuder in henne.”", ["Inget", "Två finita verb i rad – det ska vara ”vill bjuda”", "Subjekt saknas", "Det är en satsradning"], 1, "Efter hjälpverbet ”vill” ska verbet stå i infinitiv: bjuda."], ["Är ”plugga” finit eller infinit i ”Jag ska plugga ikväll”?", ["Finit", "Infinit"], 1, "”Ska” är finit, ”plugga” är infinit."]], "fragor": [["Vad är ett finit verb? Ge tre exempel i olika former.", ["Ett verb som visar tid på egen hand. Det står i presens (går), preteritum (gick) eller imperativ (gå!). Jag-testet: ”jag går” låter rätt."]], ["Vad är ett infinit verb? Ge två exempel.", ["Ett verb som inte visar tid själv och behöver ett finit hjälpverb. Till exempel infinitiv (ska läsa) och supinum (har läst)."]], ["Vilket verb är finit i en verbkedja som ”kommer att ha slutat”?", ["Det första: ”kommer”. Resten är infinita."]], ["Varför behöver en sats både subjekt och finit verb?", ["Det finita verbet visar vad som händer och när, och subjektet visar vem eller vad som gör det. Utan något av dem blir satsen ofullständig."]]]}, {"id": "s2", "n": 2, "c": "del", "t": "Huvudsats och bisats", "varfor": "Bisatser var ett av dina svaga områden. På provet ska du hitta dem, räkna dem, säga vilken sort de är och skriva egna.", "fel": [["En bisats fungerar som ett bindeord.", "En bisats är en hel sats: bisatsinledare + subjekt + finit verb + resten. Bindeordet är bara början, bisatsinledaren."], ["Hitta bisatsen: ”Eftersom bussen kom tidigt trodde de att de skulle hinna.” → ”Att”", "Bisatsen är hela delen: ”att de skulle hinna”. Och meningen har två bisatser – även ”Eftersom bussen kom tidigt”."], ["”Innan de gick till bion” är en huvudsats.", "Det är en bisats. Den börjar med bisatsinledaren ”innan” och kan inte stå ensam som mening. Står den ensam är det en fristående bisats, ett fel."], ["BIFF: i huvudsatsen kommer ”inte” före det finita verbet.", "Tvärtom! BIFF = Bisats Inte Före Finit. I en bisats: ”eftersom hon <b>inte kommer</b>”. I en huvudsats: ”hon <b>kommer inte</b>”."]], "lara": [["Huvudsats", "En huvudsats kan stå ensam som en mening: <i>Hon kommer imorgon.</i> Två huvudsatser kan bindas ihop med <b>samordnande konjunktioner</b>: och, men, eller, för, så."], ["Bisats", "En bisats kan <b>inte</b> stå ensam. Den hör alltid ihop med en huvudsats och börjar med en <b>bisatsinledare</b>.<br><i>Hon var glad <u>eftersom hon slapp provet</u>.</i><br>Bisatsen är <b>hela</b> den understrukna delen, inte bara ”eftersom”."], ["Tre sorters bisatser", "<b>Subjunktionsbisats</b> – inleds med en subjunktion: att, när, eftersom, om, medan, innan, trots att, för att, så att.<br><b>Relativ bisats</b> – inleds med som, vars, vilken/vilket/vilka, där, dit. Den beskriver något som nämnts: <i>en kille <u>som verkade hård</u></i>.<br><b>Frågebisats</b> – inleds med ett frågeord: vem, vad, var, vart, hur, varför, om. <i>Ingen visste <u>vad han höll på med</u></i>."], ["Tre tester: är det en bisats?", "1. <b>Kan den stå ensam som mening?</b> Nej → bisats.<br>2. <b>Börjar den med en bisatsinledare?</b> Ja → bisats.<br>3. <b>BIFF-regeln:</b> sätt in ”inte”. Hamnar det <b>före</b> det finita verbet → bisats."], ["BIFF-regeln", "<b>B</b>isats <b>I</b>nte <b>F</b>öre <b>F</b>inita verbet.<br>Huvudsats: <i>Hon <b>kommer inte</b> imorgon.</i><br>Bisats: <i>…eftersom hon <b>inte kommer</b> imorgon.</i>"], ["Konjunktion eller subjunktion?", "<b>Konjunktioner</b> (och, men, eller, för, så) binder ihop likvärdiga delar, till exempel två huvudsatser.<br><b>Subjunktioner</b> (att, när, eftersom, om …) inleder en bisats och gör den underordnad."], ["Fristående bisats – ett fel", "En bisats som står ensam med punkt är ett fel: <i>Vilket märks när han snor mina skor.</i> Rätta genom att sätta ihop den med huvudsatsen: <i>Max är busig, vilket märks när han snor mina skor.</i>"]], "tap": [["Tryck på alla ord i bisatserna (hela bisatsen, inte bara inledaren)", ["*Eftersom* *bussen* *kom* *tidigt* trodde de *att* *de* *skulle* *hinna*.", "Ryan var en kille *som* *på* *ytan* *verkade* *hård*.", "Eleverna var glada *eftersom* *de* *slapp* *prov* *idag*.", "*När* *Theo* *öppnade* *dörren* märkte han *att* *det* *doftade* *regn*.", "Ingen brydde sig om *vad* *han* *höll* *på* *med*.", "Det snöade hela natten, *vilket* *skapade* *problem* *i* *trafiken*.", "Hon frågade *om* *Susanna* *ville* *följa* *med*."]], ["Tryck på bisatsinledarna", ["Jag hoppas *att* du mår bra.", "*Medan* katten sov öppnade jag fönstret *eftersom* rummet var varmt.", "Han såg en hund *som* sprang över gräsmattan.", "Theo undrade *vad* hunden letade efter.", "*Trots* *att* gräset var vått satte han sig på en bänk.", "Han ville gå ut, men himlen var mörk."]]], "biff": [["Hon kommer imorgon.", 2, "Huvudsats: ”inte” efter det finita verbet → Hon kommer inte imorgon.", "h"], ["Jag stannar hemma eftersom jag är sjuk.", 5, "Bisatsen ”eftersom jag är sjuk”: ”inte” före det finita verbet → eftersom jag inte är sjuk.", "b"], ["Hon säger att boken är bra.", 4, "I bisatsen ”att boken är bra” hamnar ”inte” före ”är”: att boken inte är bra.", "b"], ["Vi hittade barnen.", 2, "Huvudsats: Vi hittade inte barnen.", "h"], ["Det var en sommar som tog slut.", 5, "Relativ bisats: som inte tog slut.", "b"], ["Theo gick ut fast det regnade.", 5, "Bisats: fast det inte regnade.", "b"]], "sort": [["Huvudsats eller bisats?", ["Huvudsats (kan stå ensam)", "Bisats (kan inte stå ensam)"], [["De gick till bion.", 0], ["Hon frös.", 0], ["Han ville gå ut.", 0], ["Theo plockade upp stenen.", 0], ["innan de gick till bion", 1], ["eftersom det var kallt", 1], ["som jag lånade igår", 1], ["vilket skapade problem", 1], ["att hon har en hund", 1], ["om du vill komma", 1]]], ["Vilken sorts bisats?", ["Subjunktionsbisats", "Relativ bisats", "Frågebisats"], [["…att de stannade hemma", 0], ["…när de skaffade solstolar", 0], ["…eftersom bussen kom tidigt", 0], ["…trots att gräset var vått", 0], ["…en kille som verkade hård", 1], ["…vilket skapade problem", 1], ["…boken vars pärmar var tunna", 1], ["…parken där vi brukar gå", 1], ["…vad han höll på med", 2], ["…varför den fångade hans intresse", 2], ["…vem du är", 2]]], ["Konjunktion eller subjunktion?", ["Samordnande konjunktion (binder ihop huvudsatser)", "Subjunktion (inleder bisats)"], [["och", 0], ["men", 0], ["eller", 0], ["så", 0], ["för", 0], ["att", 1], ["eftersom", 1], ["när", 1], ["medan", 1], ["trots att", 1], ["innan", 1], ["om", 1]]]], "mc": [["Hur många bisatser finns i: ”Eftersom bussen kom tidigt trodde de att de skulle hinna.”", ["0", "1", "2", "3"], 2, "”Eftersom bussen kom tidigt” och ”att de skulle hinna”."], ["Vilken är bisatsen i: ”Ryan var en kille som på ytan verkade hård.”", ["som", "Ryan var en kille", "som på ytan verkade hård", "verkade hård"], 2, "Hela satsen från bisatsinledaren till slutet."], ["Var står ”inte” i en bisats?", ["Efter det finita verbet", "Före det finita verbet", "Först i meningen", "Sist i meningen"], 1, "BIFF: Bisats Inte Före Finit."], ["Vilken mening är rätt?", ["Eftersom hon kommer inte imorgon …", "Eftersom hon inte kommer imorgon …"], 1, "I bisatsen kommer ”inte” före det finita verbet."], ["Vilket ord inleder en relativ bisats?", ["eftersom", "som", "men", "varför"], 1, "Som, vilket, vars, där."], ["”Innan de gick till bion.” Vad är det?", ["En huvudsats", "En fristående bisats – fel", "En korrekt mening", "En satsradning"], 1, "Den börjar med ”innan” och kan inte stå ensam."], ["Fyll i: ”Det var en sommar ___ aldrig tog slut.”", ["att", "som", "eftersom", "men"], 1, "Relativ bisats som beskriver sommaren."]], "fragor": [["Vad är en bisats? Förklara med ett eget exempel.", ["En sats som inte kan stå ensam utan hör till en huvudsats. Den börjar med en bisatsinledare och har eget subjekt och finit verb. Exempel: Jag stannade hemma <u>eftersom jag var sjuk</u>."]], ["Vilka är de tre sorternas bisatser? Ge ett exempel på varje.", ["Subjunktionsbisats: …eftersom det regnade.", "Relativ bisats: …en bok som jag gillar.", "Frågebisats: …varför han kom."]], ["Förklara BIFF-regeln.", ["Sätt in ”inte”. Hamnar det före det finita verbet är det en bisats (eftersom hon inte kommer). Hamnar det efter är det en huvudsats (hon kommer inte)."]], ["Vad är skillnaden mellan en konjunktion och en subjunktion?", ["Konjunktioner (och, men, eller) binder ihop jämställda satser. Subjunktioner (att, när, eftersom) inleder en bisats som blir underordnad huvudsatsen."]]]}, {"id": "s3", "n": 3, "c": "arv", "t": "Fundament, satsdelar och ordföljd", "varfor": "Fundament var ditt andra svaga område. På provet ska du stryka under fundamenten, beskriva dem och skriva med varierade fundament.", "fel": [["Rak ordföljd är när det som händer kommer först.", "Rak ordföljd betyder att meningen börjar med <b>subjektet</b>: <i>Jag promenerar varje morgon.</i>"], ["Omvänd ordföljd är när tiden kommer först.", "Omvänd ordföljd är när meningen börjar med <b>något annat än subjektet</b>: ett adverbial (tid, plats, sätt, orsak), ett objekt eller en bisats. <i>Varje morgon promenerar jag.</i>"], ["Fundamentet är första ordet.", "Fundamentet är <b>allt</b> före det finita verbet i huvudsatsen. Det kan vara ett ord (<i>Jag</i>) eller många (<i>Eftersom lägenheten ligger nära parken</i>)."]], "lara": [["Fundament", "Fundamentet är <b>allt som står före det finita verbet</b> i huvudsatsen.<br><i><u>Jag</u> promenerar varje morgon.</i><br><i><u>Varje morgon</u> promenerar jag.</i><br><i><u>Eftersom parken ligger nära</u> promenerar jag varje morgon.</i><br>Ett verb kan aldrig stå i fundamentet i ett påstående."], ["Hitta fundamentet i tre steg", "1. Hitta huvudsatsens finita verb.<br>2. Allt före det är fundamentet.<br>3. Fråga: vad är det för satsdel? Subjekt, adverbial, objekt eller en hel bisats?"], ["Satsdelarna", "<b>Subjekt</b> – vem/vad gör? <i>Hunden</i> skäller.<br><b>Objekt</b> – vem/vad utsätts för handlingen? Hunden jagar <i>katten</i>.<br><b>Adverbial</b> – omständigheter: var, när, hur, varför, med hjälp av vad? <i>i parken, i går, snabbt, eftersom han var hungrig</i>."], ["Rak och omvänd ordföljd", "<b>Rak:</b> subjektet först → <i>Jag träffade en granne i går.</i><br><b>Omvänd:</b> något annat först, och då kommer subjektet <b>efter</b> det finita verbet → <i>I går träffade jag en granne.</i><br>Det finita verbet står alltid på plats två."], ["De sju frågornas grammatik", "Tabellen har tre rutor: <b>Fundament | Finit verb | Resten</b>. Det finita verbet sitter fast i mitten. Du kan flytta in vem/vad, när, var, hur, varför eller med hjälp av vad i fundamentet.<br><i>Med hjälp av skorna springer Kalle.</i> ✔ <i>Kalle springer utomhus.</i> (rak, enkel)"], ["Varför variera?", "En text där alla meningar börjar med ”Jag …” eller ”Hon …” blir hackig och enkel. Blanda rak och omvänd ordföljd, men inte så mycket att det blir krångligt."]], "tap": [["Tryck på fundamentet (alla ord före huvudsatsens finita verb)", ["*I* *går* träffade jag en granne.", "*Min* *nya* *bostad* ligger nära en park.", "*Jag* promenerar i parken varje morgon.", "*Varje* *morgon* promenerar jag i parken.", "*Eftersom* *lägenheten* *ligger* *nära* *parken* brukar jag promenera där.", "*Snart* måste du hälsa på mig.", "*Med* *mörka* *prickar* är torskens sidor gröna.", "*Fisk* *och* *musslor* äter torsken."]]], "flytt": [["Jag promenerar i parken varje morgon.", [["jag", "subjekt"], ["promenerar", "V"], ["i parken", "adverbial (var?)"], ["varje morgon", "adverbial (när?)"]]], ["Kalle springer utomhus med hjälp av sina nya skor.", [["Kalle", "subjekt", 1], ["springer", "V"], ["utomhus", "adverbial (var?)"], ["med hjälp av sina nya skor", "adverbial (med hjälp av vad?)"]]], ["Torsken äter fisk och musslor på botten.", [["torsken", "subjekt"], ["äter", "V"], ["fisk och musslor", "objekt (vad?)"], ["på botten", "adverbial (var?)"]]], ["Hon bakade en kaka till grannen i eftermiddags.", [["hon", "subjekt"], ["bakade", "V"], ["en kaka", "objekt (vad?)"], ["till grannen", "adverbial (till vem?)"], ["i eftermiddags", "adverbial (när?)"]]], ["Eleverna gick hem eftersom skoldagen hade tagit slut.", [["eleverna", "subjekt"], ["gick", "V"], ["hem", "adverbial (vart?)"], ["eftersom skoldagen hade tagit slut", "bisats (varför?)"]]]], "sort": [["Vad står i fundamentet?", ["Subjekt (rak ordföljd)", "Adverbial (omvänd)", "Objekt (omvänd)", "Bisats (omvänd)"], [["Jag gillar min nya bostad.", 0], ["Hunden heter Max.", 0], ["Min nya bostad ligger nära en park.", 0], ["I går träffade jag en granne.", 1], ["Snart måste du hälsa på mig.", 1], ["Varje morgon promenerar jag.", 1], ["Fisk och musslor äter torsken.", 2], ["Den boken har jag redan läst.", 2], ["Eftersom det regnade stannade vi hemma.", 3], ["När vi kom fram pausade bussen.", 3]]]], "mc": [["Vad är fundamentet i: ”I går träffade jag en granne.”", ["I", "I går", "träffade", "jag"], 1, "Allt före det finita verbet ”träffade”."], ["Vilken mening har omvänd ordföljd?", ["Jag promenerar varje morgon.", "Varje morgon promenerar jag.", "Hon har en hund.", "Max är busig."], 1, "Den börjar med ett adverbial."], ["Kan ett verb stå i fundamentet i ett påstående?", ["Ja", "Nej"], 1, "Nej. I frågor och uppmaningar kan verbet komma först, men då finns inget fundament."], ["Vad är ”i parken” för satsdel?", ["Subjekt", "Objekt", "Adverbial", "Finit verb"], 2, "Svarar på var? → adverbial."], ["Vilken satsdel är ”en kaka” i ”Hon bakade en kaka”?", ["Subjekt", "Objekt", "Adverbial"], 1, "Vad bakade hon? → objekt."], ["Rak ordföljd betyder att meningen börjar med …", ["det som händer", "tiden", "subjektet", "verbet"], 2, "Subjekt först = rak ordföljd."], ["Vad händer med subjektet vid omvänd ordföljd?", ["Det försvinner", "Det hamnar direkt efter det finita verbet", "Det hamnar sist", "Det blir ett objekt"], 1, "I går träffade jag …"]], "fragor": [["Vad är ett fundament? Ge två exempel på olika slags fundament.", ["Allt som står före det finita verbet i huvudsatsen. Exempel: <u>Jag</u> går hem (subjekt). <u>Efter skolan</u> går jag hem (adverbial)."]], ["Vad är skillnaden mellan rak och omvänd ordföljd?", ["Rak: meningen börjar med subjektet. Omvänd: meningen börjar med något annat, till exempel ett adverbial, ett objekt eller en bisats, och subjektet hamnar efter det finita verbet."]], ["Vad är ett adverbial? Ge tre exempel.", ["En satsdel som berättar om omständigheterna: var (i parken), när (i går), hur (snabbt), varför (eftersom det regnade), med hjälp av vad (med cykel)."]], ["Varför bör man variera fundament och ordföljd i en text?", ["En text med bara rak ordföljd och korta subjektsfundament blir enformig och hackig. Variation ger flyt och högre stilnivå. Men för mycket variation kan göra texten svårläst, så balans är bäst."]]]}, {"id": "s4", "n": 4, "c": "epi", "t": "Höger- och vänstertunga meningar", "varfor": "På provet ska du avgöra om meningarna är höger- eller vänstertunga, förklara vad det betyder och skriva båda sorterna.", "fel": [["En högertung mening har den viktiga informationen efter verbet.", "Det handlar om <b>mängden</b> information. Högertung = <b>mycket</b> efter huvudsatsens finita verb och lite före. Vänstertung = <b>mycket</b> före det finita verbet (ett långt fundament)."]], "lara": [["Utgå från huvudsatsens finita verb", "Hitta huvudsatsens finita verb. Titta sedan på hur mycket som står till vänster (fundamentet) och till höger om det."], ["Högertung", "Kort fundament, mycket efter verbet:<br><i>Eleverna <b>gick</b> hem eftersom skoldagen hade avslutats.</i><br>Vanligast i svenskan och i enklare texter."], ["Vänstertung", "Långt fundament, ofta en hel bisats eller ett långt adverbial:<br><i>Eftersom skoldagen hade avslutats <b>gick</b> eleverna hem.</i><br>Vanligare i mer avancerade texter."], ["Så gör du en mening vänstertung", "Flytta bisatsen eller ett långt adverbial till fundamentet. Glöm inte att subjektet då hamnar efter verbet:<br><i>Jag promenerar i parken eftersom den ligger nära.</i> → <i>Eftersom parken ligger nära promenerar jag där.</i>"], ["Balans", "Bara högertunga meningar → enkelt intryck. Bara vänstertunga → svårläst. Blanda!"]], "tap": [["Tryck på huvudsatsens finita verb – sedan ser du åt vilket håll meningen väger", ["Eleverna *gick* hem eftersom skoldagen hade avslutats.", "Eftersom skoldagen hade avslutats *gick* eleverna hem.", "Om barn inte får lära sig sitt språk *kan* de senare få svårt att föra det vidare.", "När ett språk inte får användas i skolan *blir* det svårare att föra språket vidare.", "Det *betyder* att en minoritet förväntas anpassa sig till majoritetens språk."]]], "flytt": [["Jag promenerar i parken eftersom den ligger nära min lägenhet.", [["jag", "subjekt"], ["promenerar", "V"], ["i parken", "adverbial (var?)"], ["eftersom den ligger nära min lägenhet", "bisats (varför?)"]]], ["Hon tänkte baka en kaka för att hälsa grannen välkommen.", [["hon", "subjekt"], ["tänkte", "V"], ["baka en kaka", "resten"], ["för att hälsa grannen välkommen", "bisats/adverbial (varför?)"]]]], "sort": [["Högertung eller vänstertung?", ["Högertung", "Vänstertung"], [["Eleverna gick hem eftersom skoldagen hade avslutats.", 0], ["Hon berättade att hon har en hund som heter Max.", 0], ["Jag hoppas att hon vill komma på fika.", 0], ["Det är viktigt att vi aldrig glömmer historien.", 0], ["Eftersom skoldagen hade avslutats gick eleverna hem.", 1], ["När vi hade ätit middag och diskat gick vi ut.", 1], ["Att hon har en hund visste jag inte.", 1], ["Om barn inte får lära sig sitt språk kan de få svårt att föra det vidare.", 1]]]], "mc": [["Vad betyder att en mening är vänstertung?", ["Den har mycket information före huvudsatsens finita verb", "Den har den viktigaste informationen först", "Den har många verb", "Den saknar subjekt"], 0, "Långt fundament = vänstertung."], ["Vilken mening är vänstertung?", ["Jag gick hem när det blev mörkt.", "När det blev mörkt och kallt i parken gick jag hem.", "Jag gick hem.", "Hon sa att hon var trött."], 1, "Långt fundament med en bisats."], ["Vilken typ är vanligast i enklare texter?", ["Högertunga", "Vänstertunga"], 0, "Korta fundament och mycket efter verbet."], ["Hur gör du enklast en högertung mening vänstertung?", ["Lägger till fler verb", "Flyttar bisatsen till fundamentet", "Tar bort subjektet", "Sätter komma"], 1, "Bisatsen först, sedan finit verb och subjekt."]], "fragor": [["Förklara vad en högertung och en vänstertung mening är, med ett exempel på varje.", ["Högertung: lite före huvudsatsens finita verb och mycket efter. <i>Vi stannade hemma eftersom det regnade.</i>", "Vänstertung: mycket före det finita verbet. <i>Eftersom det regnade hela dagen stannade vi hemma.</i>"]], ["Varför ska en text ha både höger- och vänstertunga meningar?", ["Bara högertunga meningar ger ett enkelt och hackigt intryck. Bara vänstertunga gör texten tung och svårläst. En blandning ger variation och flyt."]]]}, {"id": "s5", "n": 5, "c": "gte", "t": "Satsradning och andra vanliga fel", "varfor": "I del 1 av provet ska du hitta felen, och i del 2 ska du undvika dem. Det är tre fel som brukar komma.", "fel": [], "lara": [["1. Satsradning", "Två huvudsatser med bara komma emellan: <i>Jag ska handla, jag måste köpa mjöl.</i><br>Rätta med punkt, konjunktion eller bisats:<br><i>Jag ska handla. Jag måste köpa mjöl.</i><br><i>Jag ska handla eftersom jag måste köpa mjöl.</i>"], ["2. Fristående bisats", "En bisats står ensam som mening: <i>Vilket märks när han snor mina skor.</i><br>Rätta genom att haka på den på huvudsatsen: <i>Max är busig, vilket märks när han snor mina skor.</i>"], ["3. Två finita verb i rad", "Efter ett hjälpverb (vill, ska, kan, måste) ska nästa verb stå i infinitiv:<br><i>Jag vill <s>bjuder</s> → bjuda in henne.</i>"], ["Fler saker som ger avdrag", "Liten bokstav i början av mening och i namn (<i>norge → Norge</i>), och meningar som saknar finit verb (<i>Ett fint brev från mig.</i>)."]], "tap": [], "sort": [["Vilket fel – eller är det rätt?", ["Rätt", "Satsradning", "Fristående bisats", "Två finita verb"], [["När jag kom hem lagade jag mat.", 0], ["Jag gillar att läsa men jag har svårt att hitta tid.", 0], ["Hon hade pluggat mycket inför provet.", 0], ["Jag var trött, jag gick ändå till träningen.", 1], ["Det regnade hela dagen, vi stannade hemma.", 1], ["Jag ville gå ut, jag hade för mycket att göra.", 1], ["Vilket märks när han snor mina skor.", 2], ["Eftersom jag vill klara provet.", 2], ["Som gjorde att alla skrattade.", 2], ["Jag vill bjuder in henne.", 3], ["Han kan kommer imorgon.", 3], ["Vi ska åkte till stan.", 3]]]], "mc": [["Hur rättar du satsradningen ”Jag var trött, jag gick ändå till träningen.”?", ["Jag var trött, jag gick ändå, till träningen.", "Jag var trött men jag gick ändå till träningen.", "Jag var trött jag gick ändå till träningen.", "Var trött, gick ändå till träningen."], 1, "En konjunktion binder ihop huvudsatserna."], ["Vilken mening är en fristående bisats?", ["Max är busig.", "Eftersom han är busig.", "Han är busig eftersom han är ung.", "Max snor mina skor."], 1, "Den börjar med en bisatsinledare och saknar huvudsats."], ["Rätta: ”Jag kan kommer imorgon.”", ["Jag kan kom imorgon.", "Jag kan komma imorgon.", "Jag kommer kan imorgon.", "Jag kunde kommer imorgon."], 1, "Efter ”kan” ska verbet stå i infinitiv."], ["Hur bäst rätta: ”Som gjorde att alla skrattade.”?", ["Ta bort meningen", "Haka på den: …på golvet, vilket gjorde att alla skrattade.", "Byt till: Som gjorde, att alla skrattade.", "Sätt utropstecken"], 1, "Haka på bisatsen på huvudsatsen och byt ”som” till ”vilket”."]], "fragor": [["Vad är en satsradning och hur rättar man den?", ["Två huvudsatser som bara skiljs åt med komma. Rätta med punkt, med en konjunktion (och, men, så) eller genom att göra den ena satsen till en bisats."]], ["Vad är en fristående bisats och varför är det fel?", ["En bisats som står ensam som en mening. En bisats kan inte bilda mening själv, den måste höra ihop med en huvudsats."]]]}], "ORDER": {}, "SORT": {}, "EXPLAIN": {}, "RITA": {}, "AVERY": [], "ETIK": [], "PED": [], "PED_OPTS": [], "FIGS": {}, "B": [["Finit verb", "Verb som visar tid själv: presens, preteritum eller imperativ.", "Hon gick hem. Hon går hem. Gå hem!", "his", "s"], ["Infinit verb", "Verb som inte visar tid själv och behöver ett finit hjälpverb.", "ska läsa, har läst", "his", "s"], ["Presens", "Nutid.", "Jag pluggar.", "his", "s"], ["Preteritum", "Dåtid.", "Jag pluggade.", "his", "s"], ["Imperativ", "Uppmaning, verbet först utan subjekt.", "Plugga nu!", "his", "s"], ["Infinitiv", "Verbets grundform, ofta med ”att” eller efter hjälpverb.", "att springa, ska springa", "his", "s"], ["Supinum", "Infinit form efter har/hade.", "har sprungit", "his", "s"], ["Hjälpverb", "Finit verb som hjälper ett annat verb.", "ska, vill, kan, måste, har", "his", "s"], ["Subjekt", "Den eller det som gör det finita verbet. Fråga vem/vad + finit verb.", "Det klåfingriga barnet slog på ugnen.", "his", "s"], ["Sats", "Subjekt + finit verb (+ resten). Lika många satser som finita verb.", "Hon frös.", "his", "s"], ["Huvudsats", "Sats som kan stå ensam som mening.", "Hon kommer imorgon.", "del", "s"], ["Bisats", "Sats som inte kan stå ensam och börjar med en bisatsinledare.", "…eftersom hon var trött", "del", "s"], ["Bisatsinledare", "Första ordet i en bisats.", "att, när, eftersom, som, vad", "del", "s"], ["Subjunktion", "Ordklass som inleder bisatser (underordnande konjunktion).", "att, eftersom, medan, trots att", "del", "s"], ["Samordnande konjunktion", "Binder ihop jämställda delar, till exempel huvudsatser.", "och, men, eller, för, så", "del", "s"], ["Subjunktionsbisats", "Bisats som inleds med en subjunktion.", "…eftersom bussen kom tidigt", "del", "s"], ["Relativ bisats", "Bisats som inleds med som, vilket, vars, där.", "…en kille som verkade hård", "del", "s"], ["Frågebisats", "Bisats som inleds med ett frågeord.", "…vad han höll på med", "del", "s"], ["BIFF-regeln", "Bisats Inte Före Finit: i en bisats står ”inte” före det finita verbet.", "…eftersom hon inte kommer", "del", "s"], ["Fundament", "Allt före det finita verbet i huvudsatsen.", "I går träffade jag en granne.", "arv", "s"], ["Objekt", "Satsdel som utsätts för handlingen.", "Hon bakade en kaka.", "arv", "s"], ["Adverbial", "Satsdel om omständigheter: var, när, hur, varför, med hjälp av vad.", "i parken, i går, snabbt", "arv", "s"], ["Rak ordföljd", "Meningen börjar med subjektet.", "Jag promenerar varje morgon.", "arv", "s"], ["Omvänd ordföljd", "Meningen börjar med något annat än subjektet, och subjektet kommer efter det finita verbet.", "Varje morgon promenerar jag.", "arv", "s"], ["Högertung mening", "Lite före och mycket efter huvudsatsens finita verb.", "Vi stannade hemma eftersom det regnade.", "epi", "s"], ["Vänstertung mening", "Mycket före huvudsatsens finita verb (långt fundament).", "Eftersom det regnade hela dagen stannade vi hemma.", "epi", "s"], ["Satsradning", "Två huvudsatser med bara komma emellan – ett fel.", "Jag var trött, jag gick ändå.", "gte", "s"], ["Fristående bisats", "En bisats som står ensam som mening – ett fel.", "Eftersom jag vill klara det.", "gte", "s"], ["Stilnivå", "Hur formell eller informell en text är.", "Fler substantiv och vänstertunga meningar ger högre stilnivå.", "gte", "s"], ["Nominalisering", "Ett verb eller adjektiv görs om till substantiv.", "förändra → förändring", "gte", "s"]], "RATT": [], "LETTERS": [{"id": "b1", "t": "Brev 1: Anna till Viktoria (övningsprovet)", "fin": "Kära Viktoria\nJag *hoppas* att du *mår* bra. Jag *bor* i en ny lägenhet nu och jag *gillar* verkligen min nya bostad. Min nya bostad *ligger* nära en park. Jag *promenerar* i parken varje morgon. Jag *träffade* en trevlig granne i går. Hon *berättade* att hon *har* en hund. Hunden *heter* Max. Max *är* väldigt busig. Vilket *märks* när han *snor* mina skor. Jag *vill* baka en kaka till min granne. Jag *ska* handla i eftermiddag, jag *måste* köpa mjöl. Jag *vill* *bjuder* in henne på fika. Jag *hoppas* att hon *vill* komma. Snart *måste* du hälsa på mig. Vi *kan* kanske dricka kaffe tillsammans?\nKram, Anna", "finNote": "”Vill bjuder” har två finita verb i rad. Det är ett av felen i brevet: det ska vara ”vill bjuda”.", "fund": "Kära Viktoria\n*Jag* hoppas att du mår bra. *Jag* bor i en ny lägenhet nu och *jag* gillar verkligen min nya bostad. *Min* *nya* *bostad* ligger nära en park. *Jag* promenerar i parken varje morgon. *Jag* träffade en trevlig granne i går. *Hon* berättade att hon har en hund. *Hunden* heter Max. *Max* är väldigt busig. Vilket märks när han snor mina skor. *Jag* vill baka en kaka till min granne. *Jag* ska handla i eftermiddag, *jag* måste köpa mjöl. *Jag* vill bjuder in henne på fika. *Jag* hoppas att hon vill komma. *Snart* måste du hälsa på mig. *Vi* kan kanske dricka kaffe tillsammans?\nKram, Anna", "fundNote": "Subjekten i bisatserna (”att <u>du</u> mår”, ”att <u>hon</u> har”) är inte fundament – fundament finns bara i huvudsatser. ”Vilket märks …” saknar fundament eftersom huvudsats saknas.", "facit": [["Beskriv fundamenten.", "Nästan alla fundament är korta subjekt, oftast ”Jag”. Ett är lite längre (”Min nya bostad”) och ett enda är ett adverbial (”Snart”)."], ["Är ordföljden varierad?", "Nej. Nästan alla meningar har rak ordföljd (subjekt + finit verb). Bara ”Snart måste du …” har omvänd ordföljd."], ["Höger- eller vänstertunga meningar?", "Högertunga. Fundamenten är korta och informationen kommer efter det finita verbet. Det gör texten hackig."], ["Hur många bisatser, och vilka sorter?", "Fyra: ”att du mår bra”, ”att hon har en hund”, ”att hon vill komma” och den fristående ”Vilket märks när han snor mina skor” (där finns även ”när han snor mina skor”). Nästan bara att-bisatser, alltså lite variation."], ["Är meningslängden varierad?", "Nej. De flesta meningar består av en enda huvudsats med ett finit verb och är 4–7 ord långa."], ["Satsradningar?", "En: ”Jag ska handla i eftermiddag, jag måste köpa mjöl.”"], ["Ofullständiga meningar eller fel?", "Fristående bisats: ”Vilket märks när han snor mina skor.” Två finita verb: ”Jag vill bjuder in henne.”"]], "modell": "Kära Viktoria,\n\nJag hoppas att allt är bra med dig! Nu har jag äntligen flyttat in i min nya lägenhet, som jag verkligen trivs i. Eftersom den ligger alldeles intill en park brukar jag ta en promenad där varje morgon.\n\nI går träffade jag en trevlig granne. När vi stod och pratade berättade hon att hon har en hund som heter Max. Han är väldigt busig, vilket märks när han snor mina skor. För att hälsa henne välkommen vill jag baka en kaka, så i eftermiddag måste jag handla mjöl. Jag hoppas att hon har tid att komma när jag bjuder in henne på fika.\n\nSnart måste du också hälsa på mig, så att vi kan dricka kaffe tillsammans!\n\nKram,\nAnna", "refl": ["<b>”Eftersom den ligger alldeles intill en park brukar jag ta en promenad där varje morgon.”</b> Jag flyttade bisatsen (eftersom …) till fundamentet. Då blev meningen vänstertung och fick omvänd ordföljd: subjektet ”jag” hamnade efter det finita verbet ”brukar”.", "<b>”Han är väldigt busig, vilket märks när han snor mina skor.”</b> Jag rättade den fristående bisatsen genom att haka på den på huvudsatsen. Nu är den en relativ bisats som hör ihop med en huvudsats.", "<b>”För att hälsa henne välkommen vill jag baka en kaka, så i eftermiddag måste jag handla mjöl.”</b> Jag tog bort satsradningen och band ihop huvudsatserna med konjunktionen ”så”. Fundamentet ”För att hälsa henne välkommen” är ett adverbial som ger omvänd ordföljd."]}, {"id": "b2", "t": "Brev 2: Leo till Sara", "fin": "Hej Sara!\nJag *har* börjat på ett nytt jobb. Jobbet *är* på ett café i stan. Jag *jobbar* varje lördag. Chefen *är* snäll. Hon *heter* Lena. I går *hände* något roligt. En kund *tappade* sin glass på golvet, jag *fick* torka upp. Som *gjorde* att alla *skrattade*. Jag *ska* spara mina pengar. Jag *vill* *köper* en ny cykel. Jag *hoppas* att du *kan* komma och fika snart.\nHälsningar, Leo", "finNote": "”Vill köper” har två finita verb i rad – ett fel. Det ska vara ”vill köpa”.", "fund": "Hej Sara!\n*Jag* har börjat på ett nytt jobb. *Jobbet* är på ett café i stan. *Jag* jobbar varje lördag. *Chefen* är snäll. *Hon* heter Lena. *I* *går* hände något roligt. *En* *kund* tappade sin glass på golvet, *jag* fick torka upp. Som gjorde att alla skrattade. *Jag* ska spara mina pengar. *Jag* vill köper en ny cykel. *Jag* hoppas att du kan komma och fika snart.\nHälsningar, Leo", "fundNote": "”Som gjorde att alla skrattade” har inget fundament eftersom huvudsats saknas.", "facit": [["Beskriv fundamenten.", "Nästan alla är korta subjekt (Jag, Jobbet, Chefen, Hon, En kund). Ett enda är ett adverbial: ”I går”."], ["Är ordföljden varierad?", "Nej. Bara ”I går hände något roligt” har omvänd ordföljd. Resten har rak ordföljd."], ["Höger- eller vänstertunga meningar?", "Högertunga, med korta fundament och informationen efter verbet."], ["Hur många bisatser, och vilka sorter?", "Tre: den fristående relativa bisatsen ”Som gjorde …”, ”att alla skrattade” och ”att du kan komma och fika snart”. Lite variation."], ["Är meningslängden varierad?", "Nej. Nästan alla meningar är korta och har bara en huvudsats."], ["Satsradningar?", "En: ”En kund tappade sin glass på golvet, jag fick torka upp.”"], ["Ofullständiga meningar eller fel?", "Fristående bisats: ”Som gjorde att alla skrattade.” Två finita verb: ”Jag vill köper en ny cykel.”"]], "modell": "Hej Sara!\n\nNu har jag börjat på /* ===================== Drag-hjälp ===================== */
function dragChip(c, selector, onDrop, onTap) {
  let sx, sy, ghost = null, moved = false;
  c.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; moved = false; try { c.setPointerCapture(e.pointerId); } catch (_) {} });
  c.addEventListener('pointermove', e => {
    if (sx === undefined) return;
    if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) { ghost = c.cloneNode(true); ghost.classList.add('ghost', 'sel'); document.body.appendChild(ghost); moved = true; }
    if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
  });
  c.addEventListener('pointerup', e => { if (ghost) { const t = document.elementFromPoint(e.clientX, e.clientY); const z = t && t.closest(selector); ghost.remove(); ghost = null; if (z) onDrop(c, z); } sx = undefined; });
  c.addEventListener('pointercancel', () => { if (ghost) { ghost.remove(); ghost = null; } sx = undefined; });
  c.addEventListener('click', () => { if (moved) { moved = false; return; } onTap(c); });
}

    const old = S_draw()[id] || null;
    cv.width = r.width * dpr; cv.height = r.height * dpr; ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (old) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = old; }
  };

function parseTap(s) {
  return s.split(/(\s+|\n)/).filter(x => x !== '' && x !== ' ').map(tok => {
    if (tok === '\n') return { br: true };
    if (/^\s+$/.test(tok)) return null;
    const t = tok.indexOf('*') >= 0;
    return { w: tok.replace(/\*/g, ''), t };
  }).filter(Boolean);
}
function tapBlock(text, key, note) {
  const toks = parseTap(text);
  const wrap = el('div', { class: 'tapbox' });
  const line = el('p', { class: 'taps' });
  const btns = [];
  toks.forEach(tk => {
    if (tk.br) { line.append(el('br')); return; }
    const b = el('button', { class: 'tw', text: tk.w, 'aria-pressed': 'false', onclick: () => { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); b.classList.remove('ok', 'no', 'miss'); } });
    b._t = tk.t; btns.push(b); line.append(b, ' ');
  });
  const msg = el('p', { class: 'msg' });
  const noteEl = note ? el('div', { class: 'ans', hidden: true, html: note }) : null;
  const check = () => {
    let hit = 0, wrong = 0, miss = 0, tot = 0;
    btns.forEach(b => { const on = b.getAttribute('aria-pressed') === 'true'; b.classList.remove('ok', 'no', 'miss');
      if (b._t) { tot++; if (on) { hit++; b.classList.add('ok'); } else { miss++; b.classList.add('miss'); } } else if (on) { wrong++; b.classList.add('no'); } });
    msg.textContent = (hit === tot && !wrong) ? 'Helt rätt! 🎉' : `${hit} av ${tot} rätt. ` + (wrong ? wrong + ' markerade fel (röda). ' : '') + (miss ? miss + ' missade (gula).' : '');
    if (noteEl) noteEl.hidden = false;
    if (key && hit === tot && !wrong) { S.ck[key] = 1; save(); }
  };

function biffBlock(items) {
  const box = el('div');
  items.forEach(([s, gap, why, kind], i) => {
    const toks = s.split(' ');

    const res = el('div', { class: 'ans', hidden: true });
    let done = false;
    const gaps = [];
    for (let k = 0; k <= toks.length; k++) {
      if (k > 0) { const w = el('span', { class: 'tw static', text: toks[k - 1] }); line.append(w); }
      if (k < toks.length && k > 0) {
        const g = el('button', { class: 'gap', 'aria-label': 'Sätt inte här', text: '＋', onclick: () => {
          if (done) return;
          if (k === gap) { done = true; g.textContent = 'inte'; g.classList.add('ok'); res.innerHTML = ''; res.append(el('p', null, el('b', { text: 'Rätt! ' }), why)); res.hidden = false; }
          else { g.classList.remove('no'); void g.offsetWidth; g.classList.add('no'); res.innerHTML = ''; res.append(el('p', { text: 'Inte där. Hitta först det finita verbet i ' + (kind === 'h' ? 'huvudsatsen' : 'bisatsen') + '.' })); res.hidden = false; }
        } });

    box.append(el('div', { class: 'qc' }, el('p', { class: 'qt', text: (i + 1) + '. Sätt in ”inte” i ' + (kind === 'h' ? 'huvudsatsen' : 'bisatsen') + ':' }), line, res));

function flyttBlock(items) {
  const box = el('div');
  items.forEach(([orig, parts], i) => {
    const vi = parts.findIndex(p => p[1] === 'V'), si = parts.findIndex(p => p[1].startsWith('subjekt'));
    const out = el('p', { class: 'flyttout' }); const info = el('p', { class: 'small' });
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const build = fi => {
      const f = parts[fi]; const rest = parts.filter((p, k) => k !== fi && k !== vi && k !== si);
      const seq = fi === si ? [f, parts[vi], ...rest] : [f, parts[vi], parts[si], ...rest];
      out.innerHTML = '';
      seq.forEach((p, k) => {
        let t = p[0]; if (k === 0) t = cap(t); else if (!p[2] && k > 0) t = t.charAt(0).toLowerCase() + t.slice(1);
        out.append(el('span', { class: k === 0 ? 'fund' : (p[1] === 'V' ? 'fverb' : ''), text: t }), k < seq.length - 1 ? ' ' : '.');
      });
      const before = f[0].split(' ').length, after = seq.slice(2).reduce((a, p) => a + p[0].split(' ').length, 0);
      info.innerHTML = '';
      info.append(el('b', { text: 'Fundament: ' }), f[1] + '. ', el('b', { text: fi === si ? 'Rak ordföljd. ' : 'Omvänd ordföljd – subjektet står efter det finita verbet. ' }),
        before > 3 && before >= after - 1 ? el('b', { text: 'Vänstertung mening!' }) : 'Högertung mening.');
    };
    const bs = parts.map((p, k) => (k === vi || p[1] === 'resten') ? null : el('button', { class: 'btn', onclick: () => build(k) }, '”' + p[0] + '” först'));
    box.append(el('div', { class: 'qc' }, el('p', { class: 'qt', text: (i + 1) + '. ' + orig }),
      el('p', { class: 'small soft', text: 'Det finita verbet ”' + parts[vi][0] + '” sitter fast på plats två. Välj vad som ska stå i fundamentet:' }),
      el('div', { class: 'row' }, bs), out, info));
    build(si);
  });
  return box;
}

  const id = '_' + key; D.SORT[id] = def;
  const box = el('div'); runSort(box, id, { quiet: true }); return box;
}

function viewProv() {
  const v = el('div', { class: kc('rep') });
  v.append(topnav('prov'));
  v.append(el('div', { class: 'hero ' + kc('rep') }, el('h1', { text: 'Provträning' }), el('p', { text: 'Exakt som provet: del 1 analysera, del 2 skriva om, del 3 reflektera. Välj ett brev.' })));
  const tabs = el('div', { class: 'tabs' }), body = el('div');
  const show = i => {
    [...tabs.children].forEach((b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
    const L = D.LETTERS[i]; body.innerHTML = '';
    const plain = L.fin.replace(/\*/g, '');
    body.append(el('div', { class: 'card brev' }, el('h2', { text: L.t }), ...plain.split('\n').map(l => el('p', { text: l }))));
    body.append(el('h2', { text: 'Del 1 – Analysera brevet' }));
    body.append(el('div', { class: 'card' }, el('h3', { style: 'margin-top:0', text: 'a) Tryck på alla finita verb' }), tapBlock(L.fin, 'p-fin-' + L.id, L.finNote)));
    body.append(el('div', { class: 'card' }, el('h3', { style: 'margin-top:0', text: 'b) Tryck på alla fundament' }), el('p', { class: 'small soft', text: 'Tips: fundamentet är allt före det finita verbet i varje huvudsats. Subjekt i bisatser räknas inte.' }), tapBlock(L.fund, 'p-fund-' + L.id, L.fundNote)));
    const fq = el('div', { class: 'card' }, el('h3', { style: 'margin-top:0', text: 'c) Svara på frågorna' }));
    L.facit.forEach(([q, a], k) => {
      const ans = el('div', { class: 'ans', hidden: true }, el('p', { html: a }));
      fq.append(el('div', { class: 'qc' }, el('p', { class: 'qt', text: (k + 1) + '. ' + q }), textArea('pf-' + L.id + '-' + k, 'Ditt svar – använd begreppen…', 3),
        el('div', { class: 'row', style: 'margin-top:.4rem' }, el('button', { class: 'btn', onclick: () => { ans.hidden = !ans.hidden; } }, 'Visa facit')), ans));
    });
    body.append(fq);

    const ta = textArea('pw-' + L.id, 'Skriv din förbättrade version här…', 12);

    const analyze = () => {
      const t = ta.value.trim(); stats.innerHTML = '';
      if (!t) { stats.append('Skriv först, så räknar sidan åt dig.'); return; }
      const sents = t.replace(/\n+/g, ' ').replace(/([.!?])\s+/g, '$1|').split('|').filter(x => x.split(' ').length > 2);
      const lens = sents.map(x => x.split(/\s+/).length);
      const subjStart = sents.filter(x => /^(jag|hon|han|vi|de|du|det|den)\b/i.test(x)).length;
      const inl = ['att', 'eftersom', 'när', 'som', 'vilket', 'medan', 'innan', 'trots att', 'för att', 'så att', 'om', 'där', 'även om', 'fastän', 'sedan'].filter(w => new RegExp('(^|[\\s,])' + w + '\\s', 'i').test(t));
      const splice = (t.match(/,\s(jag|hon|han|vi|de|du|det|den)\s\w+/gi) || []);
      stats.append(el('p', null, el('b', { text: sents.length + ' meningar. ' }), 'Kortast ' + Math.min(...lens) + ' ord, längst ' + Math.max(...lens) + ' ord.'),
        el('p', null, el('b', { text: subjStart + ' av ' + sents.length }), ' meningar börjar med ett pronomen (jag, hon, vi …). ' + (subjStart > sents.length / 2 ? 'Prova att börja fler med ett adverbial eller en bisats!' : 'Bra variation!')),
        el('p', null, el('b', { text: inl.length + ' olika bisatsinledare: ' }), inl.join(', ') || '–', inl.length < 3 ? '. Använd minst tre olika!' : ' ✔'),
        splice.length ? el('p', null, el('b', { text: 'Kolla möjlig satsradning: ' }), splice.join(' · ')) : el('p', { text: 'Ingen tydlig satsradning hittad ✔ (kolla ändå själv).' }));
    };
    const ck = el('ul', { class: 'pts' }, D.CHECK.map((c, k) => { const key = 'pc-' + L.id + '-' + k; const li = el('li', { class: S.ck[key] ? 'hit' : '' }); li.append(el('button', { class: 'mk', 'aria-label': 'Klar', onclick: () => { S.ck[key] = !S.ck[key]; save(); li.classList.toggle('hit', !!S.ck[key]); } }), el('span', { text: c })); return li; }));
    const mod = el('div', { class: 'ans', hidden: true }, ...L.modell.split('\n').map(l => el('p', { text: l || ' ' })));
    body.append(el('div', { class: 'card' }, el('p', { text: 'Ändra fritt, men innehållet ska gå att känna igen. Bocka av checklistan när du är klar.' }), ta,
      el('div', { class: 'row', style: 'margin-top:.4rem' }, el('button', { class: 'btn', onclick: analyze }, 'Räkna på min text'), el('button', { class: 'btn', onclick: () => { mod.hidden = !mod.hidden; } }, 'Visa ett exempel')), stats, el('h3', { text: 'Checklista' }), ck, mod));
    body.append(el('h2', { text: 'Del 3 – Reflektera' }));
    const rm = el('div', { class: 'ans', hidden: true }, ...L.refl.map(r => el('p', { html: r })));
    body.append(el('div', { class: 'card' }, el('p', { text: 'Välj tre meningar du är nöjd med. Förklara vad du har gjort med grammatiska begrepp.' }),
      el('p', { class: 'small soft', text: 'Meningsstartare – kopiera och fyll i:' }), el('ul', null, D.STARTERS.map(t => el('li', { text: t }))),
      textArea('pr-' + L.id, 'Mening 1: … Jag har …', 8), el('div', { class: 'row', style: 'margin-top:.4rem' }, el('button', { class: 'btn', onclick: () => { rm.hidden = !rm.hidden; } }, 'Visa exempel på reflektion')), rm));
  };
