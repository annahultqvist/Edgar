  if (s == null) return null;
  const sup = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+' };
  s = String(s).trim().replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, c => sup[c]).replace(/\s/g, '').replace(/,/g, '.').replace(/[−–]/g, '-').replace(/%$/, '');
  s = s.replace(/[·×*x]10\^?\(?([-+]?\d+)\)?$/i, 'e$1').replace(/^10\^?\(?([-+]?\d+)\)?$/, '1e$1');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
  return parseFloat(s);
}
function calcBlock(list, key) {
  const box = el('div');
  list.forEach((c, i) => {
    const k = key + '-' + i;
    const inp = el('input', { type: 'text', inputmode: 'decimal', placeholder: 'Ditt svar', 'aria-label': 'Ditt svar', style: 'font:inherit;font-size:1.05rem;padding:.45rem .6rem;border:2px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);width:11rem' });
    const msg = el('p', { class: 'msg' });
    const hintBox = el('div'); let hn = 0;
    const sol = el('div', { class: 'ans', hidden: true }, el('p', null, el('b', { text: 'Lösning' })), ...c.sol.map(t => el('p', { text: t })));
    const check = () => {
      const v = parseNum(inp.value);
      if (v === null) { msg.textContent = 'Skriv ett tal, t.ex. 0,058 eller 1,8e-5 eller 1,8·10^-5.'; return; }
      const ok = Math.abs(v - c.ans) <= Math.abs(c.ans) * c.tol + 1e-30;
      msg.textContent = ok ? 'Rätt! 🎉' : (hn < c.hints.length ? 'Inte riktigt. Ta en ledtråd och försök igen.' : 'Inte riktigt. Titta på lösningen.');
      inp.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
      if (ok) { S.ck[k] = 1; save(); }
    };
    const hintBtn = el('button', { class: 'btn', onclick: () => { if (hn < c.hints.length) { hintBox.append(el('p', { class: 'small', text: '💡 ' + c.hints[hn] })); hn++; } if (hn >= c.hints.length) hintBtn.disabled = true; } }, 'Ledtråd');
    box.append(el('div', { class: 'qc' },
      el('p', { class: 'qt', text: (i + 1) + '. ' + c.q }),
      el('div', { class: 'row' }, inp, el('span', { class: 'soft', text: c.unit || '' })),
      el('div', { class: 'row', style: 'margin-top:.4rem' }, el('button', { class: 'btn main', onclick: check }, 'Kolla'), hintBtn, el('button', { class: 'btn', onclick: () => { sol.hidden = !sol.hidden; } }, 'Visa lösning')),
      msg, hintBox, sol, S.ck[k] ? el('p', { class: 'small soft', text: '✓ Du har klarat den här förut.' }) : null));
  });
  return box;
}
function allCalc() { return REAL.flatMap(p => p.calc || []); }

function passSteps(p) {
  const out = [];
  const earlier = REAL.filter(x => x.n < p.n).flatMap(x => passQs(x.id).map(q => q.id));
  const ms = el('div');
  const fill = () => {
    ms.innerHTML = '';
    if (!earlier.length) { ms.append(el('p', { text: 'Första passet – inget att repetera än. Gå vidare.' })); return; }
    ms.append(el('p', { text: 'Svara i huvudet, titta på svaret och markera hur det gick.' }));
    pickWeighted(earlier, 3, 2).forEach(id => ms.append(qCard(id, { showFrom: true, write: false })));
    ms.append(el('button', { class: 'btn', onclick: fill }, 'Andra frågor'));
  };
  fill();
  let n = 0;
  out.push(stepBox(p.id, ++n, 'Minnesstart (3 min)', ms));
  const gAns = el('div', { class: 'ans', hidden: true }, el('p', { text: p.gissa[1] }));
  out.push(stepBox(p.id, ++n, 'Gissa först (1 min)', el('p', { class: 'qt' }, el('b', { text: p.gissa[0] }), sayBtn(p.gissa[0])),
    textArea('g-' + p.id, 'Skriv din gissning…', 3), el('div', { class: 'row', style: 'margin-top:.4rem' }, el('button', { class: 'btn', onclick: () => { gAns.hidden = !gAns.hidden; } }, 'Visa förklaringen')), gAns));
  out.push(stepBox(p.id, ++n, 'Läs (10 min)',
    el('ul', { class: 'pts' }, p.lasa.map(([bok, sid, vad], k) => el('li', { class: k === 0 ? 'hit' : '' }, el('span', { text: k === 0 ? '📗' : '📘', style: 'flex:none' }), el('span', null, el('b', { text: bok + ', ' + sid + '. ' }), vad)))),
    el('p', { text: 'Leta efter det här när du läser:' }), el('ul', null, p.guide.map(t => el('li', { text: t })))));
  const res = el('div', { hidden: true });
  const ta = textArea('h-' + p.id, 'Skriv allt du minns med egna ord. Stödord och formler går bra.', 6);
  const showRes = () => {
    res.innerHTML = ''; const txt = ta.value; let hits = 0; const ul = el('ul', { class: 'pts' });
    p.punkter.forEach(([t, kws], j) => {
      const ck = 'hp-' + p.id + '-' + j; const auto = kws.every(k => hasKw(txt, k)); const hit = S.ck[ck] != null ? S.ck[ck] : auto; if (hit) hits++;
      const li = el('li', { class: hit ? 'hit' : '' }); li.append(el('button', { class: 'mk', 'aria-label': 'Fick med', onclick: () => { S.ck[ck] = !li.classList.contains('hit'); save(); showRes(); } }), el('span', { text: t })); ul.append(li);
    });
    res.append(el('p', null, el('b', { text: 'Ungefär ' + hits + ' av ' + p.punkter.length + ' viktiga punkter. ' }), 'Tryck på en ring om du tycker att du fick med punkten.'), ul);
    res.hidden = false;
  };
  out.push(stepBox(p.id, ++n, 'Hjärnsläpp (3 min)', el('p', { text: 'Stäng boken. Skriv ner allt du minns.' }), ta,
    el('div', { class: 'row', style: 'margin-top:.4rem' }, el('button', { class: 'btn', onclick: showRes }, 'Jämför med sammanfattningen')), res));
  out.push(stepBox(p.id, ++n, 'Snabbkoll (3 min)', el('p', { text: 'Flervalsfrågor i provstil. De rättas direkt.' }), mcBlock(p.mc, 'mc-' + p.id)));
  if (p.calc && p.calc.length) out.push(stepBox(p.id, ++n, 'Räkna (5–10 min)', el('p', { text: 'Skriv svaret som ett tal (decimalkomma går bra, och 1,8e-5 eller 1,8·10^-5 för tiopotenser). Ta en ledtråd i taget om du kör fast.' }), calcBlock(p.calc, 'calc-' + p.id)));
  const qs = el('div'); passQs(p.id).forEach((x, k) => qs.append(qCard(x.id, { num: k + 1 })));
  out.push(stepBox(p.id, ++n, 'Instuderingsfrågor (5 min)', el('p', { text: 'Gör tre eller fyra frågor skriftligt, som på provet. Resten kommer tillbaka i repetitionen.' }), qs));
  out.push(stepBox(p.id, ++n, 'Övningar (5 min)', el('p', { text: 'Gör minst en.' }), exLinks(p.ovn)));
  return out;
}

function repSteps(p) {
  const out = [];
  out.push(el('div', { class: 'card' }, el('p', { text: p.id === 'p18' ? 'Dagen före provet: kör en blandning, titta på det du missar och sov sedan gott.' : 'Repetition: blanda allt. Flerval, räkneuppgifter och skrivfrågor från alla avsnitt. Det du haft svårt för kommer oftare.' })));
  const mcBox = el('div'); const fillMc = () => { mcBox.innerHTML = ''; mcBox.append(mcBlock(mix(allMC()).slice(0, 12), 'mc-' + p.id)); };
  fillMc();
  out.push(stepBox(p.id, 1, 'Blandad snabbkoll – 12 frågor', mcBox, el('button', { class: 'btn', onclick: fillMc }, 'Nya frågor')));
  const cBox = el('div'); const fillC = () => { cBox.innerHTML = ''; cBox.append(calcBlock(mix(allCalc()).slice(0, 5), 'rc-' + p.id + '-' + Date.now())); };
  fillC();
  out.push(stepBox(p.id, 2, 'Blandade räkneuppgifter – 5 st', cBox, el('button', { class: 'btn', onclick: fillC }, 'Nya uppgifter')));
  out.push(stepBox(p.id, 3, 'Provträning med skrivfrågor', el('p', null, el('a', { class: 'btn main ' + kc('rep'), href: '#prov' }, 'Starta provträningen'))));
  out.push(stepBox(p.id, 4, 'Övningar', exLinks(p.ovn)));
  out.push(stepBox(p.id, 5, 'Begrepp', el('p', { text: 'Kör begreppskorten med ”Bara de jag inte kan”.' }), el('a', { class: 'btn', href: '#begrepp' }, 'Till begreppen')));
  return out;
}

function viewProv() {
  const v = el('div', { class: kc('rep') });
  v.append(topnav('prov'));
  v.append(el('div', { class: 'hero ' + kc('rep') }, el('h1', { text: 'Provträning' }),
    el('p', { text: 'Del 1: tio flervalsfrågor. Del 2: sex räkneuppgifter. Del 3: åtta skrivfrågor. Skriv uträkningarna på papper, som på provet.' })));
  const mcBox = el('div', { class: 'card' }); mcBox.append(el('h2', { text: 'Del 1: Flerval' }), mcBlock(mix(allMC()).slice(0, 10), 'mc-prov'));
  const cBox = el('div', { class: 'card' }); cBox.append(el('h2', { text: 'Del 2: Räkna' }), calcBlock(mix(allCalc()).slice(0, 6), 'pc-' + Date.now()));
  const all = Object.keys(Q);
  const box = el('div', { class: 'card' }, el('h2', { text: 'Del 3: Skrivfrågor' }));
