body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",Verdana,"Segoe UI",sans-serif;font-size:1.1rem;line-height:1.7;letter-spacing:.01em}

p{margin:.4rem 0 .8rem}
a{color:inherit}
.soft{color:var(--soft)}
.small{font-size:.95rem}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.btn.main{background:var(--c,#3566B8);border-color:var(--c,#3566B8);color:#fff;font-weight:500}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.count{color:var(--soft);font-size:.95rem;margin-left:auto}
.topnav{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 1rem}
.topnav a{font-size:.95rem;text-decoration:none;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.25rem .8rem}
.topnav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--paper);border-radius:14px;padding:1.1rem 1.2rem;margin:0 0 1.1rem;border:2px solid var(--line)}

.hero{border-left:10px solid var(--c);background:var(--paper);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.2rem}
.hero .big{font-size:2.6rem;font-weight:700;line-height:1;color:var(--c)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.stat{display:flex;gap:1rem;flex-wrap:wrap;font-size:.95rem}

.passlist li{margin:.35rem 0}

.passlist .done .num{background:var(--ok)}

.wk{margin:1.1rem 0 .2rem;font-weight:700}

.step.isdone>h2 .sn{background:var(--ok)}
.stepdone{margin-left:auto;font-size:.9rem;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.15rem .7rem;cursor:pointer;min-height:36px}

.tip{background:var(--ct);border-radius:10px;padding:.6rem .9rem;margin:.6rem 0}
textarea,input[type=text],input[type=number],select{font:inherit;font-size:1rem;width:100%;border:2px solid var(--line);border-radius:10px;padding:.5rem .7rem;background:var(--field);color:var(--ink)}

.grade button.on.g2{background:var(--bad);border-color:var(--bad);color:#fff}

.pts li.hit{background:var(--okt)}
.pts li .mk{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--soft);margin-top:.25rem;cursor:pointer;background:transparent;padding:0}

.exl{display:flex;flex-wrap:wrap;gap:.5rem}

.exl a.done{border-color:var(--ok)}

.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .9rem}
.tabs button{font-size:.95rem;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .8rem;cursor:pointer;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--c,#3566B8);border-color:var(--c,#3566B8);color:#fff}
.grp{width:100%;font-size:.88rem;color:var(--soft);margin:.3rem 0 -.1rem}

.pool button.wrong,.chip.wrong{border-color:var(--bad);animation:shake .3s}

@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.msg{font-weight:500;min-height:1.6rem}
.figscroll{overflow-x:auto;border-radius:10px;background:#fff;border:2px solid var(--line)}
.fig{position:relative;width:100%;margin:0 auto}
.fig img{display:block;width:100%;height:auto}
.zone{position:absolute;border:2px dashed #E08A1E;border-radius:6px;background:rgba(255,248,235,.97);display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1.1;color:#1D2B3A;cursor:pointer;padding:0 3px;text-align:center;font-weight:600}
.zone.ok{border:2px solid #2E8B57;background:#E3F4EA;color:#1D5E3A}
.zone.shown{border:2px solid #7D8B99;background:#EEF1F4;color:#4A5A6B}
.zone.no{border-color:#C0392B;background:#FBE3E0;animation:shake .3s}
.picking .zone:not(.ok):not(.shown){background:rgba(232,240,252,.97);border-color:#3878B8}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0 .4rem}
.chip{font-size:1rem;border:2px solid var(--c,#E08A1E);background:var(--paper);color:var(--ink);border-radius:10px;padding:.4rem .75rem;cursor:grab;min-height:44px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;line-height:1.35}
.chip.sel{background:var(--c,#E08A1E);color:#fff}

.bucket.no{border-color:var(--bad);animation:shake .3s}
.picking2 .bucket{border-style:solid}

.pun{display:grid;gap:4px;margin:.8rem 0;max-width:24rem}

.par b{font-size:1.2rem}

.dna{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;letter-spacing:.05em;word-break:break-word;background:var(--field);border-radius:8px;padding:.4rem .6rem;border:2px solid var(--line)}

.cods{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}

.cods select{width:auto;min-width:8.5rem;font-family:inherit}
.cods select.ok{border-color:var(--ok);background:var(--okt)}
.cods select.no{border-color:var(--bad);background:var(--badt)}
.ctab{overflow-x:auto}
.ctab table{border-collapse:collapse;font-size:.85rem;font-family:ui-monospace,Menlo,Consolas,monospace}

.cmp{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;font-size:1rem}
.cmp .lbl{color:var(--soft)}
.aa{display:inline-block;border-radius:6px;padding:0 .3rem;margin:.1rem}

.letters{display:flex;flex-wrap:wrap;gap:.25rem;margin:.5rem 0}

.words{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;letter-spacing:.08em}

.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.9rem;color:var(--soft);margin:.4rem 0}

.tools{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.tools button{min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer}

.kw{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}

.term{border-left:6px solid var(--c);padding:.5rem .9rem;margin:.6rem 0;background:var(--ct);border-radius:0 10px 10px 0}

.match button.sel{border-color:#3878B8;background:rgba(56,120,184,.15)}
.match button.done{border-color:var(--ok);background:var(--okt);cursor:default}
.match button.wrong{border-color:var(--bad);animation:shake .3s}
.exq{font-size:1.2rem;font-weight:500;padding:1rem;border-radius:12px;background:var(--ct);margin:.4rem 0 .8rem}
.fcard{min-height:9rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:14px;padding:1.2rem;margin:.6rem 0;cursor:pointer;border:3px solid var(--c);background:var(--ct);font-size:1.25rem;font-weight:500;width:100%;color:var(--ink)}
.fcard small{display:block;font-size:.9rem;color:var(--soft);font-weight:400;margin-top:.5rem}
.note{border:2px dashed var(--line);border-radius:12px;padding:.6rem .9rem;font-size:.98rem;color:var(--soft)}
.sync{font-size:.85rem;color:var(--soft)}
footer{color:var(--soft);font-size:.92rem;margin-top:2rem}
@media (max-width:520px){h1{font-size:1.65rem}.match{grid-template-columns:1fr 1.3fr}.match button{font-size:.9rem}body{font-size:1.05rem}}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-his{--c:#7FA6E8;--ct:rgba(127,166,232,0.14)}:root:not([data-theme="light"]) .k-del{--c:#B48BE3;--ct:rgba(180,139,227,0.14)}:root:not([data-theme="light"]) .k-arv{--c:#F0A452;--ct:rgba(240,164,82,0.14)}:root:not([data-theme="light"]) .k-dna{--c:#5CC08F;--ct:rgba(92,192,143,0.14)}:root:not([data-theme="light"]) .k-epi{--c:#EB86B6;--ct:rgba(235,134,182,0.14)}:root:not([data-theme="light"]) .k-gte{--c:#4FC4B8;--ct:rgba(79,196,184,0.14)}:root:not([data-theme="light"]) .k-rep{--c:#AAB8C5;--ct:rgba(170,184,197,0.14)}:root:not([data-theme="light"]) .btn.main,:root:not([data-theme="light"]) .passlist .num,:root:not([data-theme="light"]) .step>h2 .sn,:root:not([data-theme="light"]) .tabs button[aria-pressed="true"],:root:not([data-theme="light"]) .answer span,:root:not([data-theme="light"]) .chip.sel{color:#161E26}}

<script>
const D={"PASSES": [{"id": "p1", "n": 1, "c": "gte", "day": "Lördag 28/11", "t": "Grunder från Kemi 1: stökiometri, koncentration och pH", "lasa": [["Lärarens repetitionsblad", "Kemi 1 REP", "Läs igenom tabellen med storheter och formlerna nedan. Läraren skriver att stökiometri måste sitta för att klara kemisk jämvikt."]], "gissa": ["Du har 100 cm³ saltsyra och häller i 900 cm³ vatten. Blir syran tio gånger svagare, eller tio gånger starkare – och varför?", "Tio gånger svagare (lägre koncentration). Substansmängden HCl är densamma, men den är nu utspridd i tio gånger så stor volym: c = n/V."], "guide": ["Storheterna m, n, M, V och c, och deras enheter.", "Formlerna n = m/M och c = n/V – och hur du löser ut vilken variabel som helst.", "Hur man räknar om cm³ till dm³.", "pH = −lg[H₃O⁺].", "Tabellen före – förändring – efter, med substansmängdsförhållandet."], "punkter": [["Massa m (g), substansmängd n (mol), molmassa M (g/mol), volym V (dm³), koncentration c (mol/dm³).", ["mol|molmassa|substansmängd"]], ["n = m / M och c = n / V, alltså n = c · V.", ["n = m|c = n|c·v|c · v"]], ["1 dm³ = 1 liter = 1 000 cm³ = 1 000 ml.", ["1000|1 000"]], ["Vid spädning är substansmängden densamma men volymen ökar, så koncentrationen sjunker.", ["späd"]], ["pH = −lg[H₃O⁺]. Om [H₃O⁺] = 0,01 mol/dm³ blir pH = 2.", ["ph"]], ["Ett salt som Na₂SO₄ ger två Na⁺ per formelenhet, så c(Na⁺) = 2 · c(Na₂SO₄).", ["na2so4|joner"]], ["Substansmängdsförhållandet ges av koefficienterna i reaktionsformeln, till exempel 1 : 3 : 2 för N₂ + 3 H₂ → 2 NH₃.", ["förhållande|koefficient"]]], "fragor": [["Vilka är storheterna, enheterna och beteckningarna för massa, substansmängd, molmassa, volym och koncentration?", ["massa: m, g · substansmängd: n, mol · molmassa: M, g/mol · volym: V, dm³ · koncentration: c eller [A], mol/dm³."]], ["Skriv sambandet mellan koncentration, volym och substansmängd. Lös också ut V.", ["c = n / V, alltså n = c · V och V = n / c."]], ["Varför ändras inte substansmängden när man späder en lösning?", ["Man tillsätter bara vatten. Det lösta ämnet blir inte fler eller färre partiklar – de sprids bara ut i en större volym."]], ["Vad betyder pH = −lg[H₃O⁺] i ord?", ["pH är minus tiologaritmen av oxoniumjonkoncentrationen. Varje steg på pH-skalan motsvarar en tiofaldig ändring av [H₃O⁺]."]], ["Hur använder man substansmängdsförhållandet i en reaktionsformel?", ["Koefficienterna visar i vilket förhållande ämnena reagerar och bildas. I N₂ + 3 H₂ → 2 NH₃ reagerar x mol N₂ med 3x mol H₂ och bildar 2x mol NH₃."]]], "mc": [["125 cm³ = ? dm³", ["12,5", "1,25", "0,125", "0,0125"], 2, "Dela med 1 000."], ["Vilket pH har en lösning med [H₃O⁺] = 1,00 mol/dm³?", ["−1", "0", "1", "14"], 1, "lg 1 = 0."], ["Vilket pH har en lösning med [H₃O⁺] = 10,0 mol/dm³?", ["−1", "0", "1", "10"], 0, "−lg 10 = −1. pH kan bli negativt i mycket starka lösningar."], ["Na₂SO₄ har koncentrationen 0,0150 mol/dm³. Vad är c(SO₄²⁻)?", ["0,0075", "0,0150", "0,0300", "0,0450"], 1, "En sulfatjon per formelenhet."], ["5,85 kg = ? g", ["0,00585", "585", "5 850", "58 500"], 2, "Gånger 1 000."]], "calc": [{"q": "Du har 100 cm³ saltsyra med c = 0,58 mol/dm³ och tillsätter 900 cm³ vatten. Vilken blir koncentrationen?", "ans": 0.058, "unit": "mol/dm³", "tol": 0.02, "hints": ["Räkna ut n(HCl) = c · V. Kom ihåg att V ska vara i dm³: 0,100 dm³.", "Den nya volymen är 1 000 cm³ = 1,000 dm³."], "sol": ["n = 0,58 · 0,100 = 0,058 mol", "c = 0,058 / 1,000 = 0,058 mol/dm³"]}, {"q": "Samma 100 cm³ saltsyra (0,58 mol/dm³), men du tillsätter 674 cm³ vatten. Vilken blir koncentrationen?", "ans": 0.0749, "unit": "mol/dm³", "tol": 0.02, "hints": ["n är fortfarande 0,058 mol.", "Ny volym: 100 + 674 = 774 cm³ = 0,774 dm³."], "sol": ["c = 0,058 / 0,774 = 0,075 mol/dm³"]}, {"q": "Beräkna pH om [H₃O⁺] = 0,0100 mol/dm³.", "ans": 2.0, "unit": "", "tol": 0.01, "hints": ["pH = −lg[H₃O⁺]", "0,0100 = 10⁻²"], "sol": ["pH = −lg 0,0100 = 2,00"]}, {"q": "Na₂SO₄-lösningen har c = 0,0150 mol/dm³. Vad är c(Na⁺)?", "ans": 0.03, "unit": "mol/dm³", "tol": 0.02, "hints": ["Na₂SO₄ → 2 Na⁺ + SO₄²⁻"], "sol": ["c(Na⁺) = 2 · 0,0150 = 0,0300 mol/dm³"]}, {"q": "N₂ + 3 H₂ → 2 NH₃. Du startar med 4,0 mol N₂ och 5,0 mol H₂. Det bildas 0,66 mol NH₃. Hur mycket H₂ finns kvar?", "ans": 4.0, "unit": "mol", "tol": 0.03, "hints": ["Förhållandet är 1 : 3 : 2. Om 0,66 mol NH₃ bildas har 0,66 · 3/2 mol H₂ reagerat.", "0,66 · 1,5 = 0,99 mol H₂ har förbrukats."], "sol": ["Förbrukat H₂: 0,99 mol", "Kvar: 5,0 − 0,99 = 4,0 mol (och N₂: 4,0 − 0,33 = 3,7 mol)"]}], "ovn": ["o_tabell", "s_storhet"]}, {"id": "p2", "n": 2, "c": "his", "day": "Söndag 29/11", "t": "Kap 2: Reaktionshastighet, aktiveringsenergi och katalysatorer", "lasa": [["Kemiboken 2", "s. 25–36", "Hela kapitel 2. Titta extra på energidiagrammen på s. 34 och sammanfattningen på s. 35."]], "gissa": ["Varför håller sig mat längre i kylskåpet?", "Vid låg temperatur rör sig molekylerna långsammare och färre kollisioner har tillräckligt hög energi. Därför går de kemiska reaktionerna som förstör maten långsammare."], "guide": ["Vad reaktionshastighet är och hur den kan mätas.", "De fyra K:na: koncentration, kontaktyta, katalysator och Kelvin (temperatur).", "Gynnsam kollision: rätt riktning och tillräckligt hög energi.", "Aktiveringsenergi, aktiverat komplex och intermediär.", "Exoterm och endoterm reaktion, ΔH, och hur en katalysator påverkar energidiagrammet."], "punkter": [["Reaktionshastighet = hur mycket ett ämne förbrukas eller bildas per tidsenhet.", ["hastighet"]], ["Joner i lösning reagerar ofta momentant. Reaktioner där kovalenta bindningar bryts går långsammare.", ["momentan|kovalent"]], ["Hastigheten ökar med högre koncentration, större kontaktyta, katalysator och högre temperatur.", ["koncentration", "kontaktyta|katalysator|temperatur"]], ["Ofta fördubblas hastigheten när temperaturen höjs 10 °C.", ["fördubbl|10 °c|10 grader"]], ["En gynnsam kollision kräver rätt riktning och tillräckligt hög energi.", ["kollision"]], ["Aktiveringsenergi, Eₐ, är den energi som krävs för att bilda det aktiverade komplexet.", ["aktiveringsenergi"]], ["Exoterm: värme avges, ΔH < 0. Endoterm: värme tas upp, ΔH > 0.", ["exoterm", "endoterm"]], ["En katalysator ger en annan reaktionsväg med lägre aktiveringsenergi och förbrukas inte.", ["katalysator"]]], "fragor": [["Vad menas med en reaktions hastighet?", ["Hur stor substansmängd av ett ämne som förbrukas eller bildas per tidsenhet, eller hur mycket koncentrationen av ett ämne ändras per tidsenhet."]], ["Ange tre olika sätt att öka hastigheten hos reaktionen mellan zink och saltsyra.", ["Använda zinkpulver i stället för en zinkbit (större kontaktyta), öka saltsyrans koncentration, och värma (högre temperatur)."]], ["Förklara med kollisioner varför reaktionshastigheten ökar med temperaturen.", ["Vid högre temperatur rör sig molekylerna snabbare. Det blir fler kollisioner, och framför allt får fler kollisioner tillräckligt hög energi för att nå aktiveringsenergin."]], ["Vad är aktiveringsenergi?", ["Den energi som måste tillföras för att det aktiverade komplexet ska bildas, alltså skillnaden i energi mellan reaktanterna och det aktiverade komplexet."]], ["Vad är en katalysator, och kan den ändra reaktionsriktningen?", ["Ett ämne som ökar reaktionshastigheten utan att själv förbrukas. Den ger en annan reaktionsväg med lägre aktiveringsenergi. Den kan inte ändra riktningen eller jämviktsläget, bara få reaktionen att gå snabbare åt båda hållen."]], ["Hur syns det att en reaktion är exoterm respektive endoterm?", ["Exoterm: värme avges, omgivningen blir varmare, ΔH < 0 och produkterna ligger lägre i energidiagrammet. Endoterm: värme tas upp, omgivningen blir kallare, ΔH > 0 och produkterna ligger högre."]], ["Vad är en reversibel reaktion?", ["En reaktion som kan gå åt båda hållen. Det markeras med dubbelpil ⇄."]], ["Vad är skillnaden mellan en intermediär och ett aktiverat komplex?", ["Båda är kortlivade mellanprodukter. Det aktiverade komplexet är det läge med högst energi som måste passeras. En intermediär är en mellanprodukt som bildas i ett av stegen i en reaktionsmekanism."]]], "mc": [["Vilken faktor ingår INTE i ”de fyra K:na”?", ["Koncentration", "Kontaktyta", "Katalysator", "Kemisk formel"], 3, "Den fjärde är Kelvin (temperatur)."], ["Reaktionshastigheten fördubblas per 10 °C. Hur många gånger snabbare går den vid 50 °C än vid 20 °C?", ["3", "6", "8", "30"], 2, "Tre höjningar: 2 · 2 · 2 = 8."], ["Vad gör en katalysator?", ["Höjer aktiveringsenergin", "Sänker aktiveringsenergin", "Ändrar ΔH", "Förskjuter jämvikten"], 1, "En annan väg med lägre Eₐ."], ["2 HI → H₂ + I₂, ΔH = +53 kJ. Vilken sorts reaktion?", ["Exoterm", "Endoterm"], 1, "ΔH > 0 betyder att energi tas upp."], ["Varför reagerar joner i lösning ofta momentant?", ["De är fasta", "De är fritt rörliga och inga kovalenta bindningar behöver brytas", "De har hög aktiveringsenergi", "De är katalysatorer"], 1, "Fällningsreaktioner är exempel."]], "calc": [{"q": "Reaktionshastigheten fördubblas när temperaturen stiger 10 °C. Hur många gånger ändras hastigheten om man sänker temperaturen från 60 °C till 30 °C? (Svara som decimaltal.)", "ans": 0.125, "unit": "gånger", "tol": 0.01, "hints": ["Tre sänkningar på 10 °C.", "Varje sänkning halverar hastigheten."], "sol": ["(1/2)³ = 1/8 = 0,125 – alltså en åttondel så snabb."]}, {"q": "0,12 g magnesium löses upp i saltsyra på 2,0 minuter. Beräkna reaktionshastigheten i mol Mg per minut. M(Mg) = 24,3 g/mol.", "ans": 0.00247, "unit": "mol/min", "tol": 0.03, "hints": ["n = m / M", "Dela substansmängden med tiden."], "sol": ["n = 0,12 / 24,3 = 0,00494 mol", "Hastighet = 0,00494 / 2,0 = 0,0025 mol/min"]}], "ovn": ["f_energi", "s_fyrak"]}, {"id": "p3", "n": 3, "c": "del", "day": "Lördag 5/12", "t": "Dynamisk jämvikt och jämviktsekvationen", "lasa": [["Kemiboken 2", "s. 37–43", "Jämviktslägen, dynamisk jämvikt, jämviktsekvationen (Guldberg-Waage) och exempel 1."]], "gissa": ["När en reaktion i ett slutet kärl har ”stannat” – har molekylerna slutat reagera?", "Nej! Reaktionen går lika snabbt åt båda hållen. Molekyler bildas och förbrukas hela tiden, men koncentrationerna ändras inte. Det kallas dynamisk jämvikt."], "guide": ["Vad dynamisk jämvikt betyder.", "Att olika utgångslägen kan ge samma jämviktsläge.", "Hur man tecknar jämviktsekvationen för en reaktion.", "Vad K-värdet säger om jämviktsläget, och att K beror på temperaturen.", "Vad som händer med K när reaktionen skrivs omvänd."], "punkter": [["Ingen reaktion ger 100 % utbyte – det blir en blandning av reaktanter och produkter.", ["100 %|blandning"]], ["Dynamisk jämvikt: reaktionen går lika snabbt åt höger som åt vänster, och koncentrationerna är konstanta.", ["dynamisk"]], ["Samma jämviktsläge nås oavsett om man startar från vänster eller höger sida.", ["utgångsläge|samma"]], ["Jämviktsekvationen (Guldberg-Waages lag, massverkans lag): K = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ.", ["jämviktsekvation|guldberg|massverkan"]], ["Produkterna står i täljaren och koefficienterna blir exponenter. Koncentrationer i mol/dm³.", ["täljare|exponent"]], ["Stort K: mycket produkter vid jämvikt. Litet K: mycket reaktanter.", ["stort k|litet k"]], ["K beror bara på temperaturen. Skrivs reaktionen omvänd blir K inverterat (1/K).", ["temperatur", "1/k|invert"]]], "fragor": [["Beskriv vad som menas med att ett system befinner sig i dynamisk jämvikt.", ["Den reversibla reaktionen går åt både höger och vänster med samma hastighet. Därför ändras inte koncentrationerna, trots att reaktionerna pågår hela tiden."]], ["Teckna jämviktsekvationen för CO(g) + Cl₂(g) ⇄ COCl₂(g).", ["K = [COCl₂] / ([CO] · [Cl₂])"]], ["Teckna jämviktsekvationen för 2 NO(g) + O₂(g) ⇄ 2 NO₂(g) och ange enheten för K.", ["K = [NO₂]² / ([NO]² · [O₂])", "Enhet: (mol/dm³)² / (mol/dm³)³ = (mol/dm³)⁻¹ = dm³/mol."]], ["När är jämviktskonstanten enhetslös?", ["När summan av koefficienterna i täljaren är lika med summan i nämnaren, till exempel H₂ + I₂ ⇄ 2 HI eller CH₄ + 2 O₂ ⇄ CO₂ + 2 H₂O."]], ["Vad säger ett stort respektive litet K-värde?", ["Stort K: jämvikten ligger långt åt höger – mycket produkter. Litet K: jämvikten ligger åt vänster – mycket reaktanter."]], ["Vilket förhållande råder mellan K₁ för en reaktion och K₂ för samma reaktion skriven omvänd?", ["K₂ = 1 / K₁. Täljare och nämnare byter plats."]], ["Varför är värdet på K oberoende av kärlets volym och av startkoncentrationerna?", ["K är en konstant som bara beror på temperaturen. Ändras volymen eller startkoncentrationerna anpassar sig jämviktskoncentrationerna så att kvoten ändå blir lika med K."]]], "mc": [["Vad är lika vid dynamisk jämvikt?", ["Koncentrationerna av alla ämnen", "Hastigheterna åt höger och vänster", "Substansmängderna av reaktanter och produkter", "Temperaturen och trycket"], 1, "Koncentrationerna är konstanta, men inte lika med varandra."], ["Vad står i täljaren i jämviktsekvationen?", ["Reaktanterna", "Produkterna", "Katalysatorn", "Temperaturen"], 1, "Ämnena till höger i formeln."], ["K för N₂ + 3 H₂ ⇄ 2 NH₃ är 2,37 · 10⁻³ (mol/dm³)⁻². Vad är K för 2 NH₃ ⇄ N₂ + 3 H₂?", ["2,37 · 10⁻³", "−2,37 · 10⁻³", "422 (mol/dm³)²", "4,74 · 10⁻³"], 2, "1 / 2,37 · 10⁻³ ≈ 422."], ["Vad påverkar värdet på K?", ["Koncentrationen", "Trycket", "En katalysator", "Temperaturen"], 3, "K är bara temperaturberoende."], ["Vilka formulerade jämviktsekvationen 1864?", ["Haber och Bosch", "Guldberg och Waage", "Le Chatelier", "Arrhenius"], 1, "Därför kallas den ibland Guldberg-Waages lag."]], "calc": [{"q": "Ett kärl på 1,0 dm³ innehåller vid jämvikt 0,10 mol H₂, 0,050 mol I₂ och 0,40 mol HI. Beräkna K för H₂ + I₂ ⇄ 2 HI.", "ans": 32, "unit": "", "tol": 0.02, "hints": ["K = [HI]² / ([H₂] · [I₂])", "Volymen är 1,0 dm³, så koncentrationerna blir samma tal som substansmängderna."], "sol": ["K = 0,40² / (0,10 · 0,050) = 0,16 / 0,0050 = 32"]}, {"q": "K = 2,37 · 10⁻³ (mol/dm³)⁻² för N₂ + 3 H₂ ⇄ 2 NH₃. Beräkna K för 2 NH₃ ⇄ N₂ + 3 H₂.", "ans": 422, "unit": "(mol/dm³)²", "tol": 0.02, "hints": ["Omvänd reaktion ger 1/K."], "sol": ["K = 1 / 2,37 · 10⁻³ = 422 (mol/dm³)²"]}, {"q": "Uppgift 3:6. Ett kärl på 0,50 dm³ innehåller vid jämvikt 3,7 · 10⁻⁴ mol NO, 0,80 mol O₂ och 0,25 mol NO₂. Beräkna K för 2 NO + O₂ ⇄ 2 NO₂. (Svara t.ex. 2,9e5.)", "ans": 285000.0, "unit": "dm³/mol", "tol": 0.04, "hints": ["Räkna först om till koncentrationer: dela med 0,50 dm³.", "[NO] = 7,4 · 10⁻⁴, [O₂] = 1,6 och [NO₂] = 0,50 mol/dm³.", "K = [NO₂]² / ([NO]² · [O₂])"], "sol": ["K = 0,50² / ((7,4 · 10⁻⁴)² · 1,6) = 0,25 / 8,76 · 10⁻⁷ = 2,9 · 10⁵ dm³/mol"]}], "ovn": ["s_kenhet", "o_jmvber"]}, {"id": "p4", "n": 4, "c": "del", "day": "Söndag 6/12", "t": "Q och beräkningar vid jämvikt", "lasa": [["Kemiboken 2", "s. 44–48", "Mallen för jämviktsberäkningar, ”Jämvikt eller inte?” med Q, och exempel 2–5."]], "gissa": ["Hur kan man veta åt vilket håll en reaktion kommer att gå, innan den har nått jämvikt?", "Man räknar ut koncentrationskvoten Q på samma sätt som K, men med de koncentrationer som finns just nu. Är Q mindre än K går reaktionen åt höger, är Q större går den åt vänster."], "guide": ["Mallen: reaktionsformel, tabell, koncentrationer.", "Vad Q är och hur den skiljer sig från K.", "Vad Q < K, Q = K och Q > K betyder.", "Hur man ställer upp en tabell med före, förändring och vid jämvikt med x.", "Hur man löser ekvationen och väljer det rimliga x-värdet."], "punkter": [["Mall: 1) skriv reaktionsformeln, 2) gör en tabell med substansmängder, 3) räkna ut koncentrationerna.", ["mall|tabell"]], ["Koncentrationskvoten Q räknas som K men med aktuella koncentrationer.", ["koncentrationskvot|q"]], ["Q = K: jämvikt råder.", ["q = k|jämvikt råder"]], ["Q < K: reaktionen går åt höger tills jämvikt nås.", ["höger"]], ["Q > K: reaktionen går åt vänster tills jämvikt nås.", ["vänster"]], ["Vid beräkningar: före – förändring (± x enligt koefficienterna) – vid jämvikt.", ["före|förändring"]], ["Ett x-värde som ger negativa substansmängder är orimligt och förkastas.", ["orimlig|förkasta"]]], "fragor": [["Vad är skillnaden mellan Q och K?", ["K är kvoten vid jämvikt och är konstant vid en viss temperatur. Q räknas ut på samma sätt men med de koncentrationer som finns vid ett godtyckligt tillfälle."]], ["Åt vilket håll går nettoreaktionen om Q > K? Förklara.", ["Åt vänster. Täljaren (produkterna) är för stor, så produkter måste omvandlas till reaktanter tills Q har minskat till K."]], ["Uppgift 3:7. K = 49 för H₂ + I₂ ⇄ 2 HI vid 450 °C. Ett kärl innehåller 5,0 mol H₂, 0,5 mol I₂ och 3,5 mol HI. Råder jämvikt?", ["Q = 3,5² / (5,0 · 0,5) = 12,25 / 2,5 = 4,9 (volymen tar ut varandra eftersom antalet mol är lika på båda sidor). Q < K, så jämvikt råder inte. Reaktionen går åt höger och mer HI bildas."]], ["Uppgift 3:8. K = 0,6 för H₂ + CO₂ ⇄ CO + H₂O. Kärlet innehåller 0,25 mol H₂, 0,10 mol CO₂, 0,15 mol CO och 0,20 mol H₂O. Råder jämvikt?", ["Q = (0,15 · 0,20) / (0,25 · 0,10) = 0,030 / 0,025 = 1,2. Q > K, så det är inte jämvikt. Reaktionen går åt vänster."]], ["Beskriv hur man ställer upp en tabell för att räkna ut koncentrationer vid jämvikt.", ["Skriv reaktionsformeln. Rad 1: substansmängder före. Rad 2: förändring – en okänd x för det som reagerar, multiplicerad med koefficienterna (minus för reaktanter, plus för produkter). Rad 3: substansmängder vid jämvikt. Rad 4: koncentrationer (dela med volymen). Sätt in i jämviktsekvationen och lös ut x."]], ["Varför förkastar man ibland ett av x-värdena?", ["Ett andragradsuttryck ger två lösningar. Om ett värde skulle ge negativa substansmängder, eller att mer har reagerat än som fanns från början, är det orimligt."]]], "mc": [["Q = 6,25 och K = 49. Vad händer?", ["Jämvikt råder", "Reaktionen går åt höger", "Reaktionen går åt vänster", "Inget kan sägas"], 1, "Q < K."], ["Q = K betyder …", ["att reaktionen går åt höger", "att jämvikt råder", "att reaktionen går åt vänster", "att K ändras"], 1, "Inga koncentrationsförändringar sker."], ["Vid H₂ + I₂ ⇄ 2 HI minskar H₂ med x mol. Hur ändras HI?", ["+x", "−x", "+2x", "−2x"], 2, "Koefficienten för HI är 2."], ["Man får x₁ = 0,30 och x₂ = 1,14 mol. Från början fanns 0,60 mol H₂. Vilket är rimligt?", ["0,30", "1,14", "Båda", "Inget"], 0, "Mer än 0,60 mol kan inte reagera."]], "calc": [{"q": "Uppgift 3:7: Beräkna Q om kärlet innehåller 5,0 mol H₂, 0,5 mol I₂ och 3,5 mol HI (H₂ + I₂ ⇄ 2 HI).", "ans": 4.9, "unit": "", "tol": 0.02, "hints": ["Q = [HI]² / ([H₂][I₂])", "Volymen tar ut varandra här, så du kan räkna med mol."], "sol": ["Q = 3,5² / (5,0 · 0,5) = 4,9 → Q < K = 49 → åt höger"]}, {"q": "Uppgift 3:8: Beräkna Q för H₂ + CO₂ ⇄ CO + H₂O med 0,25 mol H₂, 0,10 mol CO₂, 0,15 mol CO och 0,20 mol H₂O.", "ans": 1.2, "unit": "", "tol": 0.02, "hints": ["Q = [CO][H₂O] / ([H₂][CO₂])"], "sol": ["Q = 0,030 / 0,025 = 1,2 → Q > K = 0,6 → åt vänster"]}, {"q": "SO₂ + NO₂ ⇄ SO₃ + NO, K = 9,0. Man startar med 0,010 mol SO₂ och 0,010 mol NO₂ i 1,0 dm³. Hur mycket NO finns vid jämvikt?", "ans": 0.0075, "unit": "mol", "tol": 0.02, "hints": ["Tabell: SO₂ och NO₂ blir 0,010 − x, SO₃ och NO blir x.", "x² / (0,010 − x)² = 9,0. Dra roten ur båda leden.", "x / (0,010 − x) = 3"], "sol": ["x = 3(0,010 − x) → 4x = 0,030 → x = 0,0075 mol"]}, {"q": "Uppgift 3:12: 1,00 mol CO och okänd mängd H₂ i 50,0 dm³. CO + 2 H₂ ⇄ CH₃OH, K = 247 (mol/dm³)⁻². Vid jämvikt finns 0,40 mol metanol. Hur mycket H₂ infördes?", "ans": 3.4, "unit": "mol", "tol": 0.03, "hints": ["Vid jämvikt: CH₃OH 0,40 mol, CO 1,00 − 0,40 = 0,60 mol. Koncentrationer: dela med 50,0.", "[CH₃OH] = 0,0080 och [CO] = 0,012 mol/dm³. Lös [H₂]² = [CH₃OH] / (K · [CO]).", "Glöm inte att 2 · 0,40 = 0,80 mol H₂ har förbrukats."], "sol": ["[H₂]² = 0,0080 / (247 · 0,012) = 0,00270 → [H₂] = 0,0520 mol/dm³", "n(H₂) vid jämvikt = 0,0520 · 50,0 = 2,60 mol", "Infört: 2,60 + 0,80 = 3,4 mol"]}, {"q": "Uppgift 3:11a. Jämviktsblandningen innehåller 0,60 mol SO₃, 0,40 mol NO, 0,10 mol NO₂ och 0,80 mol SO₂. Beräkna K för SO₂ + NO₂ ⇄ SO₃ + NO.", "ans": 3.0, "unit": "", "tol": 0.02, "hints": ["K = [SO₃][NO] / ([SO₂][NO₂])", "Lika många mol på båda sidor – volymen tar ut varandra."], "sol": ["K = (0,60 · 0,40) / (0,80 · 0,10) = 3,0"]}, {"q": "Uppgift 3:10. 2,0 g PCl₅ (M = 208,2 g/mol) i 0,500 dm³. Vid jämvikt finns 0,50 g Cl₂ (M = 70,9 g/mol). Beräkna K för PCl₅ ⇄ PCl₃ + Cl₂.", "ans": 0.039, "unit": "mol/dm³", "tol": 0.04, "hints": ["n(PCl₅) från början = 2,0 / 208,2. n(Cl₂) vid jämvikt = 0,50 / 70,9 = n(PCl₃).", "n(PCl₅) vid jämvikt = start − n(Cl₂). Dela allt med 0,500 dm³.", "K = [PCl₃][Cl₂] / [PCl₅]"], "sol": ["n(PCl₅) start = 9,61 · 10⁻³ mol, n(Cl₂) = n(PCl₃) = 7,05 · 10⁻³ mol, n(PCl₅) kvar = 2,55 · 10⁻³ mol", "K = (0,0141)² / 0,00511 = 0,039 mol/dm³"]}], "ovn": ["s_kq", "o_jmvber"]}, {"id": "p5", "n": 5, "c": "del", "day": "Lördag 12/12", "t": "Le Chateliers princip: koncentration, tryck, temperatur", "lasa": [["Kemiboken 2", "s. 49–55", "Förskjutning av jämviktslägen, Haber-Bosch-metoden, och att katalysatorer inte påverkar jämviktsläget."]], "gissa": ["Ammoniak tillverkas av kväve och väte. Borde man köra fabriken vid hög eller låg temperatur för att få mest ammoniak?", "Låg temperatur ger mest ammoniak, eftersom reaktionen åt höger är exoterm. Men vid låg temperatur går det för långsamt. Därför kör man vid cirka 450 °C, högt tryck och med katalysator – en kompromiss."], "guide": ["Le Chateliers princip.", "Vad som händer när man tillsätter eller tar bort ett ämne.", "Hur tryckökning påverkar jämvikter med gaser – och när den inte gör det.", "Hur temperatur påverkar, och att K ändras med temperaturen.", "Varför en katalysator inte ändrar jämviktsläget."], "punkter": [["Le Chatelier: om man ändrar något i ett system i jämvikt förskjuts jämvikten så att ändringen motverkas.", ["chatelier|motverka"]], ["Ökad koncentration av ett ämne → jämvikten förskjuts så att ämnet delvis förbrukas. K ändras inte.", ["koncentration"]], ["Ökat tryck → förskjuts mot den sida som har färre gasmolekyler.", ["tryck", "gasmolekyl|substansmängd gas|färre"]], ["Lika många gasmolekyler på båda sidor → trycket påverkar inte.", ["lika många"]], ["Höjd temperatur gynnar den endoterma riktningen. K ändras med temperaturen.", ["endoterm"]], ["För en exoterm reaktion minskar K när temperaturen höjs.", ["exoterm"]], ["Katalysatorn sänker aktiveringsenergin lika mycket åt båda hållen – jämvikt nås snabbare men läget ändras inte.", ["katalysator"]], ["Haber-Bosch: N₂ + 3 H₂ ⇄ 2 NH₃ + 92 kJ. Industriellt ca 450 °C, 15–20 MPa och järnkatalysator.", ["haber|ammoniak"]]], "fragor": [["Formulera Le Chateliers princip.", ["Om man gör en förändring i ett system som befinner sig i jämvikt, förskjuts jämviktsläget så att förändringen motverkas."]], ["CoCl₄²⁻ (blå) + 6 H₂O ⇄ Co(H₂O)₆²⁺ (rosa) + 4 Cl⁻. Vad händer om man tillsätter koncentrerad saltsyra? Ändras K?", ["Kloridjonerna ökar, så jämvikten förskjuts åt vänster för att förbruka Cl⁻. Lösningen blir mer blå. K ändras inte, eftersom temperaturen är densamma."]], ["N₂ + 3 H₂ ⇄ 2 NH₃, ΔH = −92 kJ. Vilken riktning är exoterm och vilken endoterm? Ger låg eller hög temperatur mest ammoniak?", ["Åt höger är exoterm och åt vänster endoterm. Låg temperatur gynnar den exoterma riktningen, så mest ammoniak bildas vid låg temperatur."]], ["Vad är nackdelen med att tillverka ammoniak vid låg temperatur, och hur löser man det?", ["Reaktionen går mycket långsamt. Man använder en katalysator (järn) och en kompromisstemperatur på cirka 450 °C, samt högt tryck."]], ["Bildas mer, mindre eller lika mycket ammoniak om man minskar volymen på jämviktsblandningen? Förklara.", ["Mer. Mindre volym ger högre tryck. Jämvikten förskjuts mot den sida som har färre gasmolekyler: 4 mol gas till vänster mot 2 mol till höger, alltså åt höger."]], ["Uppgift 3:14. För N₂O₄ ⇄ 2 NO₂ ökar K med ökande temperatur. Är reaktionen åt höger exoterm eller endoterm?", ["Endoterm. En temperaturhöjning gynnar den endoterma riktningen, och när K ökar betyder det att jämvikten förskjuts åt höger."]], ["Varför påverkar en katalysator inte jämviktsläget?", ["Den sänker aktiveringsenergin lika mycket för reaktionen åt höger som åt vänster. Båda hastigheterna ökar lika mycket, så jämvikten nås snabbare men på samma läge."]], ["Uppgift 3:18. 2 NO + O₂ ⇄ 2 NO₂ + värme. NO₂ är lättlösligt i vatten. Hur ändras jämvikten om man a) sänker trycket, b) sänker temperaturen, c) tillsätter lite vatten, d) tillsätter katalysator?", ["a) Åt vänster (fler gasmolekyler där). b) Åt höger (exoterm riktning gynnas). c) Åt höger – NO₂ löses i vattnet och försvinner ur gasfasen. d) Ingen förändring – jämvikt nås bara snabbare."]]], "mc": [["Vad händer med K när man tillsätter mer av en reaktant (konstant temperatur)?", ["K ökar", "K minskar", "K är oförändrad", "K blir noll"], 2, "Bara temperaturen ändrar K."], ["H₂ + I₂ ⇄ 2 HI. Vad händer om trycket ökas?", ["Åt höger", "Åt vänster", "Ingen förskjutning"], 2, "Två mol gas på varje sida."], ["2 NO₂ (rödbrun) ⇄ N₂O₄ (färglös) + värme. Vad händer i isvatten?", ["Blir mer rödbrun", "Blir ljusare", "Ingen ändring"], 1, "Låg temperatur gynnar den exoterma riktningen åt höger."], ["Uppgift 3:15a: 2 O₃ ⇄ 3 O₂. Vad händer vid ökat tryck?", ["Åt höger", "Åt vänster", "Ingen förskjutning"], 1, "Färre gasmolekyler till vänster."], ["Uppgift 3:16c: N₂ + O₂ ⇄ 2 NO, ΔH = +180 kJ. Vid temperaturhöjning?", ["Åt höger", "Åt vänster", "Ingen förskjutning"], 0, "Endoterm åt höger gynnas."]], "calc": [], "ovn": ["s_lechat", "s_tryck"]}, {"id": "p6", "n": 6, "c": "arv", "day": "Söndag 13/12", "t": "Vattnets jonprodukt, pH och syrakonstanten Ka", "lasa": [["Kemiboken 2", "s. 56–61", "Sammanfattningen från kurs 1, vattnets autoprotolys och Kw, syrakonstanten och exempel 6–7."]], "gissa": ["0,1 mol/dm³ saltsyra och 0,1 mol/dm³ ättiksyra har samma koncentration. Har de samma pH?", "Nej. Saltsyra är en stark syra och är helt protolyserad, pH ≈ 1. Ättiksyra är svag och bara en liten del är protolyserad, så pH ≈ 2,9."], "guide": ["Vattnets autoprotolys och jonprodukten Kw.", "pH + pOH = 14 vid 25 °C – och att Kw ändras med temperaturen.", "Starka syror (helt protolyserade) och svaga syror (ofullständigt).", "Syrakonstanten Ka och vad den säger om syrastyrkan.", "Hur man beräknar pH i en svag syra med tabell och x."], "punkter": [["Vattnets autoprotolys: H₂O + H₂O ⇄ H₃O⁺ + OH⁻. Vatten är en amfolyt.", ["autoprotolys|amfolyt"]], ["Kw = [H₃O⁺] · [OH⁻] = 1,00 · 10⁻¹⁴ (mol/dm³)² vid 25 °C. [H₂O] = 56 mol/dm³ räknas som konstant.", ["kw|jonprodukt"]], ["pH + pOH = pKw = 14,00 vid 25 °C.", ["poh|14"]], ["Kw ökar med temperaturen (3,75 · 10⁻¹³ vid 100 °C). Neutralt pH är då lägre än 7.", ["100 °c|temperatur"]], ["Starka syror är fullständigt protolyserade: HCl, HNO₃ och första steget i H₂SO₄. Alla andra är svaga.", ["stark", "svag"]], ["Ka = [H₃O⁺][A⁻] / [HA]. Större Ka = starkare syra. Ättiksyra: Ka = 1,8 · 10⁻⁵ mol/dm³.", ["ka|syrakonstant"]], ["pH i svag syra: sätt [H₃O⁺] = x, då blir x² / (c − x) = Ka.", ["x²|x2"]]], "fragor": [["Teckna vattnets jonprodukt och förklara varför pH = 7,0 i en neutral lösning vid 25 °C.", ["Kw = [H₃O⁺] · [OH⁻] = 1,00 · 10⁻¹⁴. I neutral lösning är [H₃O⁺] = [OH⁻], alltså är båda 1,0 · 10⁻⁷ mol/dm³ och pH = 7,0."]], ["Varför kan vattenkoncentrationen räknas som konstant i Kw?", ["1 dm³ vatten väger 1 000 g, alltså 1 000/18 = 56 mol/dm³. Bara en mycket liten del protolyseras, så [H₂O] ändras nästan inte."]], ["Uppgift 3:29. pH = 7,0 vid 100 °C och Kw = 3,75 · 10⁻¹³. Är lösningen sur, neutral eller basisk?", ["Neutralt vid 100 °C: [H₃O⁺] = √(3,75 · 10⁻¹³) = 6,1 · 10⁻⁷, pH = 6,2. pH 7,0 är alltså högre än neutralt – lösningen är svagt basisk."]], ["Uppgift 3:21. Varför har 0,1 mol/dm³ saltsyra lägre pH än 0,1 mol/dm³ ättiksyra?", ["Saltsyra är en stark syra och protolyseras fullständigt, så [H₃O⁺] = 0,1. Ättiksyra är svag och bara en liten del protolyseras, så [H₃O⁺] blir mycket mindre och pH högre."]], ["Varför har inte de starka syrorna något Ka-värde i tabellen?", ["De är fullständigt protolyserade. Koncentrationen oprotolyserad syra är försumbar, så Ka blir enormt stort och används inte."]], ["Uppgift 3:22. Ordna HCN, HF och HCOOH från starkast till svagast.", ["Ka: HF 6,8 · 10⁻⁴ > HCOOH 2,0 · 10⁻⁴ > HCN 4,0 · 10⁻¹⁰. Alltså HF, HCOOH, HCN."]], ["Vad är skillnaden mellan en syras totalkoncentration och [H₃O⁺]?", ["Totalkoncentrationen är syrans koncentration före protolys. [H₃O⁺] är bara den del som har protolyserats. För en stark syra är de lika, för en svag syra är [H₃O⁺] mycket mindre."]]], "mc": [["Vilken syra är stark?", ["Ättiksyra", "Fosforsyra", "Salpetersyra", "Vätefluorid"], 2, "HCl, HNO₃ och första steget i H₂SO₄."], ["Vad är [OH⁻] i rent vatten vid 25 °C?", ["0", "1,0 · 10⁻⁷", "1,0 · 10⁻¹⁴", "7"], 1, "[H₃O⁺] = [OH⁻] = √Kw."], ["pH = 3,0. Vad är pOH vid 25 °C?", ["3,0", "7,0", "11,0", "14,0"], 2, "14,0 − 3,0."], ["Ju större Ka, desto …", ["svagare syra", "starkare syra", "högre pH", "mindre [H₃O⁺]"], 1, "Mer protolyserad."], ["Vad händer med Kw när temperaturen stiger?", ["Ökar", "Minskar", "Oförändrat"], 0, "Autoprotolysen är endoterm."]], "calc": [{"q": "Uppgift 3:19. I kallt kaffe är [H₃O⁺] = 2,5 · 10⁻⁶ mol/dm³. Beräkna pH.", "ans": 5.6, "unit": "", "tol": 0.01, "hints": ["pH = −lg[H₃O⁺]"], "sol": ["pH = −lg(2,5 · 10⁻⁶) = 5,6"]}, {"q": "pH är 3,20 vid 25 °C. Beräkna [OH⁻]. (Svara t.ex. 1,6e-11.)", "ans": 1.58e-11, "unit": "mol/dm³", "tol": 0.04, "hints": ["pOH = 14,00 − pH", "[OH⁻] = 10^(−pOH)"], "sol": ["pOH = 10,80", "[OH⁻] = 10⁻¹⁰'⁸ = 1,6 · 10⁻¹¹ mol/dm³"]}, {"q": "Beräkna pH i 0,050 mol/dm³ saltsyra.", "ans": 1.3, "unit": "", "tol": 0.01, "hints": ["Stark syra: [H₃O⁺] = c(HCl)."], "sol": ["pH = −lg 0,050 = 1,30"]}, {"q": "Beräkna pH i 0,050 mol/dm³ ättiksyra. Ka = 1,8 · 10⁻⁵ mol/dm³.", "ans": 3.03, "unit": "", "tol": 0.01, "hints": ["HAc + H₂O ⇄ H₃O⁺ + Ac⁻. Vid jämvikt: [H₃O⁺] = [Ac⁻] = x och [HAc] = 0,050 − x.", "x² / (0,050 − x) = 1,8 · 10⁻⁵. Eftersom x är litet kan du sätta 0,050 − x ≈ 0,050.", "x = √(1,8 · 10⁻⁵ · 0,050)"], "sol": ["x = √(9,0 · 10⁻⁷) = 9,5 · 10⁻⁴ mol/dm³", "pH = −lg(9,5 · 10⁻⁴) = 3,0"]}, {"q": "Uppgift 3:31. I 0,050 mol/dm³ ättiksyra är 1,9 % protolyserat. Beräkna Ka. (Svara t.ex. 1,8e-5.)", "ans": 1.84e-05, "unit": "mol/dm³", "tol": 0.04, "hints": ["[H₃O⁺] = [Ac⁻] = 0,019 · 0,050", "[HAc] = 0,050 − 0,00095"], "sol": ["[H₃O⁺] = 9,5 · 10⁻⁴ → pH = 3,02", "Ka = (9,5 · 10⁻⁴)² / 0,04905 = 1,8 · 10⁻⁵ mol/dm³ → pKa = 4,7"]}], "ovn": ["s_syrastyrka", "o_phsvag"]}, {"id": "p7", "n": 7, "c": "arv", "day": "Måndag 14/12", "t": "Baskonstanten Kb, Ka · Kb = Kw och salters pH", "lasa": [["Kemiboken 2", "s. 61–67", "Baskonstanten, tabellen på s. 62, sambandet Ka · Kb = Kw, flerprotoniga syror och hur lösta salter påverkar pH."]], "gissa": ["Natriumacetat är ett salt. Blir en lösning av det sur, neutral eller basisk?", "Basisk! Acetatjonen är korresponderande bas till den svaga ättiksyran och tar upp protoner från vattnet: Ac⁻ + H₂O ⇄ HAc + OH⁻."], "guide": ["Baskonstanten Kb och exemplet ammoniak.", "Sambandet Ka · Kb = Kw och pKa + pKb = 14.", "Korresponderande syra-baspar.", "Flerprotoniga syror som protolyseras i flera steg.", "Hur man avgör om ett salt ger sur, basisk eller neutral lösning – även amfolyter."], "punkter": [["Kb = [HA][OH⁻] / [A⁻]. Ammoniak: Kb = 1,8 · 10⁻⁵ mol/dm³.", ["kb|baskonstant"]], ["Ka · Kb = Kw och pKa + pKb = 14,00 för ett korresponderande syra-baspar vid 25 °C.", ["ka · kb|pka + pkb"]], ["Ju starkare syran är, desto svagare är dess korresponderande bas.", ["korresponderande"]], ["Flerprotoniga syror (H₂CO₃, H₃PO₄) protolyseras steg för steg och är starkast i första steget.", ["flerprotonig"]], ["Negativa joner från svaga syror (Ac⁻, CO₃²⁻, PO₄³⁻) ger basisk lösning. Cl⁻ och NO₃⁻ är neutrala.", ["basisk"]], ["NH₄⁺ och hydratiserade Al³⁺ är svaga syror och ger sur lösning.", ["nh4|ammonium|alumin"]], ["En amfolyt ger basisk lösning om Kb > Ka (HCO₃⁻) och sur om Ka > Kb (HSO₄⁻, H₂PO₄⁻).", ["amfolyt"]]], "fragor": [["Vilken är den korresponderande basen till a) HF, b) HCl, c) HNO₃, d) H₂CO₃, e) H₃PO₄, f) HAc?", ["a) F⁻ b) Cl⁻ c) NO₃⁻ d) HCO₃⁻ e) H₂PO₄⁻ f) Ac⁻ (CH₃COO⁻)"]], ["Vilka baser i föregående fråga protolyserar inte vatten?", ["Cl⁻ och NO₃⁻ – de är korresponderande baser till starka syror och är så svaga att de inte påverkar pH."]], ["Härled sambandet Ka · Kb = Kw.", ["Ka = [H₃O⁺][A⁻]/[HA] och Kb = [HA][OH⁻]/[A⁻]. Multiplicera: [A⁻] och [HA] tar ut varandra och kvar blir [H₃O⁺][OH⁻] = Kw."]], ["Uppgift 3:24. Skriv protolysformel för ammoniak som bas i vatten, och en formel där ammoniak fungerar som syra.", ["Som bas: NH₃ + H₂O ⇄ NH₄⁺ + OH⁻.", "Som syra (med en mycket stark bas): NH₃ + OH⁻ ⇄ NH₂⁻ + H₂O."]], ["Uppgift 3:26. Förklara med protolysformel varför bikarbonat, NaHCO₃, används mot sur mage. Använd tabellvärden.", ["HCO₃⁻ + H₂O ⇄ H₂CO₃ + OH⁻, Kb = 2,4 · 10⁻⁸. Som syra: HCO₃⁻ + H₂O ⇄ CO₃²⁻ + H₃O⁺, Ka = 4,7 · 10⁻¹¹. Kb > Ka, så vätekarbonatjonen är starkare som bas och neutraliserar magsyran: HCO₃⁻ + H₃O⁺ → CO₂ + 2 H₂O."]], ["Uppgift 3:28. Skriv protolysformler som visar vätefosfatjonen HPO₄²⁻ a) som syra, b) som bas.", ["a) HPO₄²⁻ + H₂O ⇄ PO₄³⁻ + H₃O⁺", "b) HPO₄²⁻ + H₂O ⇄ H₂PO₄⁻ + OH⁻"]], ["Uppgift 3:32. Vilken reaktion (sur, basisk, neutral) har a) natriumacetat, b) ammoniumklorid, c) aluminiumklorid, d) natriumkarbonat?", ["a) basisk (Ac⁻ är bas) b) sur (NH₄⁺ är syra) c) sur (hydratiserade Al³⁺ är syra) d) basisk (CO₃²⁻ är bas)"]], ["Uppgift 3:34. Vilka partiklar (förutom vatten) finns i en ättiksyralösning?", ["HAc (mest, oprotolyserad), H₃O⁺, Ac⁻ och mycket lite OH⁻."]]], "mc": [["Vilket salt ger basisk lösning?", ["NaCl", "NH₄Cl", "Na₂CO₃", "KNO₃"], 2, "CO₃²⁻ är en ganska stark bas."], ["Vilket salt ger sur lösning?", ["NaAc", "NH₄NO₃", "NaCl", "Na₃PO₄"], 1, "NH₄⁺ är en svag syra."], ["pKa för en syra är 4,76. Vad är pKb för dess korresponderande bas?", ["4,76", "9,24", "14,00", "−4,76"], 1, "14,00 − 4,76."], ["Vad är korresponderande bas till HSO₃⁻?", ["H₂SO₃", "SO₃²⁻", "SO₄²⁻", "HSO₄⁻"], 1, "Ta bort en proton."], ["I vilket steg är en flerprotonig syra starkast?", ["Första", "Sista", "Alla lika"], 0, "Det är svårare att ta bort en proton från en negativ jon."]], "calc": [{"q": "En syra har Ka = 1,5 · 10⁻³ mol/dm³. Beräkna pKa.", "ans": 2.82, "unit": "", "tol": 0.01, "hints": ["pKa = −lg Ka"], "sol": ["pKa = −lg(1,5 · 10⁻³) = 2,82 (och pKb = 14,00 − 2,82 = 11,18, Kb = 6,7 · 10⁻¹²)"]}, {"q": "Samma syra (Ka = 1,5 · 10⁻³). Beräkna Kb för den korresponderande basen. (Svara t.ex. 6,7e-12.)", "ans": 6.67e-12, "unit": "mol/dm³", "tol": 0.03, "hints": ["Kb = Kw / Ka"], "sol": ["Kb = 1,00 · 10⁻¹⁴ / 1,5 · 10⁻³ = 6,7 · 10⁻¹²"]}, {"q": "Beräkna pH i 0,10 mol/dm³ ammoniak. Kb = 1,8 · 10⁻⁵ mol/dm³.", "ans": 11.13, "unit": "", "tol": 0.01, "hints": ["NH₃ + H₂O ⇄ NH₄⁺ + OH⁻. Sätt [OH⁻] = x.", "x ≈ √(Kb · c)", "pOH = −lg x och pH = 14,00 − pOH"], "sol": ["x = √(1,8 · 10⁻⁶) = 1,34 · 10⁻³", "pOH = 2,87 → pH = 11,1"]}, {"q": "Beräkna pH i 0,050 mol/dm³ natriumacetat. Kb(Ac⁻) = 5,7 · 10⁻¹⁰ mol/dm³.", "ans": 8.73, "unit": "", "tol": 0.01, "hints": ["Ac⁻ + H₂O ⇄ HAc + OH⁻. Sätt [OH⁻] = x.", "x ≈ √(Kb · c)", "pH = 14,00 − pOH"], "sol": ["x = √(2,85 · 10⁻¹¹) = 5,3 · 10⁻⁶", "pOH = 5,27 → pH = 8,7"]}, {"q": "Beräkna pH i 0,020 mol/dm³ NaOH.", "ans": 12.3, "unit": "", "tol": 0.01, "hints": ["NaOH är en stark bas: [OH⁻] = 0,020.", "pOH = −lg[OH⁻], pH = 14,00 − pOH"], "sol": ["pOH = 1,70 → pH = 12,30"]}], "ovn": ["s_salt", "s_paret"]}, {"id": "p8", "n": 8, "c": "dna", "day": "Tisdag 15/12", "t": "Titrering och titrerkurvor", "lasa": [["Kemiboken 2", "s. 67–70", "Ekvivalenspunkten, titrerkurvor för stark och svag syra, och halvtitrerpunkten där pH = pKa."]], "gissa": ["När man titrerar ättiksyra med natriumhydroxid – blir pH 7 i ekvivalenspunkten?", "Nej, pH blir cirka 8,7. I ekvivalenspunkten finns natriumacetat, och acetatjonen är en svag bas. Bara när en stark syra titreras med en stark bas blir pH 7."], "guide": ["Vad ekvivalenspunkten är: n(syra) = n(bas).", "Hur titrerkurvan för stark syra + stark bas ser ut.", "Hur kurvan för svag syra + stark bas skiljer sig (startpunkt, flackt område, ekvivalenspunkt > 7).", "Halvtitrerpunkten och varför pH = pKa där.", "Hur man räknar ut en okänd koncentration från en titrering."], "punkter": [["Ekvivalenspunkten: tillsatt substansmängd bas = ursprunglig substansmängd syra.", ["ekvivalens"]], ["Stark syra + stark bas: pH = 7 i ekvivalenspunkten (NaCl-lösning). BTB passar som indikator.", ["ph = 7|btb"]], ["Kurvan är mycket brant runt ekvivalenspunkten.", ["brant"]], ["Svag syra + stark bas: högre startpH, ett flackt buffertområde och pH > 7 i ekvivalenspunkten (NaAc är basisk).", ["svag syra", "basisk|> 7"]], ["Halvtitrerpunkten: halva volymen till ekvivalenspunkten. Där är [HA] = [A⁻], så pH = pKa.", ["halvtitrer", "pka"]], ["Vid beräkning: n = c · V, och substansmängdsförhållandet ur reaktionsformeln (t.ex. 1 : 2 för H₂SO₄ och NaOH).", ["n = c|förhållande"]]], "fragor": [["Vad menas med ekvivalenspunkten?", ["Den punkt där den tillsatta substansmängden bas är precis lika stor som den substansmängd syra som fanns från början (enligt reaktionsformeln)."]], ["Varför är pH = 7 i ekvivalenspunkten när saltsyra titreras med natriumhydroxid?", ["I ekvivalenspunkten finns bara natriumkloridlösning. Cl⁻ är en så svag bas och Na⁺ en så svag syra att ingen av dem påverkar pH."]], ["Varför är pH > 7 i ekvivalenspunkten när ättiksyra titreras med natriumhydroxid?", ["I ekvivalenspunkten finns natriumacetat. Acetatjonen är korresponderande bas till en svag syra och reagerar med vatten: Ac⁻ + H₂O ⇄ HAc + OH⁻. Det ger basisk lösning."]], ["Visa att pH = pKa i halvtitrerpunkten.", ["I halvtitrerpunkten har hälften av syran omvandlats, så [HA] = [A⁻]. Ka = [H₃O⁺][A⁻]/[HA] = [H₃O⁺]. Logaritmera: −lg Ka = −lg[H₃O⁺], alltså pKa = pH."]], ["Beskriv hur titrerkurvan för en svag syra skiljer sig från kurvan för en stark syra.", ["Den startar vid högre pH, stiger först lite och planar sedan ut i ett flackt buffertområde, har ett mindre pH-språng och ekvivalenspunkten ligger över pH 7."]], ["Hur kan man bestämma en svag syras pKa med hjälp av en titrerkurva?", ["Läs av volymen vid ekvivalenspunkten, ta hälften av den, och läs av pH vid den volymen (halvtitrerpunkten). Det pH-värdet är lika med pKa."]], ["Hur många ekvivalenspunkter har en titrerkurva för fosforsyra, och varför?", ["Tre i teorin, eftersom H₃PO₄ är treprotonig och avger protonerna en i taget: H₃PO₄ → H₂PO₄⁻ → HPO₄²⁻ → PO₄³⁻. I praktiken syns oftast två tydligt."]]], "mc": [["Vad gäller i halvtitrerpunkten?", ["pH = 7", "pH = pKa", "[HA] = 0", "n(syra) = n(bas)"], 1, "[HA] = [A⁻]."], ["Vilken lösning finns i ekvivalenspunkten när HAc titreras med NaOH?", ["NaCl", "NaAc", "HAc", "NaOH"], 1, "Natriumacetat, som är basisk."], ["Vilken indikator passar vid titrering av ättiksyra med NaOH?", ["Metylorange (3,1–4,4)", "Bromkresolgrönt (3,8–5,4)", "Fenolftalein (8,3–10,0)"], 2, "Ekvivalenspunkten ligger kring pH 9."], ["H₂SO₄ + 2 NaOH → … I vilket förhållande reagerar de?", ["1 : 1", "1 : 2", "2 : 1"], 1, "Svavelsyra är tvåprotonig."], ["Vad är pH i halvtitrerpunkten för ättiksyra (pKa 4,76)?", ["2,9", "4,76", "7,0", "8,7"], 1, "pH = pKa."]], "calc": [{"q": "Uppgift 3:35. 25,0 cm³ H₂SO₄ förbrukade 41,45 cm³ 0,100 mol/dm³ NaOH. Beräkna svavelsyrans koncentration.", "ans": 0.0829, "unit": "mol/dm³", "tol": 0.02, "hints": ["n(NaOH) = c · V = 0,100 · 0,04145", "H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O, så n(H₂SO₄) = n(NaOH) / 2.", "c = n / V med V = 0,0250 dm³"], "sol": ["n(NaOH) = 4,145 · 10⁻³ mol", "n(H₂SO₄) = 2,07 · 10⁻³ mol", "c = 2,07 · 10⁻³ / 0,0250 = 0,0829 mol/dm³"]}, {"q": "Uppgift 3:36a. 25,00 cm³ Ba(OH)₂ titrerades med 0,0103 mol/dm³ HCl. Det gick åt 24,35 cm³. Beräkna bariumhydroxidens koncentration. (Svara t.ex. 5,0e-3.)", "ans": 0.00502, "unit": "mol/dm³", "tol": 0.02, "hints": ["n(HCl) = 0,0103 · 0,02435", "Ba(OH)₂ + 2 HCl → BaCl₂ + 2 H₂O"], "sol": ["n(HCl) = 2,51 · 10⁻⁴ mol → n(Ba(OH)₂) = 1,25 · 10⁻⁴ mol", "c = 1,25 · 10⁻⁴ / 0,02500 = 5,0 · 10⁻³ mol/dm³"]}, {"q": "Uppgift 3:36b. Vilken koncentration har bariumkloridlösningen i ekvivalenspunkten? (Svara t.ex. 2,5e-3.)", "ans": 0.00254, "unit": "mol/dm³", "tol": 0.03, "hints": ["n(BaCl₂) = n(Ba(OH)₂) = 1,25 · 10⁻⁴ mol", "Total volym: 25,00 + 24,35 = 49,35 cm³"], "sol": ["c = 1,254 · 10⁻⁴ / 0,04935 = 2,5 · 10⁻³ mol/dm³"]}, {"q": "0,10 mol/dm³ ättiksyra titreras med lika stor volym 0,10 mol/dm³ NaOH. I ekvivalenspunkten är c(NaAc) = 0,050 mol/dm³. Beräkna pH. Kb(Ac⁻) = 5,7 · 10⁻¹⁰.", "ans": 8.73, "unit": "", "tol": 0.01, "hints": ["Ac⁻ + H₂O ⇄ HAc + OH⁻", "[OH⁻] ≈ √(Kb · c)"], "sol": ["[OH⁻] = 5,3 · 10⁻⁶ → pOH = 5,27 → pH = 8,7"]}, {"q": "Uppgift 3:37 (inringad!). 4,008 g av en blandning av salmiak (NH₄Cl, M = 53,49 g/mol) och koksalt. Ammoniaken leds ner i 100,0 cm³ 0,200 mol/dm³ HCl. Överskottet titreras med 15,8 cm³ 0,100 mol/dm³ NaOH. Beräkna masshalten salmiak i procent.", "ans": 24.6, "unit": "%", "tol": 0.03, "hints": ["Total HCl: 0,200 · 0,1000 = 0,0200 mol. Överskott = n(NaOH) = 0,100 · 0,0158.", "n(NH₃) = n(HCl) som reagerade med ammoniak = n(NH₄Cl).", "m = n · M, masshalt = m / 4,008 · 100 %"], "sol": ["n(HCl) total = 0,0200 mol, överskott 0,00158 mol", "n(NH₄Cl) = 0,0184 mol → m = 0,0184 · 53,49 = 0,985 g", "Masshalt = 0,985 / 4,008 = 24,6 %"]}], "ovn": ["f_titrer", "s_titrerpunkt", "o_titrering"]}, {"id": "p9", "n": 9, "c": "dna", "day": "Torsdag 17/12", "t": "Buffertlösningar och indikatorer", "lasa": [["Kemiboken 2", "s. 70–75", "Buffertverkan, att bereda en buffertlösning, indikatorval, indikatortabellen och kapitlets sammanfattning."]], "gissa": ["Blodets pH ligger alltid nära 7,4, trots att kroppen hela tiden bildar syror. Hur är det möjligt?", "Blodet innehåller buffertar, främst vätekarbonat. En buffert består av en svag syra och dess korresponderande bas: syran tar hand om tillsatt bas och basen tar hand om tillsatt syra."], "guide": ["Vad en buffertlösning är och hur den fungerar.", "Att buffertverkan är störst vid pH = pKa ± 1.", "Hur man väljer syra-baspar för en önskad buffert.", "Vad en indikator är och vad omslagsintervall betyder.", "Hur man väljer indikator till en titrering."], "punkter": [["En buffertlösning innehåller ungefär lika mycket av en svag syra och dess korresponderande bas.", ["buffert"]], ["Syran reagerar med tillsatt OH⁻ och basen med tillsatt H₃O⁺, så pH ändras mycket lite.", ["oh|h3o"]], ["Buffertverkan är störst vid pH = pKa, och fungerar ungefär inom pKa ± 1.", ["pka"]], ["HAc/Ac⁻ buffrar kring 4,8. NH₄⁺/NH₃ kring 9,2. Blodet buffras vid 7,4 av vätekarbonat.", ["4,8|9,2|7,4"]], ["En indikator är en svag syra, HIn, där HIn och In⁻ har olika färg.", ["indikator"]], ["Omslagsintervallet är det pH-område där indikatorn byter färg, ofta 1–2 pH-enheter.", ["omslag"]], ["Välj en indikator vars omslagsintervall ligger i pH-språnget vid ekvivalenspunkten.", ["ekvivalens"]]], "fragor": [["Vad är en buffertlösning och hur fungerar den?", ["En lösning med ungefär lika stora koncentrationer av en svag syra och dess korresponderande bas. Tillsatt OH⁻ reagerar med syran och tillsatt H₃O⁺ reagerar med basen, så pH-värdet ändras mycket lite. Den tål också utspädning."]], ["Uppgift 3:38. a) Vilken sammansättning har en buffert vid det pH där den har störst buffertverkan? b) Inom vilket pH-område är buffertverkan störst?", ["a) Lika stora koncentrationer av syran och den korresponderande basen, [HA] = [A⁻], då är pH = pKa.", "b) Ungefär pKa ± 1."]], ["Föreslå hur man tillverkar en buffert som buffrar bäst kring pH 3,0, och en kring pH 4,8.", ["pH 3,0: välj ett syra-baspar med pKa nära 3, till exempel HF/F⁻ (pKa 3,17), lika stora koncentrationer.", "pH 4,8: ättiksyra och natriumacetat (pKa 4,76) i lika stora koncentrationer."]], ["Vad är en indikator, och varför byter den färg?", ["En svag (oftast organisk) syra, HIn, vars korresponderande bas In⁻ har en annan färg. I sur lösning dominerar HIn (sur färg), i basisk lösning In⁻ (basisk färg)."]], ["Varför måste man ha en annan indikator vid titrering av ättiksyra än vid titrering av saltsyra?", ["Ekvivalenspunkten för ättiksyra + NaOH ligger kring pH 9, inte 7. Indikatorn måste slå om där, till exempel fenolftalein, inte BTB."]], ["Vad är skillnaden mellan halvtitrerpunkten och buffertområdet?", ["Halvtitrerpunkten är den enda punkt där [HA] = [A⁻] och pH = pKa. Buffertområdet är det flacka området runt den punkten, där både HA och A⁻ finns i betydande mängder."]]], "mc": [["Vilket par ger en buffert?", ["HCl och NaCl", "HAc och NaAc", "NaOH och NaCl", "HNO₃ och KNO₃"], 1, "Svag syra + korresponderande bas."], ["Vid vilket pH buffrar NH₄⁺/NH₃ bäst?", ["4,8", "7,0", "9,2", "12,4"], 2, "pKa för NH₄⁺ är 9,24."], ["Fenolftalein har omslagsintervallet 8,3–10,0. Vid vilken titrering passar den?", ["Stark bas titreras med stark syra till pH 4", "Svag syra titreras med stark bas", "Svag bas titreras med stark syra"], 1, "Ekvivalenspunkten ligger då över 7."], ["Vilken indikator slår om nära pH 7?", ["Metylorange", "Bromtymolblått (6,0–7,6)", "Fenolftalein", "Tymolblått (1,2–2,8)"], 1, "BTB."]], "calc": [{"q": "Uppgift 3:30. 150,0 cm³ Ba(OH)₂ med pH 12,30 blandas med 50,0 cm³ saltsyra med pH 1,30. Beräkna pH i blandningen.", "ans": 11.39, "unit": "", "tol": 0.01, "hints": ["Ba(OH)₂: pOH = 1,70 → [OH⁻] = 0,020 → n(OH⁻) = 0,020 · 0,150 = 3,0 · 10⁻³ mol", "HCl: [H₃O⁺] = 10⁻¹'³ = 0,050 → n = 0,050 · 0,050 = 2,5 · 10⁻³ mol", "Överskott OH⁻ i 0,200 dm³ → pOH → pH"], "sol": ["Överskott: 3,0 · 10⁻³ − 2,5 · 10⁻³ = 4,9 · 10⁻⁴ mol OH⁻", "[OH⁻] = 4,9 · 10⁻⁴ / 0,200 = 2,45 · 10⁻³ → pOH = 2,61 → pH = 11,4"]}], "ovn": ["s_buffert", "s_indikator"]}, {"id": "p10", "n": 10, "c": "rep", "day": "Jullovet – valfri dag", "t": "Repetition: hela kapitel 3", "rep": true, "ovn": ["o_jmvber", "s_lechat", "s_salt", "f_titrer", "s_buffert"]}, {"id": "p11", "n": 11, "c": "epi", "day": "Måndag 11/1", "t": "Kap 4: Homogena, heterogena och kopplade jämvikter, löslighet", "lasa": [["Kemiboken 2", "s. 79–86", "Homogena och heterogena jämvikter, totalfosfor och kopplade jämvikter, dagg och dimma, löslighet och vatten som lösningsmedel."]], "gissa": ["Varför är det ofta fuktigt och dimmigt på höstmorgnar efter en varm dag?", "H₂O(l) + värme ⇄ H₂O(g). Den varma luften har tagit upp mycket vattenånga. När det blir kallt på natten förskjuts jämvikten åt vänster och vattnet kondenserar till dagg och dimma."], "guide": ["Skillnaden mellan homogen och heterogen jämvikt.", "Kopplade jämvikter och exemplet totalfosfor och fosfatfällning.", "Jämvikter mellan vätska och gas, fast fas och gas (dagg, rimfrost).", "Vad en lösning, lösningsmedel och löslighet är.", "Vilka salter som brukar vara lättlösliga och svårlösliga, och varför salter löses (energi, entropi)."], "punkter": [["Homogen jämvikt: alla ämnen i samma fas. Heterogen: ämnena i olika faser.", ["homogen", "heterogen"]], ["Kopplade jämvikter: ett ämne ingår samtidigt i två eller flera jämvikter (fosforsyrans protolyssteg).", ["kopplad"]], ["Fe³⁺ + PO₄³⁻ ⇄ FePO₄(s) fäller ut fosfat i reningsverk och sänker totalfosfor.", ["fepo4|fosfat"]], ["H₂O(l) + värme ⇄ H₂O(g): kall luft kan hålla mindre vatten → dagg och dimma.", ["dagg|dimma"]], ["En lösning är en homogen blandning. Det ämne man har mest av är lösningsmedlet.", ["lösningsmedel"]], ["Nitrater, natrium-, kalium- och ammoniumsalter är lättlösliga. Hydroxider, oxider, sulfider och fosfater ofta svårlösliga.", ["lättlöslig|svårlöslig"]], ["Ett salt löses om hydratiseringen frigör tillräckligt med energi, eller om entropin (oordningen) ökar tillräckligt.", ["entropi|hydratis"]]], "fragor": [["Vad är skillnaden mellan en homogen och en heterogen jämvikt? Ge ett exempel på varje.", ["Homogen: alla ämnen i samma fas, t.ex. N₂(g) + 3 H₂(g) ⇄ 2 NH₃(g). Heterogen: ämnena i olika faser, t.ex. CO₂(aq) + värme ⇄ CO₂(g) eller CaCO₃(s) ⇄ Ca²⁺(aq) + CO₃²⁻(aq)."]], ["Vad menas med kopplade jämvikter? Ge ett exempel.", ["Ett eller flera ämnen ingår samtidigt i två eller flera jämvikter. Exempel: fosforsyrans tre protolyssteg och fällningen Fe³⁺ + PO₄³⁻ ⇄ FePO₄(s). När fosfat fälls ut förskjuts protolysstegen så att mer fosfat bildas och fälls."]], ["Varför fungerar fosfatfällningen sämre vid lågt pH?", ["Vid lågt pH finns fosforn mest som H₃PO₄ och H₂PO₄⁻ – det finns nästan inga PO₄³⁻-joner att fälla ut med Fe³⁺."]], ["CO₂(aq) + värme ⇄ CO₂(g). Vad händer med koldioxiden i luften om havets temperatur stiger?", ["Jämvikten förskjuts åt höger (endoterm riktning), så mer koldioxid lämnar havet och halten i luften ökar."]], ["Löser sig vatten bäst i varm eller kall luft, och varför blir det fuktigt på höstmorgnar?", ["I varm luft. På dagen tar den varma luften upp mycket vattenånga. När temperaturen sjunker på natten förskjuts H₂O(l) + värme ⇄ H₂O(g) åt vänster, och vattnet kondenserar till dagg och dimma."]], ["Vilka bindningar bryts och bildas när ett salt löses i vatten?", ["Jonbindningarna i kristallen och vätebindningar mellan vattenmolekylerna bryts. Jon–dipolbindningar bildas mellan jonerna och vattenmolekylerna (hydratisering)."]], ["Hur kan ett salt lösas spontant även om upplösningen är endoterm?", ["Entropin, oordningen, ökar mycket när den ordnade kristallen blir fria joner i lösning. Enligt ΔG = ΔH − TΔS kan ΔG bli negativt trots att ΔH är positivt."]]], "mc": [["CaCO₃(s) ⇄ Ca²⁺(aq) + CO₃²⁻(aq) är en …", ["homogen jämvikt", "heterogen jämvikt", "momentan reaktion", "buffert"], 1, "Fast fas och lösning."], ["Vilket salt är svårlösligt?", ["NaNO₃", "KCl", "Fe(OH)₃", "NH₄Cl"], 2, "Hydroxider är ofta svårlösliga."], ["Vad kallas det ämne det finns mest av i en lösning?", ["Lösningsmedel", "Löst ämne", "Katalysator", "Reaktant"], 0, "Ofta vatten."], ["Vad är totalfosfor?", ["Bara fosfatjoner", "Summan av H₃PO₄, H₂PO₄⁻, HPO₄²⁻ och PO₄³⁻", "Fosfor i luften", "Fosforsyra"], 1, "Alla protolyterna tillsammans."], ["Hur kan tvätt torka ute fast det är minusgrader?", ["Isen smälter", "Isen sublimerar direkt till vattenånga", "Vinden pressar ut vattnet", "Det kan den inte"], 1, "H₂O(s) + värme ⇄ H₂O(g)."]], "calc": [], "ovn": ["s_homhet", "s_loslig"]}, {"id": "p12", "n": 12, "c": "epi", "day": "Tisdag 12/1", "t": "Löslighetsprodukt Ks, fällning och gasers löslighet", "lasa": [["Kemiboken 2", "s. 87–91", "Löslighetsprodukten och tabellen på s. 87, exemplen på s. 89, gasers löslighet och läskflaskan."]], "gissa": ["Bariumjoner är giftiga. Hur kan man få bort nästan alla bariumjoner ur en lösning?", "Tillsätt ett stort överskott av sulfatjoner. Ba²⁺ + SO₄²⁻ ⇄ BaSO₄(s) förskjuts kraftigt åt höger, och eftersom Ks är konstant måste [Ba²⁺] bli mycket liten när [SO₄²⁻] är stor."], "guide": ["Hur man tecknar Ks för ett svårlösligt salt och anger enheten.", "Hur man räknar ut lösligheten från Ks – och Ks från lösligheten.", "Jonprodukten P och regeln för fällning: P > Ks.", "Varför gaser löser sig bättre i kallt vatten.", "Varför polära gaser löser sig bättre än opolära."], "punkter": [["Ks = produkten av jonkoncentrationerna i en mättad lösning, t.ex. Ks = [Ag⁺][Cl⁻]. Fasta ämnen tas inte med.", ["ks|löslighetsprodukt"]], ["Enheten blir (mol/dm³) upphöjt till antalet joner i formeln: Fe(OH)₃ → (mol/dm³)⁴.", ["enhet"]], ["Om lösligheten är s: för AgCl är Ks = s². För Fe(OH)₃ är Ks = s · (3s)³ = 27s⁴.", ["s²|27"]], ["Om P > Ks bildas fällning. P = Ks: mättad lösning. P < Ks: mer kan lösas.", ["fällning"]], ["Ks beror på temperaturen. Salter löses oftast bättre i varmt vatten.", ["temperatur"]], ["Gaser löser sig bättre i kallt vatten: O₂(aq) + värme ⇄ O₂(g).", ["gas", "kallt"]], ["Polära gaser (NH₃, SO₂) löser sig mycket bättre än opolära (O₂, N₂).", ["polär"]]], "fragor": [["Teckna löslighetsprodukten för kalciumkarbonat och ange enheten.", ["CaCO₃(s) ⇄ Ca²⁺ + CO₃²⁻, Ks = [Ca²⁺][CO₃²⁻], enhet (mol/dm³)²."]], ["Vilken enhet har Ks för a) NaCl, b) Na₂SO₄, c) Al(OH)₃?", ["a) (mol/dm³)² b) (mol/dm³)³ c) (mol/dm³)⁴"]], ["Hur avgör man om det bildas en fällning när två lösningar blandas?", ["Räkna ut jonernas koncentrationer i blandningen (glöm inte utspädningen) och jonprodukten P på samma sätt som Ks. Om P > Ks bildas fällning."]], ["Varför löser sig gaser sämre i varmt vatten än i kallt?", ["Upplösningen av gas är exoterm, så gas + vatten ⇄ löst gas + värme. Uppvärmning förskjuter jämvikten mot gasfasen. Molekylerna har också högre energi och lämnar vattnet lättare."]], ["Varför pyser en varm läsk mer än en kall när man öppnar den?", ["När flaskan öppnas sjunker trycket av CO₂ ovanför vätskan och jämvikten förskjuts mot gas. Vid högre temperatur ligger jämvikten ännu mer mot gasfasen, så mer CO₂ avgår."]], ["Varför löser sig polära gaser mycket bättre i vatten än opolära?", ["Polära molekyler kan bilda dipol–dipolbindningar eller vätebindningar med vattenmolekylerna. Opolära molekyler kan bara bilda svaga van der Waals-bindningar."]]], "mc": [["Vilket uttryck är Ks för Fe(OH)₃?", ["[Fe³⁺][OH⁻]", "[Fe³⁺][OH⁻]³", "[Fe³⁺]³[OH⁻]", "[Fe(OH)₃]"], 1, "Koefficienten 3 blir exponent."], ["P > Ks betyder att …", ["lösningen inte är mättad", "lösningen är precis mättad", "det bildas fällning", "saltet är lättlösligt"], 2, "Jonprodukten är för stor."], ["Vilken gas löser sig bäst i vatten (tabellen s. 90)?", ["Kväve", "Syre", "Koldioxid", "Svaveldioxid"], 3, "SO₂ är polär: 23 g/100 cm³."], ["Hur fäller man ut så mycket Ba²⁺ som möjligt?", ["Tillsätt vatten", "Tillsätt stort överskott av sulfatjoner", "Värm lösningen", "Tillsätt Ba²⁺"], 1, "Jämvikten förskjuts mot BaSO₄(s)."]], "calc": [{"q": "Uppgift 4:6. Ks(CaCO₃) = 5,0 · 10⁻⁹ (mol/dm³)². Beräkna lösligheten i mol/dm³. (Svara t.ex. 7,1e-5.)", "ans": 7.07e-05, "unit": "mol/dm³", "tol": 0.03, "hints": ["Sätt lösligheten till s. Då är [Ca²⁺] = [CO₃²⁻] = s.", "Ks = s², alltså s = √Ks"], "sol": ["s = √(5,0 · 10⁻⁹) = 7,1 · 10⁻⁵ mol/dm³"]}, {"q": "Samma kalciumkarbonat: beräkna lösligheten i g/dm³. M(CaCO₃) = 100,1 g/mol. (Svara t.ex. 7,1e-3.)", "ans": 0.00708, "unit": "g/dm³", "tol": 0.03, "hints": ["m = n · M per dm³"], "sol": ["7,1 · 10⁻⁵ · 100,1 = 7,1 · 10⁻³ g/dm³"]}, {"q": "Ks(Fe(OH)₃) = 8,0 · 10⁻⁴⁰ (mol/dm³)⁴. Beräkna lösligheten i mol/dm³ i rent vatten. (Svara t.ex. 7,4e-11.)", "ans": 7.38e-11, "unit": "mol/dm³", "tol": 0.04, "hints": ["Fe(OH)₃ ⇄ Fe³⁺ + 3 OH⁻. Om s mol löses blir [Fe³⁺] = s och [OH⁻] = 3s.", "Ks = s · (3s)³ = 27s⁴", "s = (Ks / 27)^(1/4)"], "sol": ["s = (8,0 · 10⁻⁴⁰ / 27)^0,25 = 7,4 · 10⁻¹¹ mol/dm³"]}, {"q": "Lösligheten för BaSO₄ är 1,0 · 10⁻⁵ mol/dm³. Beräkna Ks. (Svara t.ex. 1,0e-10.)", "ans": 1e-10, "unit": "(mol/dm³)²", "tol": 0.03, "hints": ["Ks = [Ba²⁺][SO₄²⁻] = s · s"], "sol": ["Ks = (1,0 · 10⁻⁵)² = 1,0 · 10⁻¹⁰"]}, {"q": "Lika volymer 2,0 · 10⁻⁴ mol/dm³ AgNO₃ och 2,0 · 10⁻⁴ mol/dm³ NaCl blandas. Beräkna jonprodukten P = [Ag⁺][Cl⁻]. Bildas fällning om Ks(AgCl) = 2,0 · 10⁻¹⁰? (Svara med P, t.ex. 1,0e-8.)", "ans": 1e-08, "unit": "(mol/dm³)²", "tol": 0.03, "hints": ["Volymen fördubblas, så varje koncentration halveras till 1,0 · 10⁻⁴.", "P = [Ag⁺][Cl⁻]. Jämför med Ks."], "sol": ["P = (1,0 · 10⁻⁴)² = 1,0 · 10⁻⁸ > 2,0 · 10⁻¹⁰ → fällning bildas"]}], "ovn": ["s_fallning", "o_ks"]}, {"id": "p13", "n": 13, "c": "epi", "day": "Torsdag 14/1", "t": "Fördelningsjämvikt, miljögifter och Gibbs fria energi", "lasa": [["Kemiboken 2", "s. 91–93", "Bioackumulering och Kow, ämnen i jämvikt mellan två flytande faser, extraktion och KD."], ["Lärarens instuderingsfrågor", "Lektion 14–17", "Gibbs fria energi: ΔG = ΔH − TΔS, och laborationen om KD med jodometrisk titrering."]], "gissa": ["Varför samlas många miljögifter i fettvävnad hos djur – och i bröstmjölk?", "Miljögifter är ofta opolära och löser sig mycket bättre i fett än i vatten. De fördelar sig mellan vatten och fett i en fördelningsjämvikt med stort KD, så halten i fettet blir hög."], "guide": ["Fördelningsjämvikt och fördelningskonstanten KD.", "Extraktion med jod i vatten och heptan.", "Kow och bioackumulering.", "Entalpi, entropi och Gibbs fria energi: när är en reaktion spontan?"], "punkter": [["Fördelningsjämvikt: ett ämne fördelar sig mellan två vätskefaser som inte blandas, t.ex. I₂(vatten) ⇄ I₂(heptan).", ["fördelning"]], ["KD = [I₂(heptan)] / [I₂(vatten)]. Jod löser sig bättre i heptan, så KD > 1.", ["kd"]], ["Extraktion: man drar ut ett ämne med hjälp av ett lösningsmedel. Flera små extraktioner är effektivare än en stor.", ["extrakt"]], ["Opolära miljögifter har högt Kow och lagras i fettvävnad (bioackumulering).", ["kow|bioackumul|fett"]], ["ΔG = ΔH − TΔS. En reaktion är spontan om ΔG < 0.", ["gibbs|δg|spontan"]], ["Entropi, S, är ett mått på oordning. Den ökar när ett fast ämne löses.", ["entropi"]]], "fragor": [["Teckna KD för jodets fördelning mellan vatten och heptan. Vad kan du säga om värdet?", ["KD = [I₂(heptan)] / [I₂(vatten)]. Jod är opolärt och löser sig mycket bättre i opolär heptan, så KD är mycket större än 1."]], ["Varför blir vattenlösningen av jod ljusare för varje ny portion heptan man skakar med?", ["Jodet fördelar sig mellan faserna enligt KD varje gång. När heptanfasen tas bort och ny tillsätts ställer sig en ny jämvikt och mer jod flyttar över, så koncentrationen i vattnet minskar steg för steg."]], ["Varför lagras många miljögifter i fettvävnad?", ["De är opolära och löser sig bättre i fett än i vatten (högt Kow). De utsöndras därför dåligt med urinen och anrikas i fettvävnad och bröstmjölk."]], ["Vad driver en kemisk reaktion? Förklara med Gibbs fria energi.", ["Två saker: att energin minskar (ΔH < 0) och att oordningen ökar (ΔS > 0). De vägs ihop i ΔG = ΔH − TΔS. Är ΔG < 0 sker reaktionen spontant."]], ["Hur kan en endoterm reaktion ske spontant?", ["Om entropin ökar tillräckligt mycket och temperaturen är tillräckligt hög blir TΔS större än ΔH, och ΔG blir negativt."]], ["Vilka bindningar är totalt sett starkast i en exoterm reaktion – de som bryts eller de som bildas?", ["De som bildas. Mer energi frigörs när de nya bindningarna bildas än vad som krävs för att bryta de gamla."]]], "mc": [["Jod fördelas mellan vatten och heptan. Var hamnar mest jod?", ["I vattnet", "I heptanet", "Lika mycket", "Jod löses inte"], 1, "Opolärt löser opolärt."], ["När är en reaktion spontan?", ["ΔH > 0", "ΔG < 0", "ΔS < 0", "ΔG > 0"], 1, "Gibbs fria energi minskar."], ["Vad händer med entropin när ett salt löses i vatten?", ["Ökar", "Minskar", "Oförändrad"], 0, "Mer oordning."], ["Ett ämne har lg Kow = 5. Vad betyder det?", ["Löser sig bra i vatten", "Bioackumuleras lätt i fett", "Är en stark syra", "Är en gas"], 1, "lg Kow ≥ 3 räknas som bioackumulerbart."]], "calc": [{"q": "Efter skakning är [I₂] = 0,0050 mol/dm³ i heptan och 0,00012 mol/dm³ i vatten. Beräkna KD.", "ans": 41.7, "unit": "", "tol": 0.03, "hints": ["KD = [I₂(heptan)] / [I₂(vatten)]"], "sol": ["KD = 0,0050 / 0,00012 = 42"]}, {"q": "En reaktion har ΔH = +25 kJ och ΔS = +0,10 kJ/K vid T = 298 K. Beräkna ΔG. Är reaktionen spontan?", "ans": -4.8, "unit": "kJ", "tol": 0.03, "hints": ["ΔG = ΔH − T · ΔS", "Temperaturen ska vara i kelvin."], "sol": ["ΔG = 25 − 298 · 0,10 = 25 − 29,8 = −4,8 kJ → ΔG < 0, spontan"]}], "ovn": ["s_gibbs", "s_polar"]}, {"id": "p14", "n": 14, "c": "epi", "day": "Fredag 15/1", "t": "Jämvikter i mark, hav, berggrund, industri och kropp", "lasa": [["Kemiboken 2", "s. 94–106", "Jämvikter i mark (surt regn, urlakning), i haven, i berggrunden (hårt vatten), i industrin (bränd kalk, ammoniak), i kroppen (buffertar, hemoglobin, karies), sammanfattningen och uppgifterna 4:1–4:13."]], "gissa": ["Varför blir haven surare när det blir mer koldioxid i luften?", "CO₂(g) ⇄ CO₂(aq), CO₂ + H₂O ⇄ H₂CO₃ och H₂CO₃ + H₂O ⇄ H₃O⁺ + HCO₃⁻ är kopplade jämvikter. Mer CO₂ i luften förskjuter alla åt höger, och det bildas fler oxoniumjoner – pH sjunker."], "guide": ["Surt regn, urlakning och varför kalkhaltig mark klarar försurning bättre.", "Havets kolsyrajämvikter och havsförsurningen.", "Hårt vatten och pannsten.", "Bränd kalk och Haber-Bosch i industrin.", "Buffertar i blodet, hemoglobinets syretransport och karies."], "punkter": [["Surt regn: 2 SO₂ + O₂ + 2 H₂O → 2 H₂SO₄ och 4 NO₂ + O₂ + 2 H₂O → 4 HNO₃.", ["surt regn|svavelsyra|salpetersyra"]], ["H₃O⁺ byter plats med närsalter (Na⁺, K⁺, Ca²⁺, Mg²⁺) och metalljoner (Al³⁺) på markpartiklar → urlakning.", ["urlak"]], ["Kalkhaltig mark buffrar (vätekarbonat/karbonat) och tål försurning bättre än morän.", ["kalk", "buffert"]], ["Havets pH har sjunkit ca 0,1 sedan 1700-talet, ungefär 25 % fler H₃O⁺. Skal av CaCO₃ löses lättare.", ["hav|0,1"]], ["Hårt vatten innehåller Ca²⁺ och Mg²⁺. Vid uppvärmning fälls CaCO₃ ut som pannsten.", ["hårt|pannsten"]], ["CaCO₃(s) ⇄ CaO(s) + CO₂(g), ΔH = +556 kJ, K = [CO₂]. Bränd kalk tillverkas vid hög temperatur.", ["bränd kalk|cao"]], ["Blodets pH (7,4) hålls stabilt av buffertar, främst vätekarbonat. HHb + O₂ + H₂O ⇄ HbO₂⁻ + H₃O⁺ styr syretransporten.", ["blod|hemoglobin"]], ["Karies: tandemaljen (hydroxiapatit) löses vid lågt pH. Fluor ger tåligare fluorapatit.", ["karies|apatit"]]], "fragor": [["Varför urlakas marken på närsalter när pH sjunker?", ["Markpartiklarna är negativt laddade och binder positiva joner. När [H₃O⁺] ökar förskjuts jämvikterna så att oxoniumjoner byter plats med Na⁺, K⁺, Ca²⁺ och Mg²⁺, som sköljs bort med vattnet. Även aluminium- och järnjoner frigörs."]], ["Skriv reaktionsformlerna för hur surt regn bildas av svaveldioxid och av kvävedioxid.", ["2 SO₂ + O₂ + 2 H₂O → 2 H₂SO₄", "4 NO₂ + O₂ + 2 H₂O → 4 HNO₃"]], ["Beskriv med jämvikter hur ökad koldioxid i luften gör haven surare, och varför det är ett problem.", ["CO₂(g) ⇄ CO₂(aq); CO₂(aq) + H₂O ⇄ H₂CO₃; H₂CO₃ + H₂O ⇄ H₃O⁺ + HCO₃⁻. Mer CO₂ förskjuter alla åt höger och [H₃O⁺] ökar. Skaldjur, koraller och plankton med kalkskal får svårare att bygga skal, eftersom CaCO₃ löses vid lågt pH."]], ["Uppgift 3:27. Skriv formel för neutralisationen av H₃O⁺ när man kalkar med a) släckt kalk, b) kalksten.", ["a) Ca(OH)₂ + 2 H₃O⁺ → Ca²⁺ + 4 H₂O", "b) CaCO₃ + 2 H₃O⁺ → Ca²⁺ + CO₂ + 3 H₂O"]], ["Varför bildas pannsten i en vattenkokare?", ["Ca²⁺ + 2 HCO₃⁻ ⇄ CaCO₃(s) + H₂O + CO₂(g). Vid uppvärmning avgår koldioxid, jämvikten förskjuts åt höger och CaCO₃ fälls ut."]], ["Hur gynnas tillverkningen av bränd kalk, CaCO₃(s) ⇄ CaO(s) + CO₂(g), ΔH = +556 kJ?", ["Hög temperatur (endoterm riktning åt höger) och lågt tryck. I praktiken låter man koldioxiden avgå, så att jämvikten hela tiden förskjuts åt höger."]], ["Förklara hur hemoglobinet tar upp syre i lungorna och lämnar det i musklerna.", ["HHb + O₂ + H₂O ⇄ HbO₂⁻ + H₃O⁺. I lungorna avgår CO₂, [H₃O⁺] sjunker och jämvikten förskjuts åt höger: syre binds. I musklerna bildas CO₂ i cellandningen, pH sjunker och jämvikten förskjuts åt vänster: syre frigörs."]], ["Varför skyddar fluor mot karies?", ["Hydroxiapatit, Ca₅(PO₄)₃OH, löses vid lågt pH. Med fluor byts OH⁻ mot F⁻ och det bildas fluorapatit, som tål syror bättre."]]], "mc": [["Vilken gas orsakar främst försurning i dag?", ["Svaveldioxid", "Kväveoxider från förbränning", "Syre", "Metan"], 1, "Svavel tas numera bort ur bränslena."], ["Havets pH har sjunkit 0,1 enheter. Hur mycket har [H₃O⁺] ökat?", ["1 %", "10 %", "Ca 25 %", "100 %"], 2, "10⁰'¹ ≈ 1,26."], ["Vad orsakar vattnets hårdhet?", ["Na⁺ och K⁺", "Ca²⁺ och Mg²⁺", "Cl⁻", "H₃O⁺"], 1, "Från kalkhaltig berggrund."], ["Vad är K för CaCO₃(s) ⇄ CaO(s) + CO₂(g)?", ["[CaO][CO₂]/[CaCO₃]", "[CO₂]", "[CaCO₃]", "1/[CO₂]"], 1, "Fasta ämnen tas inte med."], ["Var släpper hemoglobinet syret?", ["Där pH är högt", "Där pH är lågt (i musklerna)", "I lungorna", "I magen"], 1, "H₃O⁺ förskjuter jämvikten åt vänster."]], "calc": [{"q": "Havets pH har sjunkit med 0,10 enheter. Hur många gånger större är [H₃O⁺] nu? (Svara som decimaltal.)", "ans": 1.26, "unit": "gånger", "tol": 0.02, "hints": ["[H₃O⁺] = 10^(−pH)", "Kvoten blir 10^0,10."], "sol": ["10⁰'¹⁰ = 1,26 → ca 26 % fler oxoniumjoner"]}], "ovn": ["s_miljo", "s_homhet"]}, {"id": "p15", "n": 15, "c": "rep", "day": "Måndag 18/1", "t": "Repetition: räkna, räkna, räkna", "rep": true, "ovn": ["o_jmvber", "o_phsvag", "o_ks", "o_tabell"]}, {"id": "p16", "n": 16, "c": "rep", "day": "Tisdag 19/1", "t": "Repetition: begrepp, laborationer och titrerkurvor", "rep": true, "ovn": ["f_titrer", "f_energi", "s_titrerpunkt", "s_indikator", "s_lechat"]}, {"id": "p17", "n": 17, "c": "rep", "day": "Måndag 25/1", "t": "Provträning 1", "rep": true, "ovn": ["s_salt", "s_fallning", "s_kq"]}, {"id": "p18", "n": 18, "c": "rep", "day": "Tisdag 26/1", "t": "Provträning 2 – dagen före provet", "rep": true, "ovn": ["s_buffert", "s_miljo", "o_titrering"]}], "ORDER": {"o_tabell": ["Så löser du en stökiometriuppgift", "gte", "Börja med det första du skriver.", ["Skriv en balanserad reaktionsformel", "Räkna om givna värden till substansmängd (n = m/M eller n = c · V)", "Använd substansmängdsförhållandet från koefficienterna", "Räkna ut den sökta substansmängden", "Räkna om till det som efterfrågas (massa, koncentration …)", "Kontrollera enhet och rimlighet"]], "o_jmvber": ["Så räknar du koncentrationer vid jämvikt", "del", "Börja med det första steget i bokens mall.", ["Skriv reaktionsformeln", "Gör en tabell: substansmängd före", "Fyll i förändringen med x enligt koefficienterna", "Skriv substansmängderna vid jämvikt", "Dela med volymen för att få koncentrationer", "Sätt in i jämviktsekvationen", "Lös ekvationen", "Förkasta orimliga x-värden och svara"]], "o_phsvag": ["Så räknar du pH i en svag syra", "arv", "Börja med att skriva protolysformeln.", ["Skriv HA + H₂O ⇄ H₃O⁺ + A⁻", "Ställ upp tabellen: c före, c − x vid jämvikt för HA, x för H₃O⁺ och A⁻", "Skriv Ka = x² / (c − x)", "Lös ut x (eller anta c − x ≈ c om syran är svag)", "x = [H₃O⁺]", "pH = −lg x"]], "o_titrering": ["Så går en titrering till", "dna", "Börja med förberedelserna.", ["Pipettera en känd volym av lösningen med okänd koncentration till en titrerkolv", "Tillsätt några droppar indikator", "Fyll byretten med lösningen med känd koncentration", "Droppa ner lösningen under omrörning", "Sluta när indikatorn just slår om – ekvivalenspunkten", "Läs av den förbrukade volymen", "Räkna ut den okända koncentrationen med n = c · V och reaktionsformeln"]], "o_ks": ["Så räknar du löslighet från Ks", "epi", "Börja med jämviktsformeln.", ["Skriv upplösningen, t.ex. Fe(OH)₃(s) ⇄ Fe³⁺ + 3 OH⁻", "Teckna Ks = [Fe³⁺][OH⁻]³", "Sätt lösligheten ti     else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};

function weight(id, unseenW) {
  const r = S.q[id];
  if (!r) return unseenW;
  const days = (Date.now() - (r.at || 0)) / 864e5;
  return [0.6 + Math.min(days, 10) * 0.15, 3, 5][r.s];
}
function pickWeighted(ids, n, unseenW) {
  const pool = ids.map(id => ({ id, w: weight(id, unseenW) * (0.6 + Math.random() * 0.8) }));
  pool.sort((a, b) => b.w - a.w);
  return pool.slice(0, n).map(x => x.id);
}

/* ===================== Drag-hjälp ===================== */
function dragChip(c, selector, onDrop, onTap) {
  let sx, sy, ghost = null, moved = false;
  c.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; moved = false; try { c.setPointerCapture(e.pointerId); } catch (_) {} });
  c.addEventListener('pointermove', e => {
    if (sx === undefined) return;
    if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) { ghost = c.cloneNode(true); ghost.classList.add('ghost', 'sel'); document.body.appendChild(ghost); moved = true; }
    if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
  });
  c.addEventListener('pointerup', e => { if (ghost) { const t = document.elementFromPoint(e.clientX, e.clientY); const z = t && t.closest(selector); ghost.remove(); ghost = null; if (z) onDrop(c, z); } sx = undefined; });
  c.addEventListener('pointercancel', () => { if (ghost) { ghost.remove(); ghost = null; } sx = undefined; });
  c.addEventListener('click', () => { if (moved) { moved = false; return; } onTap(c); });
}
