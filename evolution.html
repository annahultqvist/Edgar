<script>
const D={"PASSES": [{"id": "p1", "n": 1, "c": "his", "day": "Måndag 23/11", "t": "Darwin, anpassning och variation", "lasa": [["Biologi Campus", "s. 7–11", "Kapitlets början, faktarutan om Darwin och avsnittet om anpassningar och variation."]], "gissa": ["En isbjörn är vit och en kaktus har taggar. Hur har de fått sina egenskaper – har någon designat dem, eller har de ”försökt” bli så?", "Ingetdera. Individer skiljer sig lite åt, och de som råkar ha egenskaper som passar miljön överlever oftare och får fler ungar. Om egenskapen är ärftlig blir den vanligare för varje generation. Det kallas naturligt urval."], "guide": ["Vilka två frågor Darwins teori gav svar på.", "Vem Darwin var: Beagle, Galapagos och boken från 1859.", "Vad en anpassning är, och hur man förklarade anpassningar före Darwin.", "Vad variation är och varför den leder till konkurrens."], "punkter": [["Arter har uppkommit, utvecklats och oftast dött ut under miljontals år – det kallas evolution.", ["evolution"]], ["Darwin presenterade 1859 teorin om evolution genom naturligt urval.", ["darwin|1859"]], ["Teorin förklarar hur organismerna fått sina egenskaper och hur nya arter uppkommer.", ["egenskap|arter uppkommer|nya arter"]], ["Darwin reste med Beagle och såg att arterna på Galapagosöarna var släkt med varandra och med arter på fastlandet.", ["beagle|galapagos"]], ["En anpassning är en egenskap med en tydlig funktion som formats av det naturliga urvalet.", ["anpassning"]], ["Före Darwin trodde många på en intelligent skapare eller inre drivkrafter.", ["skapare|drivkraft"]], ["Variation: individer inom en art skiljer sig åt. Fler föds än resurserna räcker till, och då uppstår konkurrens.", ["variation", "konkurrens"]]], "fragor": [["Vilka två stora frågor besvarade Darwins teori?", ["1. Hur organismerna har fått sina egenskaper.", "2. Hur nya arter har uppkommit.", "Svaret på båda var: genom naturligt urval."]], ["Vad är en anpassning? Ge två exempel.", ["En egenskap som har en tydlig funktion och som gör att organismen fungerar bra i sin miljö. Den har formats successivt av det naturliga urvalet. Exempel: isbjörnens vita päls (kamouflage i snön) och kaktusens taggar (skydd mot djur)."]], ["Hur förklarade man anpassningar innan Darwin?", ["En del menade att organismerna var utformade av en intelligent skapare (som en klocka måste ha en urmakare). Andra trodde att organismerna hade inre drivkrafter som gjorde att de utvecklades mot mer avancerade former."]], ["Vad menas med variation, och varför är den viktig för naturligt urval?", ["Variation betyder att individerna inom en art skiljer sig åt, till exempel i färg, storlek eller förmåga att tåla kyla. Utan variation finns inget att välja mellan, och då kan det naturliga urvalet inte göra något."]], ["Varför uppstår konkurrens mellan individer?", ["Det föds fler individer än det finns resurser (mat, boplatser, partner) till. Då måste individerna konkurrera, och de med bäst egenskaper för miljön klarar sig bäst."]], ["Vad hade Darwins resa med Beagle för betydelse för hans teori?", ["Under resan samlade han djur, växter och stenar och skrev dagbok. På Galapagosöarna såg han att arterna var nära släkt med varandra och med arter på det sydamerikanska fastlandet. Han drog slutsatsen att de utvecklats från gemensamma förfäder som kommit till öarna."]], ["Vem var Alfred Russel Wallace?", ["En yngre naturforskare som kom fram till en liknande teori som Darwin. Det fick Darwin att till slut publicera sin bok ”Om arternas uppkomst” 1859."]], ["Varför förklarar evolutionsteorin dagens biologi bättre än Darwins ursprungliga teori?", ["Dagens evolutionsteori bygger på Darwins teori men har förfinats med kunskap från bland annat genetik och ekologi. Den är grunden för all biologi."]]], "mc": [["Vilket år publicerade Darwin sin bok om arternas uppkomst?", ["1759", "1809", "1859", "1959"], 2, "1859, när Darwin var 50 år."], ["Vad är ett fossil?", ["Ett levande djur från förr", "En förstenad lämning eller ett avtryck av en organism", "En sorts sten utan liv", "En sorts gen"], 1, "Fossil gör att vi kan spåra arternas historia."], ["Vad är en anpassning?", ["En egenskap som individen lär sig under livet", "En ändamålsenlig egenskap som formats av det naturliga urvalet", "En mutation", "En egenskap som alla arter har"], 1, "Anpassningar formas successivt av urvalet."], ["Var såg Darwin de närbesläktade arterna som fick honom att börja fundera?", ["Hawaii", "Galapagosöarna", "Island", "Madagaskar"], 1, "Arterna på Galapagos liknade varandra och arter på fastlandet."], ["Vad krävs för att det naturliga urvalet ska kunna ändra en art?", ["Att alla individer är lika", "Att det finns ärftlig variation", "Att miljön aldrig ändras", "Att individerna vill förändras"], 1, "Utan ärftlig variation har urvalet inget att arbeta med."]], "ovn": ["o_urval", "s_forr"]}, {"id": "p2", "n": 2, "c": "his", "day": "Tisdag 24/11", "t": "Naturligt urval och konvergent evolution", "lasa": [["Biologi Campus", "s. 12–15", "Flugblomster, biotiska och abiotiska faktorer, kaktus och törelväxt, konvergent evolution och faktarutan om ekolokalisering."]], "gissa": ["En kaktus i Amerika och en törelväxt i Afrika ser nästan likadana ut: inga blad, tjock stam och taggar. Är de nära släkt?", "Nej! De är bara avlägset släkt. Men båda lever i torra öknar, och samma miljö har drivit fram liknande anpassningar. Det kallas konvergent evolution."], "guide": ["Hur flugblomstret lurar stekelhanar – och varför det är naturligt urval.", "Skillnaden mellan biotiska och abiotiska faktorer, med exempel.", "Varför kaktusar saknar blad och har tjocka stammar.", "Vad konvergent evolution är, och exemplet med ögon."], "punkter": [["Naturligt urval sker när organismer växelverkar med sin miljö.", ["miljö|växelverk"]], ["Biotiska faktorer är levande, som rovdjur, växter och bakterier. Abiotiska faktorer är icke-levande, som temperatur, vatten och ljus.", ["biotisk", "abiotisk"]], ["Flugblomstret liknar en stekelhona. Blommor som liknar honor mest får pollen spritt oftast, så de blir mer och mer lika.", ["flugblomster|stekel"]], ["Andra organismer, som stekelhanar och bytesdjur, fungerar som ”verktyg” för det naturliga urvalet.", ["verktyg|andra organismer"]], ["Kaktusar och törelväxter saknar blad och har tjocka stammar som anpassning till torka: liten yta i förhållande till volymen.", ["torka|yta"]], ["Konvergent evolution: olika organismgrupper får liknande anpassningar oberoende av varandra eftersom miljön driver dem åt samma håll.", ["konvergent"]], ["Ögon har uppstått 40–65 gånger. Bläckfiskens och vårt öga är likartade men byggda olika – bläckfisken har ingen blinda fläck.", ["öga|ögon|bläckfisk"]]], "fragor": [["Förklara hur flugblomstrets insektslika blommor har uppkommit genom naturligt urval.", ["Blommorna varierar lite i utseende, och en del av variationen är ärftlig. Stekelhanar försöker para sig med de blommor som mest liknar honor och sprider då deras pollen. De blommorna får fler ättlingar, så för varje generation blir blommorna mer och mer lika stekelhonor."]], ["Vad är skillnaden mellan biotiska och abiotiska faktorer? Ge två exempel på varje.", ["Biotiska faktorer är levande delar av miljön, till exempel rovdjur och konkurrenter. Abiotiska faktorer är icke-levande, till exempel temperatur och vattentillgång."]], ["Varför är kaktusens tjocka stam och avsaknad av blad en anpassning till torka?", ["Ett platt blad har stor yta i förhållande till sin volym, och genom ytan avdunstar vatten. Utan blad och med en tjock stam blir ytan liten i förhållande till volymen, så vattnet avdunstar långsamt. Stammen kan dessutom lagra mycket vatten."]], ["Vad är konvergent evolution? Förklara med ett exempel.", ["Att organismgrupper som inte är nära släkt utvecklar liknande anpassningar oberoende av varandra, eftersom samma miljöfaktor driver dem i samma riktning. Exempel: kaktusar i Amerika och törelväxter i Afrika har båda tjocka stammar och inga blad som anpassning till torka."]], ["Varför blir två konvergenta anpassningar aldrig exakt likadana?", ["Evolutionen börjar från olika utgångspunkter hos olika grupper. Bläckfiskens och ryggradsdjurens ögon fungerar likt, men näthinnan är vänd åt olika håll. Därför har vi en blinda fläck, men inte bläckfisken."]], ["Hur har fladdermössens ekolokalisering kunnat utvecklas?", ["Fladdermöss skickar ut ljudpulser och lyssnar efter ekot. Det finns ärftlig variation i till exempel pulserna, öronens form och hjärnans förmåga. De som hittar mer mat överlever och får fler ungar, så ekolokaliseringen blir bättre för varje generation. Den började troligen med celler som redan var känsliga för ljud."]], ["Varför blir harens hörsel och bytesdjurens flyktförmåga bättre över tid?", ["Rovdjur fångar oftast de individer som hör eller springer sämst. De som har bättre hörsel överlever oftare och får ungar. Samtidigt pressas rovdjuren att bli bättre jägare. Arterna driver alltså varandras evolution."]]], "mc": [["Vilken är en abiotisk faktor?", ["Rovdjur", "Temperatur", "Konkurrenter", "Bakterier i magen"], 1, "Abiotisk = icke-levande."], ["Kaktusar och törelväxter ser lika ut. Vad kallas det?", ["Sexuell selektion", "Konvergent evolution", "Genetisk drift", "Artbildning"], 1, "Liknande miljö, liknande anpassningar, utan nära släktskap."], ["Ungefär hur många gånger tror man att ögon har uppstått?", ["En gång", "3–5 gånger", "40–65 gånger", "Över 1 000 gånger"], 2, "Ögon är ett klassiskt exempel på konvergent evolution."], ["Vem fungerar som ”verktyg” för det naturliga urvalet hos flugblomstret?", ["Vinden", "Stekelhanarna", "Bin", "Människan"], 1, "Stekelhanarna sprider pollen från de mest honlika blommorna."], ["Varför har vi människor en blinda fläck, men inte bläckfiskar?", ["Vi har fler ljuskänsliga celler", "Våra ljuskänsliga celler är vända bort från linsen, så nervtrådarna måste gå ut genom näthinnan", "Bläckfiskar har ingen näthinna", "Bläckfiskar ser sämre"], 1, "Synnerven går ut genom näthinnan och där finns inga ljuskänsliga celler."]], "ovn": ["s_bioabio", "o_urval"]}, {"id": "p3", "n": 3, "c": "his", "day": "Torsdag 26/11", "t": "Selektionstryck – fallet påfågelöga", "lasa": [["Biologi Campus", "s. 16–19", "Påfågelögats vingar, kamouflage, ögonfläckar, flera selektionstryck och experimentet ”Hur vet vi…”."]], "gissa": ["Fjärilen påfågelöga har bruna, tråkiga undersidor men färggranna ovansidor med stora ögonfläckar. Varför har den båda?", "Olika fiender och problem ger olika selektionstryck. Den bruna undersidan gör fjärilen svår att se (kamouflage). Ögonfläckarna skrämmer fåglar som kommer nära. Mörka vingar tar dessutom upp solvärme på kalla vårdagar."], "guide": ["Vad ett selektionstryck är.", "Vad kamouflage är, och exemplet med tallgräsfjärilen.", "Hur ögonfläckarna hjälper fjärilen.", "Att en egenskap kan påverkas av flera selektionstryck.", "Hur experimentet med blåmesarna gick till och vad det visade."], "punkter": [["Ett selektionstryck är något i miljön som gör att det naturliga urvalet driver en egenskap i en viss riktning.", ["selektionstryck"]], ["Kamouflage är anpassningar som gör att djuret smälter in i omgivningen. Påfågelögats bruna undersida liknar ett dött blad.", ["kamouflage"]], ["Ögonfläckar påminner om rovfågelögon och skrämmer eller förvirrar fåglar. Attacker riktas mot fläckarna, så fjärilen kan klara sig med ett jack i vingen.", ["ögonfläck"]], ["En egenskap kan utsättas för flera selektionstryck: fåglar på avstånd, fåglar nära, partnerval och kyla.", ["flera"]], ["Mörka vingundersidor tar upp solvärme, vilket hjälper påfågelögat att flyga redan i mars.", ["värme|mars|kyla"]], ["I experimentet blev 3 % av fjärilarna med ögonfläckar tagna av blåmesar, men 35 % av de utan.", ["3 %|35 %|blåmes"]], ["Det väsande ljudet hade ingen effekt. Det är en bieffekt och ingen anpassning.", ["bieffekt|ljud"]]], "fragor": [["Vad är ett selektionstryck? Ge ett exempel.", ["Något i miljön som gör att det naturliga urvalet gynnar en egenskap i en viss riktning. Exempel: fåglar som jagar fjärilar ger ett selektionstryck för kamouflerade vingundersidor."]], ["Vad är kamouflage? Ge två exempel från texten.", ["Anpassningar som gör att ett djur smälter in i omgivningen. Påfågelögats bruna vingundersida ser ut som ett dött blad. Tallgräsfjärilen lutar sig mot tallstammen så att skuggan inte avslöjar den."]], ["Hur kan ögonfläckar på vingarna hjälpa påfågelögat?", ["Ögonfläckarna liknar ögonen hos en rovfågel och kan skrämma eller förvirra en fågel. Fjärilen hinner då fly. Om fågeln ändå anfaller riktar den ofta attacken mot fläckarna, och fjärilen kommer undan med bara ett jack i vingen."]], ["Ge tre olika selektionstryck som påverkar påfågelögats vingar.", ["Fåglar på avstånd gynnar kamouflerade undersidor.", "Fåglar som kommer nära gynnar ögonfläckar och plötsliga vingrörelser.", "Kyla på våren gynnar mörka vingar som tar upp solvärme.", "Partnerval kan gynna färger som gör att fjärilarna känner igen varandra."]], ["Beskriv experimentet som testade om ögonfläckarna skrämmer fåglar. Vilken var hypotesen, och vad blev resultatet?", ["Hypotes: ögonfläckarna skrämmer bort attackerande fåglar. Forskarna målade över ögonfläckarna på en grupp, klippte bort den del som ger väsande ljud på en annan, och gjorde båda delarna på en tredje. Varje grupp hade kontroller som behandlades lika men behöll sina egenskaper. Fjärilarna fick vara i ett rum med en blåmes. Bara 3 % av fjärilarna med ögonfläckar blev uppätna, men 35 % av dem utan. Ljudet spelade ingen roll."]], ["Varför behövdes kontrollgrupper i experimentet?", ["För att vara säker på att det var just ögonfläckarna som gjorde skillnad och inte själva hanteringen, målarfärgen eller klippandet. Kontrollerna behandlades på samma sätt, men utan att ögonfläckarna eller ljudet togs bort."]], ["Varför räknas det väsande ljudet inte som en anpassning?", ["Experimentet visade att ljudet inte skrämde fåglarna. Det är troligen bara en bieffekt av hur fjärilen rör vingarna och har inte formats av det naturliga urvalet för en funktion."]]], "mc": [["Hur stor andel av fjärilarna med ögonfläckar blev tagna av blåmesar i experimentet?", ["3 %", "15 %", "35 %", "50 %"], 0, "3 % mot 35 % för dem utan ögonfläckar."], ["Vad visade experimentet om det väsande ljudet?", ["Det skrämde fåglarna mest", "Det hade ingen effekt", "Det lockade fåglar", "Det skyddade bara hanar"], 1, "Ljudet är en bieffekt, inte en anpassning."], ["Varför kan mörka vingundersidor vara bra på våren?", ["De syns bättre", "De tar upp mer solvärme", "De gör fjärilen tyngre", "De lockar partner"], 1, "Mörka färger absorberar mer värme än ljusa."], ["Vad är selektion ett annat ord för?", ["Mutation", "Urval", "Anpassning", "Variation"], 1, "Selektion = urval, från engelskans ”selection”."], ["Vilket påstående stämmer?", ["En egenskap påverkas alltid av ett enda selektionstryck", "En egenskap kan påverkas av flera olika selektionstryck samtidigt", "Selektionstryck finns bara hos fjärilar", "Selektionstryck är samma sak som mutationer"], 1, "Påfågelögats vingar påverkas av minst fyra."]], "ovn": ["o_ogon", "s_anpassn"]}, {"id": "p4", "n": 4, "c": "del", "day": "Fredag 27/11", "t": "Riktat, stabiliserande och disruptivt urval", "lasa": [["Biologi Campus", "s. 20–22", "De tre typerna av urval med diagrammen, och ”Anpassningar är kompromisser”."]], "gissa": ["Barn som föds väldigt små och barn som föds väldigt stora har något högre risk än barn med medelvikt. Vad tror du händer med födelsevikten över många generationer?", "Den förblir ungefär densamma. Urvalet gynnar mittenvärdet och missgynnar ytterligheterna. Det kallas stabiliserande urval."], "guide": ["Vad som händer med kurvan vid riktat, stabiliserande och disruptivt urval.", "Ett exempel på varje typ av urval.", "Hur disruptivt urval kan leda till två nya arter.", "Varför anpassningar alltid är kompromisser."], "punkter": [["Riktat urval: urvalet verkar i samma riktning under lång tid, och egenskapen förändras (påfågelögats mörka undersidor).", ["riktat"]], ["Stabiliserande urval: medelvärdet gynnas och ytterligheterna missgynnas, så egenskapen bevaras (födelsevikt hos barn).", ["stabiliserande"]], ["Disruptivt urval: ytterligheterna gynnas och mitten missgynnas, så variationen ökar (Darwinfinkarnas näbbar).", ["disruptivt"]], ["Disruptivt urval kan splittra en population i två och ge två nya arter.", ["två arter|splittr"]], ["Anpassningar är kompromisser: fåglarnas ihåliga skelett är lätt men bräckligt.", ["kompromiss"]]], "fragor": [["Förklara skillnaden mellan riktat och disruptivt urval.", ["Vid riktat urval gynnas individer i ena änden av variationen, så hela populationens medelvärde förskjuts åt det hållet. Vid disruptivt urval gynnas båda ytterligheterna medan mitten missgynnas, så variationen ökar och populationen kan delas i två."]], ["Vad är stabiliserande urval? Ge ett exempel.", ["Urval som bevarar en egenskap i sitt nuvarande tillstånd genom att mitten gynnas och ytterligheterna missgynnas. Exempel: födelsevikt hos barn – dödligheten är lägst för barn med medelvikt."]], ["Forskare mäter smultron i en population. Den vanligaste omkretsen är 1 cm. Vilken omkrets bör de flesta ha efter tio generationer av stabiliserande urval? Motivera.", ["1 cm. Vid stabiliserande urval bevaras medelvärdet, bara ytterligheterna blir färre."]], ["Hur kan disruptivt urval leda till nya arter?", ["När båda ytterligheterna gynnas blir de vanligare medan mellanformerna blir färre. Med tiden kan populationen splittras i två grupper som skiljer sig så mycket att de blir två arter. Man tror att Darwinfinkarna håller på att delas upp så, med smala respektive tjocka näbbar."]], ["Ge ett exempel på riktat urval och beskriv vad som händer.", ["Påfågelögats vingundersidor: ljusa varianter har under lång tid missgynnats eftersom fåglar lättare hittar dem. Därför har populationen gradvis förskjutits mot allt mörkare undersidor."]], ["Varför är anpassningar alltid kompromisser? Ge ett exempel.", ["De flesta egenskaper har både för- och nackdelar. Fåglar har ihåliga skelett som gör dem lätta och bra på att flyga, men skelettet blir bräckligare. Utformningen är en avvägning mellan låg vikt och en hållbar konstruktion."]]], "mc": [["Vid vilken typ av urval ökar variationen i populationen?", ["Riktat", "Stabiliserande", "Disruptivt"], 2, "Ytterligheterna gynnas, mitten minskar."], ["Födelsevikt hos barn är ett exempel på …", ["riktat urval", "stabiliserande urval", "disruptivt urval", "sexuell selektion"], 1, "Medelvikt har lägst dödlighet."], ["Darwinfinkarnas näbbar (smala och tjocka gynnas) är ett exempel på …", ["riktat urval", "stabiliserande urval", "disruptivt urval", "konvergent evolution"], 2, "Mellanstora näbbar missgynnas."], ["Vid riktat urval …", ["förskjuts kurvan åt ett håll", "blir kurvan smalare", "delas kurvan i två toppar", "händer ingenting"], 0, "Medelvärdet förskjuts i urvalets riktning."], ["Varför kan fåglarnas skelett inte bli hur lätt som helst?", ["Fåglar behöver inte vara lätta", "Ett tunnare skelett blir för bräckligt", "Skelettet består av fjädrar", "Det finns ingen variation"], 1, "Anpassningar är kompromisser."]], "ovn": ["f_urval", "s_urval"]}, {"id": "p5", "n": 5, "c": "arv", "day": "Måndag 30/11", "t": "Sexuell selektion och fitness", "lasa": [["Biologi Campus", "s. 23–26", "Paradisänkan, honor väljer hane, ladusvalan, experimentet ”Hur vet vi…”, och faktarutan om fitness."]], "gissa": ["Paradisänkans hane har en stjärt som är en halvmeter lång. Den syns på en kilometers avstånd för rovdjur och gör det svårare att flyga. Varför har den ändå utvecklats?", "Honorna väljer hanar med långa stjärtar. Hanen kanske dör tidigare, men han hinner para sig med fler honor och får fler ungar. Det kallas sexuell selektion."], "guide": ["Vad sexuell selektion och honligt val är.", "Vad ett ornament är.", "Experimenten med paradisänkan och ladusvalan.", "Vad fitness betyder, och varför fortplantning är ett bättre mått än överlevnad."], "punkter": [["Sexuell selektion: egenskaper som direkt ökar en individs framgång vid fortplantningen gynnas.", ["sexuell selektion"]], ["Honligt val: honorna väljer hanar med till exempel lång stjärt. Hanarna konkurrerar om honorna.", ["honligt val|honorna väljer"]], ["Anpassningar som ökar chansen att bli vald av det motsatta könet kallas ornament.", ["ornament"]], ["I experimentet fick paradisänkehanar med förlängd stjärt flest honor och de med förkortad färst.", ["förläng|experiment"]], ["Sexuell selektion och naturligt urval kan verka åt olika håll. Stjärtlängden balanseras av två motsatta selektionstryck.", ["motsatt|balans"]], ["Fitness (fortplantningsframgång) är antalet ungar en individ får som överlever och kan fortplanta sig.", ["fitness"]], ["En egenskap som förkortar livet kan gynnas om individen ändå får fler ungar.", ["livslängd|kortare liv"]]], "fragor": [["Förklara vad sexuell selektion är.", ["En variant av naturligt urval där egenskaper som ökar en individs chans att få para sig gynnas. Det kan ske genom att det ena könet väljer partner (honligt val) eller genom att individer konkurrerar om partners."]], ["Varför har paradisänkans hanar så långa stjärtar trots att det är en nackdel för överlevnaden?", ["Honorna väljer hanar med långa stjärtar. En hane med lång stjärt får para sig med fler honor och får därmed fler ungar, även om han löper större risk att bli tagen av rovdjur. Fördelen vid fortplantningen väger tyngre."]], ["Beskriv experimentet med paradisänkornas stjärtar. Vilken var hypotesen och vad blev resultatet?", ["Hypotes: honornas val driver utvecklingen av långa stjärtar. Forskaren klippte av stjärtfjädrar på vissa hanar och klistrade fast dem på andra så att stjärten förlängdes. Kontrollhanar fångades eller klipptes och limmades ihop igen utan att längden ändrades. Hanar med förlängd stjärt fick flest honor i sina revir och de med förkortad färst, vilket stödde hypotesen."]], ["Vad är ett ornament?", ["En anpassning som ökar chansen att bli vald av det motsatta könet, till exempel paradisänkehanens långa stjärt."]], ["Vad visade undersökningen på ladusvalor?", ["Hanar som fått förlängda stjärtar bildade par tidigare på våren och hann därför ofta få två kullar. De parade sig också dubbelt så ofta med grannens hona som kortstjärtade hanar."]], ["Varför är fortplantningsframgång ett bättre mått på fitness än överlevnad?", ["Det är generna som förs vidare till nästa generation som avgör evolutionen. En individ som lever länge men får få ungar bidrar mindre till nästa generation än en som lever kort men får många ungar."]], ["Hur kan en egenskap som leder till kortare liv ändå gynnas av det naturliga urvalet?", ["Om egenskapen gör att individen får fler ungar under sitt liv får den högre fitness. Exempel: en ekorre som föder upp fem ungar per år i tre år får 15 ungar, medan en som föder två per år i sex år får 12. Om skillnaden är ärftlig blir egenskapen vanligare."]]], "mc": [["Vad är fitness?", ["Hur stark en individ är", "Hur länge en individ lever", "Hur många ungar en individ får som själva kan fortplanta sig", "Hur snabbt en individ springer"], 2, "Fitness = fortplantningsframgång."], ["Ekorre A får 5 ungar per år i 3 år. Ekorre B får 2 per år i 6 år. Vem har högst fitness?", ["A", "B", "Lika"], 0, "A får 15 ungar, B får 12."], ["Vad kallas det när honorna väljer hanar?", ["Konvergent evolution", "Honligt val", "Genetisk drift", "Kamouflage"], 1, "Honligt val är en form av sexuell selektion."], ["Vilken grupp fick flest honor i experimentet med paradisänkan?", ["Förkortad stjärt", "Kontroll", "Förlängd stjärt"], 2, "Det stödde hypotesen om honligt val."], ["Vilket påstående stämmer?", ["Sexuell selektion är en variant av naturligt urval", "Sexuell selektion är motsatsen till evolution", "Sexuell selektion finns bara hos fåglar", "Sexuell selektion beror på mutationer"], 0, "Darwin föreslog själv det."]], "ovn": ["o_fitness", "s_selektion"]}, {"id": "p6", "n": 6, "c": "arv", "day": "Tisdag 1/12", "t": "Artbildning och artbegrepp", "lasa": [["Biologi Campus", "s. 27–33", "Hawaii och silversvärdsväxterna, isolering, ciklider, Darwin och artbildning, de tre artbegreppen och begreppskontrollen på s. 33."]], "gissa": ["På Hawaii har hälften av alla arter uppstått på öarna. Hur kan några få frön från Amerika ha blivit 28 olika arter?", "Fröna hamnade på isolerade öar med en annan miljö och lediga nischer. Där utsattes växterna för andra selektionstryck. Ö för ö blev populationerna isolerade, utvecklades åt olika håll och blev till slut egna arter."], "guide": ["De två stegen i artbildning: geografisk och reproduktiv isolering.", "Silversvärdsväxterna och fruktflugorna på Hawaii.", "Hur ciklider kan ha bildat arter utan geografisk barriär.", "De tre artbegreppen och problemen med vart och ett."], "punkter": [["Artbildning: en art delas upp i två nya arter.", ["artbildning"]], ["Steg 1: geografisk isolering – en barriär, som havet, skiljer populationerna åt.", ["geografisk"]], ["Steg 2: reproduktiv isolering – populationerna kan inte längre fortplanta sig med varandra, även om de möts.", ["reproduktiv"]], ["Endemiska arter finns bara på ett ställe, som silversvärdsväxterna på Hawaii.", ["endemisk"]], ["Isolering behöver inte vara geografisk: ciklider i Victoriasjön fick olika syn och valde olika partner.", ["ciklid|syn"]], ["Taxonomiska artbegreppet: arter skiljer sig i utseende (morfologi).", ["taxonomisk"]], ["Biologiska artbegreppet: en art är en grupp som är reproduktivt isolerad från andra.", ["biologisk"]], ["Fylogenetiska artbegreppet: en art är alla ättlingar till en gemensam förfader med egna unika egenskaper.", ["fylogenetisk"]]], "fragor": [["Beskriv de två stegen i artbildning.", ["1. Geografisk isolering: populationer skiljs åt av en barriär, till exempel ett hav, och kan inte längre para sig med varandra.", "2. Reproduktiv isolering: populationerna utvecklas åt olika håll eftersom de utsätts för olika selektionstryck, tills de inte längre kan fortplanta sig med varandra ens om de möts. Då har två arter bildats."]], ["Varför har det bildats så många nya arter på Hawaii?", ["Öarna ligger mycket isolerat. De få arter som kom dit hamnade i en ny miljö med andra selektionstryck och många lediga nischer. När arterna spred sig från ö till ö blev populationerna isolerade igen och utvecklades åt olika håll. Så har det skett gång på gång."]], ["Vad betyder endemisk? Ge ett exempel.", ["En art som bara finns på ett begränsat område. Exempel: silversvärdsväxterna på Hawaii eller brun ögontröst på Gotland."]], ["Hur kan nya arter uppstå utan geografisk isolering? Ge ett exempel.", ["Om populationer i olika miljöer utsätts för olika selektionstryck kan de bli reproduktivt isolerade ändå. I Victoriasjön är vattnet olika grumligt på olika platser. Ciklider utvecklade ögon som ser olika våglängder, och eftersom synen används för att hitta partner slutade populationerna para sig med varandra."]], ["Beskriv de tre artbegreppen.", ["Taxonomiska: en art skiljer sig från andra i minst två morfologiska (utseendemässiga) karaktärer.", "Biologiska: en art är en grupp individer som är reproduktivt isolerad från andra grupper.", "Fylogenetiska: en art är en grupp med en gemensam förfader som delar egenskaper som ingen annan art har."]], ["Vilka problem har det biologiska artbegreppet?", ["Det fungerar bara för populationer i samma område – man kan inte avgöra om europeiska och amerikanska älgar skulle para sig. Det fungerar inte heller för organismer som förökar sig könlöst, som många bakterier."]], ["Varför räcker det inte med ett enda artbegrepp?", ["Varje begrepp har brister och passar olika situationer. Därför används de omväxlande beroende på syfte och vilken kunskap man har."]], ["På Galapagos finns 14 finkarter som alla härstammar från en art som kom från fastlandet. Beskriv hur det kan ha gått till.", ["Några finkar kom till öarna och spred sig till olika öar. Populationerna blev geografiskt isolerade. På varje ö fanns olika föda, till exempel olika stora frön och insekter, vilket gav olika selektionstryck på näbbarna. Med tiden blev populationerna så olika att de blev reproduktivt isolerade, och nya arter bildades."]]], "mc": [["Vilket är det andra steget i artbildning?", ["Geografisk isolering", "Reproduktiv isolering", "Mutation", "Konvergent evolution"], 1, "Först geografisk, sedan reproduktiv isolering."], ["Enligt vilket artbegrepp tillhör golden retriever och yorkshireterrier samma art?", ["Bara det taxonomiska", "Det biologiska och det fylogenetiska", "Inget", "Bara det fylogenetiska"], 1, "De kan para sig och har gemensam förfader."], ["Vilket artbegrepp fungerar för bakterier som förökar sig könlöst?", ["Biologiska", "Fylogenetiska", "Inget av dem"], 1, "Det kräver ingen reproduktiv isolering."], ["Vad betyder endemisk?", ["Utdöd", "Finns bara på ett begränsat område", "Finns överallt", "Hotad"], 1, "Till exempel silversvärdsväxterna på Hawaii."], ["Vad orsakade troligen artbildningen hos ciklider i Victoriasjön?", ["Ett berg delade sjön", "Olika syn ledde till olika partnerval", "Människan flyttade fiskarna", "Mutationer i fenorna"], 1, "Reproduktiv isolering utan geografisk barriär."]], "ovn": ["o_artbildning", "s_artbegrepp"]}, {"id": "p7", "n": 7, "c": "dna", "day": "Torsdag 3/12", "t": "Den tidiga jorden och kemisk evolution", "lasa": [["Biologi Campus", "s. 34–41", "Tidsskalan, vad liv är, skapelseberättelser, den tidiga jorden, Millers försök, heta källor, rymden och självkopierande molekyler."]], "gissa": ["Hur kan något levande ha bildats av ämnen som inte lever?", "Under den kemiska evolutionen bildades först enkla molekyler, som aminosyror, genom spontana kemiska reaktioner. Sedan fogades de ihop till större molekyler, och till slut uppstod molekyler som kunde kopiera sig själva. Då kunde det naturliga urvalet börja."], "guide": ["Vad som kännetecknar liv.", "Hur jorden såg ut i början: atmosfär, temperatur och hav.", "Vad kemisk evolution är.", "Millers försök och de andra hypoteserna om var livets byggstenar bildades.", "Varför självkopierande molekyler var så viktiga, och varför RNA tros ha kommit före DNA."], "punkter": [["Liv kännetecknas av att det kan fortplanta sig och har en ämnesomsättning (metabolism).", ["fortplanta|metabolism|ämnesomsättning"]], ["Universum bildades vid Big Bang för cirka 14 miljarder år sedan. Jorden bildades för cirka 4,6 miljarder år sedan.", ["big bang|4,6"]], ["Den tidiga atmosfären bestod av vattenånga, koldioxid och kvävgas – men inget syre.", ["koldioxid|kvävgas"]], ["Kemisk evolution: enkla molekyler som aminosyror, nukleotider och lipider bildades och fogades ihop till proteiner, RNA, DNA och membran.", ["kemisk evolution"]], ["Miller visade på 1950-talet att aminosyror kan bildas med hjälp av gaser, vatten och elektriska urladdningar.", ["miller"]], ["Andra hypoteser: byggstenarna bildades vid heta källor på havsbotten eller kom från rymden med meteoriter och kometer.", ["heta källor|rymden|meteorit"]], ["Självkopierande molekyler var avgörande, för då kunde det naturliga urvalet börja verka.", ["självkopier"]], ["RNA tros ha kommit före DNA. RNA kan både kopiera sig och fungera som enzym.", ["rna"]]], "fragor": [["Vad kännetecknar liv som vi känner det från jorden?", ["Levande organismer kan fortplanta sig och har en metabolism, alltså kan de bygga upp och bryta ner ämnen och utvinna energi. Andra typiska egenskaper är att de kan växa, röra sig, kommunicera, hålla en stabil inre miljö och anpassa sig. Cellen är den minsta självständiga enheten av liv."]], ["Vad innebär kemisk evolution?", ["Den utveckling som skedde innan det första livet: enkla molekyler som aminosyror, nukleotider och lipider bildades genom spontana kemiska reaktioner. De fogades sedan ihop till mer komplexa molekyler, som proteiner, DNA, RNA och membranblåsor."]], ["Vad menas med Big Bang?", ["Att universum uppstod för cirka 14 miljarder år sedan ur en oändligt liten punkt som började expandera. Spår av Big Bang syns i dag till exempel genom den kosmiska bakgrundsstrålningen."]], ["Beskriv Millers försök. Vad ville han visa och vad blev resultatet?", ["Miller ville undersöka om livets byggstenar kunde bildas under förhållanden som på den tidiga jorden. Han värmde vatten (som motsvarade haven), ledde vattenångan till en gasblandning av ammoniak, metan och väte och utsatte den för elektriska urladdningar som skulle efterlikna blixtar. Sedan kyldes allt ner, som regn. Efter en vecka fanns det aminosyror i vattnet."]], ["Beskriv två andra hypoteser om var livets byggstenar kan ha bildats.", ["Heta källor på havsbotten (black smokers) släpper ut varma gaser med alla ämnen som behövs, och livet kan ha uppstått i temperaturskillnaden mellan det varma och kalla vattnet.", "Rymden: aminosyror har hittats i rymden, och de kan ha förts till jorden med meteoriter, kometer och stoft."]], ["I dag består atmosfären mest av kvävgas och syrgas. Vilka gaser fanns i den tidiga atmosfären, och vad kan skillnaden bero på?", ["Den tidiga atmosfären bestod främst av vattenånga, koldioxid och kvävgas. Skillnaden beror på fotosyntesen, som tog upp koldioxid och bildade syre."]], ["Förklara hur självkopiering hos molekyler leder till naturligt urval.", ["Om molekylerna varierar och kopierar sig olika snabbt blir de snabbaste fler och fler. Exempel: en variant som kopierar sig var 10:e minut är dubbelt så vanlig efter 20 minuter och åtta gånger så vanlig efter en timme som en variant som kopierar sig var 20:e minut. Det är naturligt urval – utan att något lever."]], ["Varför tror man att RNA kom före DNA?", ["Korta RNA-molekyler kan bildas på ytan av lerpartiklar. På 1980-talet visade forskare dessutom att RNA kan fungera som enzym och katalysera reaktioner. De första RNA-molekylerna kunde alltså kopiera sig själva utan proteiner."]]], "mc": [["Hur gammal är jorden ungefär?", ["4 600 år", "4,6 miljoner år", "4,6 miljarder år", "14 miljarder år"], 2, "Universum är cirka 14 miljarder år."], ["Vad fanns INTE i den tidiga atmosfären?", ["Vattenånga", "Koldioxid", "Kvävgas", "Syre"], 3, "Syret kom senare, från fotosyntesen."], ["Vad hittade Miller efter en vecka?", ["Celler", "Aminosyror", "DNA", "Bakterier"], 1, "Livets byggstenar kan bildas ganska enkelt."], ["Vad är speciellt med ekosystemen vid heta källor på havsbotten?", ["De är oberoende av solens energi", "De har inga bakterier", "De är kalla", "De finns bara i sjöar"], 0, "Svavelbakterier utvinner energi ur svavelväte."], ["En RNA-variant kopierar sig var 10:e minut, en annan var 20:e. Hur många gånger vanligare är den snabba efter 60 minuter?", ["2", "4", "8", "60"], 2, "Den snabba hinner 6 kopieringar (2⁶ = 64), den långsamma 3 (2³ = 8). 64 / 8 = 8."], ["Vilken molekyl tros ha kommit först?", ["DNA", "RNA", "Protein", "Glukos"], 1, "RNA kan både lagra information och fungera som enzym."]], "ovn": ["f_miller", "o_tidslinje", "s_hypoteser"]}, {"id": "p8", "n": 8, "c": "dna", "day": "Fredag 4/12", "t": "De första cellerna, energi och fakta–hypotes–teori", "lasa": [["Biologi Campus", "s. 42–49", "Den första cellen, fotosyntesen, syrekatastrofen, cellandningen, ”Fakta, hypotes och teori” och begreppskontrollen på s. 49."]], "gissa": ["Syre är livsviktigt för oss. Men när syret först kom in i atmosfären dog nästan allt liv. Hur kan det komma sig?", "De första organismerna levde i en värld utan syre, och för dem var syre ett gift. När fotosyntesen började släppa ut syre blev det en katastrof – syrekatastrofen. Bara de som anpassade sig, och till slut började använda syret i cellandningen, klarade sig."], "guide": ["Hur fosfolipider kan bilda membran och vesiklar.", "Hur fotosyntesen uppkom och varför det ledde till syrekatastrofen.", "Hur cellandningen och fotosyntesen hänger ihop.", "Skillnaden mellan fakta, hypotes och teori i vetenskapen."], "punkter": [["Fosfolipider har en vattenälskande (hydrofil) och en vattenskyende (hydrofob) del. I vatten bildar de dubbla skikt och blåsor, vesiklar.", ["fosfolipid|vesik"]], ["Ur-cellerna bestod troligen av ett enkelt membran och en RNA-molekyl.", ["ur-cell|membran"]], ["Fotosyntes: ljusenergi omvandlas till kemisk energi. Koldioxid och vatten blir socker och syre.", ["fotosyntes"]], ["Syrekatastrofen: syret var giftigt för de flesta organismer och ledde till det första massutdöendet för cirka 2,5 miljarder år sedan.", ["syrekatastrof"]], ["Syret bröt ner metan, vilket ledde till istider. Syre och järn bildade järnmalm som föll ut på havsbotten.", ["järn|istid|metan"]], ["Cellandning: syre används för att frigöra energi ur socker. Koldioxid och vatten bildas.", ["cellandning"]], ["Fotosyntes och cellandning bildar livets mest grundläggande kretslopp för kol och syre.", ["kretslopp"]], ["Fakta = observationer och förklaringar som testats så många gånger att de inte ifrågasätts. Hypotes = en testbar förklaring. Teori = många sammanlänkade hypoteser med starkt stöd.", ["hypotes", "teori"]]], "fragor": [["Beskriv hur cellmembranen hos de första cellerna kan ha bildats av fosfolipider.", ["Fosfolipider har en hydrofil del som dras till vatten och en hydrofob del som skyr vatten. I vatten vänder sig de hydrofoba delarna mot varandra och de hydrofila mot vattnet, så det bildas ett dubbelt skikt. Sådana skikt bildar spontant ihåliga blåsor, vesiklar, som kan ha blivit de första enkla cellerna."]], ["Beskriv hur den första cellen kan ha uppkommit.", ["En vesikel av fosfolipider kan ha omslutit en RNA-molekyl. RNA kunde kopiera sig själv och kanske bilda fettmolekyler till sitt eget membran. Vesiklarna kunde växa och dela sig när de blev för stora – de första enkla celldelningarna."]], ["Förklara hur den järnmalm som vi bryter i dag bildades.", ["När fotosyntesen började släppa ut syre reagerade syret med järnjoner i haven. Det bildades svårlösliga järnmineraler som föll ut på havsbotten. Det är dem vi bryter som järnmalm."]], ["Vad var det som gjorde att syrgashalten ökade i atmosfären, och hur påverkade det livets utveckling?", ["Fotosyntesen hos bakterier släppte ut syre som biprodukt. Syret var giftigt för de flesta organismer, och det blev det första massutdöendet (syrekatastrofen). Syret bröt också ner växthusgasen metan, så jorden kyldes och det blev istider. Men vissa organismer anpassade sig och började använda syret i cellandningen."]], ["Förklara hur fotosyntes och cellandning hänger ihop.", ["I fotosyntesen används koldioxid, vatten och ljusenergi för att bilda socker och syre. I cellandningen används socker och syre för att frigöra energi, och det bildas koldioxid och vatten. Produkterna från den ena processen är alltså råvarorna till den andra – ett kretslopp för kol och syre."]], ["Vad är skillnaden mellan fakta, hypotes och teori i vetenskapen?", ["Fakta är observationer, mätningar och förklaringar som testats så många gånger att de inte längre ifrågasätts. En hypotes är en välgrundad förklaring som måste gå att testa, och den kan förkastas men aldrig bevisas helt. En teori består av många sammanlänkade hypoteser som förklarar ett stort antal observationer och har starkt stöd."]], ["Vad menas med att evolutionsteorin inte är en teori om att evolution har skett?", ["Att evolution har skett är fakta. Evolutionsteorin är en förklaring till hur och varför evolutionen sker, alltså vilka mekanismer som driver den."]], ["Hur har evolutionsteorin förändrats sedan Darwin?", ["Naturligt urval är fortfarande den viktigaste mekanismen, men i dag ingår även till exempel genetisk drift. Reproduktiv isolering som en viktig del av artbildning tillkom i mitten av 1900-talet. Teorin förändras när nya fakta tillkommer."]]], "mc": [["Vad bildas i fotosyntesen?", ["Koldioxid och vatten", "Socker och syre", "Socker och koldioxid", "Syre och vatten"], 1, "6CO₂ + 6H₂O + ljus → C₆H₁₂O₆ + 6O₂"], ["Vad bildas i cellandningen?", ["Socker och syre", "Koldioxid, vatten och energi", "Bara syre", "Proteiner"], 1, "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energi"], ["Vad var syrekatastrofen?", ["När syret tog slut", "När syre i atmosfären dödade många organismer", "En vulkan", "När dinosaurierna dog ut"], 1, "Det första massutdöendet, för cirka 2,5 miljarder år sedan."], ["Vilka organismer bildade det första syret?", ["Djur", "Svampar", "Fotosyntetiserande bakterier (som cyanobakterier)", "Virus"], 2, "Stromatoliter visar spår av dem."], ["Vad är en hypotes?", ["En bevisad sanning", "En välgrundad förklaring som går att testa", "Samma sak som en åsikt", "En samling teorier"], 1, "Den kan förkastas men aldrig bevisas helt sann."], ["Vilken kunskap är säkrast i vetenskapen?", ["En hypotes", "En gissning", "En teori", "En åsikt"], 2, "En teori bygger på många hypoteser med starkt stöd."]], "ovn": ["f_kretslopp", "f_vesikel", "s_fht", "o_cell"]}, {"id": "p9", "n": 9, "c": "epi", "day": "Måndag 7/12", "t": "Genetik och evolution: Hardy-Weinberg och genetisk drift", "lasa": [["Biologi Campus", "s. 202–207", "Genetisk definition av evolution, laktostolerans, Hardy-Weinbergs lag, faktarutan om beräkningar och de fem evolutionära mekanismerna."]], "gissa": ["Forskare startade 107 likadana populationer av bananflugor, alla med lika många alleler för vita och röda ögon. Efter 19 generationer hade vissa bara vita ögon och andra bara röda. Varför blev de så olika?", "Av ren slump! I små populationer kan en allel råka föras vidare oftare än en annan, eller helt försvinna. Det kallas genetisk drift."], "guide": ["Den genetiska definitionen av evolution.", "Exemplet med laktostolerans.", "Hardy-Weinbergs lag och de fem villkoren.", "Hur man räknar ut allel- och genotypfrekvenser.", "De fem evolutionära mekanismerna och ett exempel på varje."], "punkter": [["Evolution = förändring av allel- och genotypfrekvenser i en population.", ["frekvens"]], ["Hardy-Weinbergs lag: i jämvikt förändras inte frekvenserna, och då sker ingen evolution.", ["hardy|jämvikt"]], ["Fem villkor: slumpmässig parning, oändligt stor population, ingen in- eller utvandring, inga mutationer, inget urval.", ["villkor|slumpmässig"]], ["p + q = 1 och p² + 2pq + q² = 1.", ["p²|2pq|p + q"]], ["Icke slumpmässig parning kan ge inavel, som hos den svenska vargstammen.", ["inavel|varg"]], ["Genetisk drift: slumpen ändrar allelfrekvenserna, särskilt i små populationer som den svenska fjällräven.", ["drift"]], ["Genflöde (migration) jämnar ut skillnader mellan populationer, som gröna korridorer för jättepandan.", ["genflöde|migration"]], ["Mutationer är den enda källan till ny genetisk variation.", ["mutation"]], ["Selektion är den enda mekanismen som anpassar populationer till miljön.", ["selektion|anpass"]]], "fragor": [["Vad är den genetiska definitionen av evolution?", ["Evolution sker när allel- och genotypfrekvenserna förändras i en population."]], ["Vad innebär Hardy-Weinbergjämvikt, och vilka fem villkor krävs?", ["I jämvikt förblir allel- och genotypfrekvenserna oförändrade generation efter generation, alltså sker ingen evolution. Villkor: 1) slumpmässig parning, 2) oändligt stor population, 3) ingen in- eller utvandring, 4) inga mutationer, 5) inget urval."]], ["Varför kan man säga att evolution sker först när något av villkoren inte är uppfyllt?", ["Om alla villkor är uppfyllda ändras inte allelfrekvenserna, och då sker per definition ingen evolution. Varje brutet villkor motsvarar en evolutionär mekanism som kan ändra frekvenserna."]], ["I en population med 1 000 växter har 360 genotypen AA, 480 Aa och 160 aa. Beräkna allelfrekvenserna för A och a.", ["Det finns 2 000 alleler. A: (360 · 2 + 480) / 2 000 = 1 200 / 2 000 = 0,6. a: 1 − 0,6 = 0,4."]], ["Allelfrekvensen för A är 0,8 i en population i Hardy-Weinbergjämvikt. Vilka blir genotypfrekvenserna?", ["p = 0,8 och q = 0,2. AA = p² = 0,64. Aa = 2pq = 2 · 0,8 · 0,2 = 0,32. aa = q² = 0,04. Summan blir 1."]], ["Vad är genetisk drift, och när blir den en viktig evolutionär mekanism?", ["Att allelfrekvenserna förändras slumpmässigt, för att vissa alleler av ren slump förs vidare oftare än andra. Den blir viktig i små populationer, där en allel snabbt kan öka eller försvinna helt, som i experimentet med bananflugorna."]], ["Hur kan icke slumpmässig parning uppstå, och vad kan det leda till?", ["Om en population är uppdelad i små grupper parar sig släktingar oftare med varandra. Det kallas inavel och ökar risken att individer blir homozygota för skadliga recessiva alleler, som hos den svenska vargstammen med skelettskador."]], ["Hur kan genflöde hjälpa hotade arter? Ge ett exempel.", ["Genflöde mellan populationer ökar den genetiska variationen. Man kan flytta individer till hotade populationer eller bygga gröna korridorer mellan populationer, som för jättepandan i Kina, eller sätta ut individer som för pilgrimsfalken i Sverige."]], ["Varför är mutationer viktiga för evolutionen trots att de sällan ändrar allelfrekvenserna märkbart?", ["Mutationer är den enda källan till helt ny genetisk variation. Alla alleler har någon gång uppstått genom mutationer, och de är råmaterialet för det naturliga urvalet."]], ["Vilken viktig skillnad finns mellan selektion och de andra evolutionära mekanismerna?", ["Selektion är den enda mekanismen som leder till att populationer successivt anpassas till sin miljö. Drift, inavel och migration ändrar frekvenserna utan att det blir bättre anpassning."]]], "mc": [["Vad betyder Hardy-Weinbergjämvikt?", ["Att evolution sker snabbt", "Att allel- och genotypfrekvenserna inte förändras", "Att alla individer är lika", "Att populationen dör ut"], 1, "Ingen evolution sker."], ["Allelfrekvensen för a är 0,3. Vad är frekvensen för A?", ["0,3", "0,7", "0,09", "0,49"], 1, "p + q = 1, alltså 1 − 0,3 = 0,7."], ["p = 0,7 och q = 0,3. Vad är frekvensen heterozygoter (Aa)?", ["0,21", "0,42", "0,49", "0,09"], 1, "2pq = 2 · 0,7 · 0,3 = 0,42."], ["Vilken mekanism är viktigast i en mycket liten population?", ["Mutationer", "Genetisk drift", "Hardy-Weinbergjämvikt", "Fotosyntes"], 1, "Slumpen får stor effekt i små populationer."], ["Den svenska vargstammen har många genetiska sjukdomar. Vad beror det främst på?", ["Mutationer", "Inavel", "Genflöde", "Riktat urval"], 1, "Släktingar parar sig med varandra."], ["Vilken mekanism är den enda som ger anpassning till miljön?", ["Genetisk drift", "Migration", "Selektion", "Inavel"], 2, "Naturligt urval gynnar egenskaper som passar miljön."], ["Hur stor del av den vuxna befolkningen i Sverige kan bryta ner laktos?", ["Under 2 %", "Cirka 25 %", "Över 75 %", "Alla"], 2, "Mutationen som håller genen aktiv är vanlig i Norden."]], "ovn": ["s_mekanism", "s_hwvillkor", "o_drift"]}, {"id": "p10", "n": 10, "c": "rep", "day": "Tisdag 8/12", "t": "Repetition: allt blandat", "rep": true, "ovn": ["o_tidslinje", "f_urval", "s_mekanism", "s_artbegrepp", "f_kretslopp"]}, {"id": "p11", "n": 11, "c": "rep", "day": "Torsdag 10/12", "t": "Provträning inför fredagen", "rep": true, "ovn": ["o_urval", "o_artbildning", "s_fht", "f_miller"]}], "ORDER": {"o_urval": ["Så fungerar naturligt urval", "his", "Börja med det som alltid finns i en population.", ["Individerna i en art skiljer sig åt (variation)", "En del av variationen är ärftlig", "Det föds fler individer än resurserna räcker till", "Individerna konkurrerar om resurserna", "De med bäst egenskaper för miljön överlever oftare och får fler ungar", "Deras ärftliga egenskaper blir vanligare i nästa generation", "Arten blir successivt bättre anpassad till miljön"]], "o_artbildning": ["Så bildas en ny art", "arv", "Börja när några individer hamnar på en ny plats.", ["Några individer sprids till en isolerad ö", "Havet blir en geografisk barriär", "Den nya miljön ger andra selektionstryck", "Populationerna utvecklas åt olika håll", "Populationerna kan inte längre fortplanta sig med varandra (reproduktiv isolering)", "Två arter har bildats"]], "o_tidslinje": ["Livets historia – från äldst till nyast", "dna", "Börja med jordens födelse.", ["Jorden bildas (4,6 miljarder år sedan)", "Haven bildas", "Kemisk evolution: livets byggstenar bildas", "Självkopierande molekyler (RNA)", "De första encelliga cellerna (prokaryoter)", "Fotosyntesen börjar", "Syrekatastrofen", "De först const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else e.setAttribute(k, v === true ? '' : v);

};

/* ===================== Drag-hjälp ===================== */
function dragChip(c, selector, onDrop, onTap) {
  let sx, sy, ghost = null, moved = false;
  c.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; moved = false; try { c.setPointerCapture(e.pointerId); } catch (_) {} });
  c.addEventListener('pointermove', e => {
    if (sx === undefined) return;
    if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) { ghost = c.cloneNode(true); ghost.classList.add('ghost', 'sel'); document.body.appendChild(ghost); moved = true; }
    if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
  });
  c.addEventListener('pointerup', e => { if (ghost) { const t = document.elementFromPoint(e.clientX, e.clientY); const z = t && t.closest(selector); ghost.remove(); ghost = null; if (z) onDrop(c, z); } sx = undefined; });
  c.addEventListener('pointercancel', () => { if (ghost) { ghost.remove(); ghost = null; } sx = undefined; });
  c.addEventListener('click', () => { if (moved) { moved = false; return; } onTap(c); });
}

  out.push(stepBox(p.id, 5, 'Snabbkoll (3 min)', el('p', { text: 'Flervalsfrågor i provstil. De rättas direkt.' }), mcBlock(p.mc, 'mc-' + p.id)));
  const qs = el('div'); passQs(p.id).forEach((x, k) => qs.append(qCard(x.id, { num: k + 1 })));
  out.push(stepBox(p.id, 6, 'Instuderingsfrågor (5 min)', el('p', { text: 'Gör tre eller fyra frågor skriftligt, som på provet. Resten kommer tillbaka i repetitionen.' }), qs));
  out.push(stepBox(p.id, 7, 'Övningar (5 min)', el('p', { text: 'Gör minst en.' }), exLinks(p.ovn)));
  return out;
}

function allMC() { return REAL.flatMap(p => p.mc || []); }

function repSteps(p) {
  const out = [];
  out.push(el('div', { class: 'card' }, el('p', { text: (p.id === 'p11' ? 'Dagen före provet: kör provträningen en gång och läs igenom begreppen. Sov sedan gott!' : 'Repetition: blanda allt. Först flervalsfrågor från alla avsnitt, sedan skrivfrågor. Frågor du haft svårt för kommer oftare.') })));
  const mcBox = el('div'); const fillMc = () => { mcBox.innerHTML = ''; mcBox.append(mcBlock(mix(allMC()).slice(0, 15), 'mc-' + p.id)); };
  fillMc();
  out.push(stepBox(p.id, 1, 'Blandad snabbkoll – 15 frågor', mcBox, el('button', { class: 'btn', onclick: fillMc }, 'Nya frågor')));
  out.push(stepBox(p.id, 2, 'Provträning med skrivfrågor', el('p', null, el('a', { class: 'btn main ' + kc('rep'), href: '#prov' }, 'Starta provträningen'))));
  out.push(stepBox(p.id, 3, 'Övningar', exLinks(p.ovn)));
  out.push(stepBox(p.id, 4, 'Begrepp', el('p', { text: 'Kör begreppskorten med ”Bara de jag inte kan”.' }), el('a', { class: 'btn', href: '#begrepp' }, 'Till begreppen')));
  return out;
}

function viewProv() {
  const v = el('div', { class: kc('rep') });
  v.append(topnav('prov'));
  v.append(el('div', { class: 'hero ' + kc('rep') }, el('h1', { text: 'Provträning' }),
    el('p', { text: 'Del 1: tio flervalsfrågor. Del 2: tio skrivfrågor från hela provområdet. Skriv svaren ordentligt, titta sedan på svaret och var ärlig när du markerar.' })));
  const mcBox = el('div', { class: 'card' }); mcBox.append(el('h2', { text: 'Del 1: Flerval' }), mcBlock(mix(allMC()).slice(0, 10), 'mc-prov'));
  const all = Object.keys(Q);
  const box = el('div', { class: 'card' }, el('h2', { text: 'Del 2: Skrivfrågor' }));
  const fill = () => { [...box.querySelectorAll('.qc')].forEach(x => x.remove()); pickWeighted(all, 10, 2).forEach((id, k) => box.append(qCard(id, { num: k + 1, showFrom: true }))); };
  fill();
  v.append(mcBox, box, el('div', { class: 'row' }, el('button', { class: 'btn', onclick: () => render() }, 'Nytt prov')));
  return v;
}

function viewBegrepp() {
  const v = el('div');
  v.append(topnav('begrepp'), el('h1', { text: 'Begrepp' }), el('p', { class: 'soft', text: 'Begreppen från klassens lista och böckerna, med korrekta förklaringar.' }));
  const r = el('details', { class: 'card' }, el('summary', null, el('b', { text: '⚠️ Rättelser till klassens begreppslista (' + D.RATT.length + ' st)' })),
    el('p', { class: 'small soft', text: 'De här förklaringarna i listan som klassen skrivit stämmer inte. Lär dig den rättade versionen.' }),
    ...D.RATT.map(([t, fel, ratt]) => el('div', { class: 'term k-epi' }, el('h3', { text: t }), el('p', { class: 'exm', text: 'I listan: ' + fel }), el('p', null, el('b', { text: 'Rätt: ' }), ratt))));
  if (D.RATT.length) v.append(r);
  const card = el('div', { class: 'card' });
  const filt = el('div', { class: 'tabs' }), modes = el('div', { class: 'tabs' }), body = el('div');
  let g = null, mode = 'list';
  const B = () => D.B.filter(b => !g || b[3] === g);
  [['Alla', null]].concat(Object.entries(GN).map(([k, n]) => [n, k])).forEach(([n, k]) => filt.append(el('button', { class: k ? kc(k) : '', onclick: () => { g = k; draw(); } }, n)));
  [['list', 'Läs listan'], ['match', 'Para ihop'], ['guess', 'Gissa begreppet'], ['card', 'Begreppskort']].forEach(([k, n]) => modes.append(el('button', { onclick: () => { mode = k; draw(); } }, n)));
  const draw = () => {
    [...filt.children].forEach((b, k) => b.setAttribute('aria-pressed', (k === 0 ? g === null : Object.keys(GN)[k - 1] === g) ? 'true' : 'false'));
    [...modes.children].forEach((b, k) => b.setAttribute('aria-pressed', ['list', 'match', 'guess', 'card'][k] === mode ? 'true' : 'false'));
    body.innerHTML = ''; ({ list: bList, match: bMatch, guess: bGuess, card: bCards })[mode](body, B());
  };
  card.append(el('p', { class: 'small soft', style: 'margin:0', text: 'Område' }), filt, el('p', { class: 'small soft', style: 'margin:0', text: 'Läge' }), modes, body);
  v.append(card); draw();
  return v;
}

render();
